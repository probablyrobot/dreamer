[package]
name = "app-script"
description = "The app host's TypeScript runtime: an app's app.ts, its types stripped, run in QuickJS as a client of the app process protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
api = { path = "../api" }
app-model = { path = "../app-model" }
app-protocol = { path = "../app-protocol" }
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
# `fetch`: HTTP/1.1 over rustls (ring) with webpki-roots; no gzip, cookies,
# or proxy. See docs/dependency-baseline.md.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
view-tree = { path = "../view-tree" }

[lints]
workspace = true
