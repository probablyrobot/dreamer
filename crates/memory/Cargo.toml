[package]
name = "memory"
description = "Durable memory: the provider interface and the files, sqlite, and Kosmonaut providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# The `kosmonaut` provider: a Kosmonaut server over gRPC. Off by default,
# so a build leaves the gRPC client out. It needs only public crates. See
# docs/memory.md.
kosmonaut = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tokio"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
serde_json = "1.0.154"
# The `sqlite` provider, with SQLite compiled in (`bundled`): no system
# library. Pinned exactly; see docs/dependency-baseline.md.
rusqlite = { version = "=0.43.0", features = ["bundled"] }
# The server mode's gRPC client (src/kosmonaut/server.rs), with rustls/ring
# and the webpki roots as the HTTP client has; messages are written out with
# prost's derive, so no protoc or build script. See
# docs/dependency-baseline.md.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-ring", "tls-webpki-roots"], optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14.5", optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread"], optional = true }

[lints]
workspace = true
