[package]
name = "tmux-backend"
description = "tmux control-mode connection, inventory, and pane bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
terminal-ghostty = { path = "../terminal-ghostty" }
tmux-protocol = { path = "../tmux-protocol" }
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
