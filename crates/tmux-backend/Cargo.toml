[package]
name = "dreamer-tmux-backend"
description = "tmux control-mode connection, inventory, and pane bootstrap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true


# Published as dreamer-tmux-backend; the library keeps its short name.
[lib]
name = "tmux_backend"
[dependencies]
domain.workspace = true
perf.workspace = true
serde_json = "1.0.154"
terminal-ghostty.workspace = true
tmux-protocol.workspace = true
workspace-config.workspace = true
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
domain = { package = "dreamer-domain", path = "../domain" }
workspace-config = { package = "dreamer-workspace-config", path = "../workspace-config" }
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
