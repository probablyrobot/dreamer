[package]
name = "dreamer-mirror"
description = "Canonical pane mirrors in the daemon: cold attach, ordered ingestion, VT owner workers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

# Published as dreamer-mirror; the library keeps its short name.
[lib]
name = "mirror"

[dependencies]
domain.workspace = true
perf.workspace = true
platform.workspace = true
terminal-ghostty.workspace = true
tmux-backend.workspace = true
tmux-protocol.workspace = true
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[lints]
workspace = true
