[package]
name = "script-runtime"
description = "Sandboxed Luau host for filters, triggers, and pane apps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
api = { path = "../api" }
mlua = { version = "0.12.2", features = ["luau", "vendored", "async"] }
rustix = { version = "1.1.6", features = ["time"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }

[lints]
workspace = true
