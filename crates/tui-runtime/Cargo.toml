[package]
name = "dreamer-termapp"
description = "Runtime for apps that run inside tmux panes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dreamer-termapp"
path = "src/main.rs"

[dependencies]
crossterm = "=0.29.0"
app-model = { path = "../app-model" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync"] }

[dev-dependencies]
api = { path = "../api" }
client = { path = "../client" }
tmux-backend = { path = "../tmux-backend" }

[lints]
workspace = true
