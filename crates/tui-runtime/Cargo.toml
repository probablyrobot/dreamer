[package]
name = "dreamer-termapp"
description = "Runtime for apps that run inside tmux panes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dreamer-termapp"
path = "src/main.rs"

[dependencies]
api = { path = "../api" }
client = { path = "../client" }
crossterm = "=0.29.0"
platform = { path = "../platform" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "net"] }
toml = "0.8.23"

[dev-dependencies]
tmux-backend = { path = "../tmux-backend" }

[lints]
workspace = true
