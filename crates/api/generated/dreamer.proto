  uint32 pane = 1;
  // Refuse the input if the pane's process was replaced.
  optional uint64 generation = 2;
  optional string endpoint = 3;
  // The sending client's id (as in TerminalSubscribe); focus events make it the pane's focused client.
  optional uint64 client = 4;
  // Automation's interaction lease on this pane (leases.acquire). Without one, typed input is a person's: it revokes any lease on the pane.
  optional string lease = 5;
  oneof event {
    KeyInput key = 10;
    TextInput text = 11;
    PasteInput paste = 12;
    FocusInput focus = 13;
    MouseInput mouse = 14;
  }
}

message InputResult {
  // Encoded bytes delivered to the pane.
  uint64 bytes = 1;
  // tmux command batches used.
  uint32 batches = 2;
}

// Ask to type into a pane as automation. One connection holds a pane's lease at a time; it expires unless used, and a person typing into the pane revokes it.
message LeaseAcquire {
  uint32 pane = 1;
  // Idle time before the lease expires: default 30000, at most 600000. Each use starts it again.
  optional uint32 ttl_ms = 2;
}

message Lease {
  string id = 1;
  uint32 pane = 2;
  // Increases with every lease on the pane; a revoked generation never comes back.
  uint64 generation = 3;
  uint64 expires_unix_ms = 4;
}

message LeaseRef {
  string id = 1;
}

// Connect the local daemon (the coordinator) to the daemon on another host through system ssh, running `dream bridge --stdio` there. SSH configuration, keys, and host verification stay the user's.
message HostConnect {
  // A local label for this host; unique among hosts.
  string name = 1;
  // SSH destination: host alias, user@host, or ssh:// URI.
  string destination = 2;
  // Remote dream executable; default `dream` on the remote PATH. A leading ~/ is the remote home.
  optional string dream = 3;
  // Remote tmux executable, for a remote daemon that has to be started.
  optional string tmux = 4;
  // Remote tmux -L name.
  optional string tmux_socket = 5;
  // Remote tmux -S path.
  optional string tmux_socket_path = 6;
  // Retry a dropped connection by itself; default: the profile's policy, or off for a host given here.
  optional bool auto_reconnect = 7;
}

message HostStatus {
  string name = 1;
  string destination = 2;
  LinkState state = 3;
  // The remote daemon's protocol and build, once live.
  VersionInfo remote = 4;
  optional string remote_host = 5;
  optional uint32 remote_pid = 6;
  // Changes when the remote daemon restarts.
  optional string remote_instance = 7;
  // Last successful exchange with the remote daemon.
  optional uint64 last_contact_unix_ms = 8;
  // Why the host is not live: the reason and SSH's last diagnostic lines.
  optional string detail = 9;
  HostFailure failure = 10;
  // Failed attempts since the last live connection.
  uint32 attempts = 11;
  // When the next automatic attempt starts, if one is scheduled.
  optional uint64 next_retry_unix_ms = 12;
  bool auto_reconnect = 13;
  repeated string tags = 14;
  optional string workspace = 15;
  // Defined in hosts.yaml.
  bool profile = 16;
}

// Every profile in hosts.yaml and every other host connected since the daemon started.
message HostList {
  repeated HostStatus hosts = 1;
  // hosts.yaml exists but is invalid: the error, with its location.
  optional string profiles_error = 2;
}

message HostRef {
  string name = 1;
}

// One typed call forwarded to a connected host's daemon: `payload` is the method's parameters as Protobuf, exactly as in a local call. Methods that stream (subscriptions and watches) are refused.
message HostCall {
  string name = 1;
  string method = 2;
  bytes payload = 3;
}

// Follow a pane on a connected host through this daemon: the reply and the `terminal.*` events are those of terminal.subscribe, with this connection's own subscription id. When SSH drops and the host comes back, the subscription resumes from the host's journal by itself; it ends with host_lost or host_restarted when it cannot.
message HostSubscribe {
  string name = 1;
  TerminalSubscribe subscribe = 2;
}

message InstallPlanParams {
  string name = 1;
  // Directory of server archives on this machine; default DREAMER_SERVER_ARTIFACTS, else share/dreamer/server beside this daemon.
  optional string artifacts = 2;
}

// What hosts.install would do, for review: found by probing the host through SSH. Installing requires this plan's id, so nothing different from what was reviewed can be installed.
message InstallPlan {
  string name = 1;
  string destination = 2;
  string remote_os = 3;
  string remote_arch = 4;
  // The matching Rust target, such as x86_64-unknown-linux-gnu.
  string target = 5;
  string home = 6;
  // The installed server's VERSION first line, if any.
  optional string installed = 7;
  // The version that would be installed (this daemon's own).
  string version = 8;
  string archive = 9;
  string sha256 = 10;
  uint64 size = 11;
  string remote_dir = 12;
  // Each change, in order, in plain words.
  repeated string steps = 13;
  string plan_id = 14;
}

message InstallParams {
  string name = 1;
  optional string artifacts = 2;
  // The id of the reviewed plan; a different plan now is refused.
  string plan_id = 3;
}

message InstallResult {
  string version = 1;
  // The installed dream, as run on the host.
  string remote_dream = 2;
  optional string previous = 3;
  // What the installed dream --version printed on the host.
  string check = 4;
}

message UpgradeParams {
  string name = 1;
  optional string artifacts = 2;
  // The id of the reviewed install plan.
  string plan_id = 3;
  // Install even when the host has a newer version.
  bool allow_older = 4;
}

// An upgrade is a restart of the host's daemon, not a handover: its tmux sessions and panes keep running, but views of them start again from fresh checkpoints.
message UpgradeResult {
  // The version installed before, if any.
  optional string from = 1;
  string to = 2;
  // The host's daemon was restarted on the new version.
  bool restarted = 3;
  optional uint32 pid_before = 4;
  optional uint32 pid_after = 5;
  string note = 6;
}

// The remote daemon's result for a HostCall, as Protobuf.
message HostReply {
  bytes payload = 1;
}

// What a connection may do. The user's own clients hold the owner grant (everything). A narrow grant lists its methods (exact names, or `service.*`), the panes it may read, follow, or type into, and an optional expiry. Checked by the daemon before every request; data can never widen it.
message Grant {
  // Everything is allowed (the user's own clients).
  bool owner = 1;
  repeated string methods = 2;
  // Panes in scope; requests naming another pane are refused.
  repeated uint32 panes = 3;
  // Every pane is in scope.
  bool all_panes = 4;
  optional uint64 expires_unix_ms = 5;
  // How far the grant acts on panes; unspecified leaves it to the methods and panes alone.
  ActLevel level = 6;
}

// Start a program in a new tmux window as a registered app. The daemon writes a single-use ticket to an owner-only file and gives the program only that file's path (DREAMER_LAUNCH_TICKET) and the launch id (DREAMER_LAUNCH_ID). The program registers with them for `grant`.
message LaunchApp {
  string app_id = 1;
  // What the app may do; with no panes and not all_panes, its own pane.
  Grant grant = 2;
  // Exact program and arguments; never a shell string.
  repeated string argv = 3;
  uint32 session = 4;
  // The window name; default the app id.
  optional string name = 5;
  optional string cwd = 6;
  // How long the ticket is valid; default 60000.
  optional uint32 ttl_ms = 7;
}

message LaunchedApp {
  string launch_id = 1;
  uint32 pane = 2;
  uint64 expires_unix_ms = 3;
}

message RegisterApp {
  string launch_id = 1;
  // The contents of the ticket file.
  string ticket = 2;
}

message Registration {
  string instance = 1;
  string app_id = 2;
  uint32 pane = 3;
  Grant grant = 4;
}

message AppViewPublish {
  // The app's model as JSON, as the app host draws it.
  string view = 1;
}

message AppViewQuery {
  uint32 pane = 1;
  // Wait for a revision newer than this one; 0 answers at once.
  uint64 after = 2;
  // How long to wait for a newer revision; default 20000, at most 60000. The current one is returned when it runs out.
  optional uint32 wait_ms = 3;
}

message AppView {
  uint32 pane = 1;
  string instance = 2;
  string app_id = 3;
  // Grows with every new view and every change of `live`.
  uint64 revision = 4;
  // The host is connected; when false, `view` is its last one.
  bool live = 5;
  // The latest model the host published, as JSON; empty before its first.
  string view = 6;
}

// A version of an app host's view tree (docs/termapp.md, view trees): the whole tree, or the keyed changes from the version before.
message AppTreePublish {
  // This version; a patch's is one more than the version it changes.
  uint64 seq = 1;
  // The whole tree as JSON (a frame: title, status, focus, root); empty with a patch.
  string tree = 2;
  // The changes from version seq - 1 as a JSON list of keyed ops; empty with a tree.
  string patch = 3;
}

message AppTreeQuery {
  uint32 pane = 1;
  // Wait for a revision newer than this one; 0 answers at once.
  uint64 after = 2;
  // The tree version the caller holds; 0 for none. The answer brings it to the newest.
  uint64 seq = 3;
  // How long to wait for a newer revision; default 20000, at most 60000.
  optional uint32 wait_ms = 4;
}

message AppTree {
  uint32 pane = 1;
  string instance = 2;
  string app_id = 3;
  // Grows with every new tree version and every change of `live`.
  uint64 revision = 4;
  // The host is connected; when false, the tree is its last one.
  bool live = 5;
  // The tree version the caller holds after applying this answer; 0 before the host's first tree.
  uint64 seq = 6;
  // The whole tree as JSON, when the caller's version is unknown or too old for patches; else empty.
  string tree = 7;
  // The changes from the caller's version, one JSON list of ops per version, in order.
  repeated string patches = 8;
}

message AppInput {
  uint32 pane = 1;
  // A key by the app model's names: a character, Enter, Esc, Tab, Up, Ctrl-c, F2, ...
  string key = 2;
}

message TmuxBufferRead {
  // Endpoint name; the default endpoint when absent.
  optional string endpoint = 1;
  // The buffer to read (from a clipboard.tmux_buffer event); the newest when absent.
  optional string name = 2;
}

message TmuxBuffer {
  // False when there is no such buffer.
  bool found = 1;
  // The buffer's text, at most 4 MiB.
  string text = 2;
}

message TmuxBufferWrite {
  // Endpoint name; the default endpoint when absent.
  optional string endpoint = 1;
  // Becomes tmux's newest paste buffer (1 byte to 4 MiB).
  string text = 2;
}

message TmuxBufferListParams {
  // Endpoint name; the default endpoint when absent.
  optional string endpoint = 1;
}

message TmuxBufferInfo {
  string name = 1;
  // Bytes.
  uint64 size = 2;
  // The start of the text, as tmux shows it (control characters escaped).
  string sample = 3;
}

message TmuxBufferList {
  // Newest first.
  repeated TmuxBufferInfo buffers = 1;
}

message KeyOptionsParams {
  // Endpoint name; the default endpoint when absent.
  optional string endpoint = 1;
}

// tmux's global key and copy-mode options, as tmux reports them. Read only: Dreamer never changes them.
message KeyOptions {
  // A tmux key name such as C-b, or None.
  string prefix = 1;
  // A tmux key name, or None.
  string prefix2 = 2;
  // vi or emacs.
  string mode_keys = 3;
  // As tmux reports it, for example bg=yellow,fg=black.
  string mode_style = 4;
}

message PrefixKey {
  // Endpoint name; the default endpoint when absent.
  optional string endpoint = 1;
  // The pane the key is typed on.
  uint32 pane = 2;
  // One tmux key name (c, C-o, M-Up, PPage), typed after the prefix.
  string key = 3;
}

message PrefixKeyResult {
  // A mode the binding opened on the pane (copy-mode, tree-mode, ...), which was cancelled: tmux draws modes only for ordinary clients.
  optional string mode_cancelled = 1;
}

// One entry of the daemon's event log: metadata only, never terminal content.
message DaemonEvent {
  // Increases by one per event within a daemon instance, from 1.
  uint64 sequence = 1;
  // tmux.topology, actions.outcome, hosts.state, or apps.registered (see docs/events.md).
  string kind = 2;
  uint64 time_unix_ms = 3;
  // The pane the event is about, if any.
  optional uint32 pane = 4;
  // The remote host the event is about, if any.
  optional string host = 5;
  // An action id or launch id.
  optional string subject = 6;
  // An action outcome or a host's link state.
  optional string state = 7;
  // The topology revision.
  optional uint64 revision = 8;
}

message EventSubscribe {
  // Kinds or kind prefixes (`actions` matches `actions.outcome`); empty means every kind.
  repeated string kinds = 1;
  // Only events about these panes; empty means every event.
  repeated uint32 panes = 2;
  // Resume after this sequence; without it, only new events follow.
  optional uint64 after = 3;
  // The daemon instance the cursor came from (EventSubscription.instance).
  optional string instance = 4;
  // How many events this subscriber may fall behind before it skips ahead with a gap; default 1024.
  optional uint32 quota = 5;
}

message EventSubscription {
  // Ends with events.unsubscribe.
  uint64 id = 1;
  // This daemon instance; cursors are valid only within it.
  string instance = 2;
  // Events after this sequence follow.
  uint64 cursor = 3;
  // The oldest sequence the log still keeps.
  uint64 oldest = 4;
}

// Events in first..=last were not delivered; re-read state that depends on them.
message EventGap {
  uint64 first = 1;
  uint64 last = 2;
  EventGapReason reason = 3;
}

// Pushed as `events.batch`: a gap, if any, comes before the events.
message EventBatch {
  uint64 subscription = 1;
  EventGap gap = 2;
  repeated DaemonEvent events = 3;
  // Resume after this sequence to continue where this batch ends.
  uint64 cursor = 4;
}

// Who sent a message, stamped by the daemon from the connection; never taken from the sender.
message MessageSender {
  // A registered app's instance, or owner:<n> for one of the user's own clients.
  string instance = 1;
  optional string app_id = 2;
  // The registered app's pane.
  optional uint32 pane = 3;
  // Sent under the owner grant.
  bool owner = 4;
}

message MessageEnvelope {
  // Assigned by the daemon; increases per message.
  uint64 id = 1;
  MessageSender sender = 2;
  optional string topic = 3;
  // The instance a direct message, request, or reply is for.
  optional string recipient = 4;
  // The payload's schema version, chosen by the sender.
  uint32 schema = 5;
  optional string correlation = 6;
  optional uint64 expires_unix_ms = 7;
  bytes payload = 8;
  // The message this one answers or was caused by.
  optional uint64 cause = 9;
  // The first message of this causal chain (its own id when it starts one).
  uint64 origin = 10;
  // Causal steps from the origin.
  uint32 depth = 11;
  // What the sender said about itself: a claim, never authority.
  optional string claimed_sender = 12;
  uint64 time_unix_ms = 13;
  // A request: answer it with messages.reply.
  bool request = 14;
}

// A topic message or a direct message: give exactly one of topic and recipient.
message MessagePublish {
  // Not dreamer.*, human.*, policy.*, or approval.*: those are the daemon's.
  optional string topic = 1;
  optional string recipient = 2;
  uint32 schema = 3;
  optional string correlation = 4;
  optional uint64 expires_unix_ms = 5;
  // At most 64 KiB.
  bytes payload = 6;
  optional uint64 cause = 7;
  // A claimed sender; recipients see it as claimed_sender, next to the stamped one.
  optional string sender = 8;
}

message MessageSent {
  uint64 id = 1;
  // Subscriptions it was handed to.
  uint32 delivered = 2;
  uint32 depth = 3;
}

message MessageRequest {
  string recipient = 1;
  uint32 schema = 2;
  optional string correlation = 3;
  bytes payload = 4;
  optional uint64 cause = 5;
  // Default 10000, at most 60000.
  optional uint32 timeout_ms = 6;
  // A claimed sender (see MessagePublish.sender).
  optional string sender = 7;
}

message MessageReply {
  // The request's id.
  uint64 request = 1;
  uint32 schema = 2;
  bytes payload = 3;
}

message MessageSubscribe {
  // Exact topics, service.* prefixes, or *. Direct messages and requests to this connection arrive regardless.
  repeated string topics = 1;
}

message MessageSubscription {
  // Ends with messages.unsubscribe.
  uint64 id = 1;
  // This connection's identity as a recipient.
  string instance = 2;
}

// Pushed as `messages.deliver`.
message MessageDelivery {
  uint64 subscription = 1;
  MessageEnvelope envelope = 2;
  // Messages dropped for this subscription since the previous delivery, because it was full.
  uint64 missed = 3;
}

message ExtensionStatus {
  string name = 1;
  ExtensionState state = 2;
  optional uint32 pid = 3;
  // Times it was started again since the daemon started.
  uint32 restarts = 4;
  // Consecutive failures; reset after a minute of running.
  uint32 failures = 5;
  optional string last_error = 6;
  optional uint64 started_unix_ms = 7;
  optional uint64 next_start_unix_ms = 8;
  // What it said in its extension.hello answer.
  optional string version = 9;
  // Its standard error, appended.
  string log = 10;
  Grant grant = 11;
}

message ExtensionList {
  repeated ExtensionStatus extensions = 1;
  // Why extensions.yaml could not be read; nothing was started from it.
  optional string config_error = 2;
}

message ExtensionRef {
  string name = 1;
}

message ScriptGrant {
  // Exact names or service.*.
  repeated string methods = 1;
  repeated uint32 panes = 2;
  bool all_panes = 3;
}

// Absent fields take the defaults (16 MiB, 50 ms, 5 s).
message ScriptLimits {
  optional uint64 memory_bytes = 1;
  // Running time per call into the script.
  optional uint32 call_ms = 2;
  // Deadline of each dreamer.* call.
  optional uint32 host_call_ms = 3;
}

message ScriptLoad {
  // Unique among loaded scripts; its sender identity is script:<name>.
  string name = 1;
  // Luau source; it runs once on load, then its handlers are called.
  string source = 2;
  ScriptGrant grant = 3;
  // Event kinds (prefixes) passed to the script's on_event; needs events.subscribe in the grant.
  repeated string events = 4;
  ScriptLimits limits = 5;
}

message ScriptSource {
  string name = 1;
  string source = 2;
}

message ScriptCheck {
  bool ok = 1;
  optional string error = 2;
}

message ScriptRef {
  string name = 1;
}

message ScriptStatus {
  string name = 1;
  ScriptState state = 2;
  // The source revision running: 1 on load, +1 per successful reload.
  uint32 revision = 3;
  uint32 restarts = 4;
  // Budget overruns in a row.
  uint32 failures = 5;
  optional string last_error = 6;
  // Events passed to on_event.
  uint64 handled = 7;
  // Handler errors (not budget overruns); the instance keeps running.
  uint64 errors = 8;
  Grant grant = 9;
  repeated string events = 10;
}

message ScriptList {
  repeated ScriptStatus scripts = 1;
}

message TapSubscribe {
  TapLevel level = 1;
  // The panes to follow.
  repeated uint32 panes = 2;
  // Follow every mirrored pane, including later ones (needs all_panes).
  bool every_pane = 3;
  // How often text and meta taps look for changes; default 250, at least 50.
  optional uint32 interval_ms = 4;
}

message TapSubscription {
  // Ends with taps.unsubscribe.
  uint64 id = 1;
  // The panes followed now.
  repeated uint32 panes = 2;
}

message TapMeta {
  uint32 cols = 1;
  uint32 rows = 2;
  optional string title = 3;
  optional string cwd = 4;
  // Records applied; it advancing means output.
  uint64 sequence = 5;
  bool alt_screen = 6;
}

message TapRow {
  // 0 is the top row of the screen.
  uint32 row = 1;
  string text = 2;
}

// Output this tap did not deliver. The pane itself lost nothing.
message TapGap {
  // lagging (the tap fell behind), window (more lines scrolled between looks than a look reads), or restarted (the pane's program was replaced).
  string reason = 1;
  // Lines missed, when known.
  optional uint64 lines = 2;
}

// Pushed as `taps.data`, for one pane.
message TapData {
  uint64 tap = 1;
  uint32 pane = 2;
  uint64 generation = 3;
  TapGap gap = 4;
  // raw: bytes as the program wrote them.
  bytes raw = 5;
  // text: lines that scrolled into history, oldest first.
  repeated string lines = 6;
  // text: rows of an alternate screen that changed.
  repeated TapRow screen = 7;
  // meta: the pane's state when it changed.
  TapMeta meta = 8;
  // The pane is gone; nothing more follows for it.
  bool ended = 9;
  // text: each line's row, counted from the top of the pane's history at the time.
  repeated uint64 rows = 10;
  // text: the pane's width when the lines were read.
  uint32 cols = 11;
}

// Which panes' recent lines match a pattern. Every bound is enforced; a truncated answer says so.
message TerminalQuery {
  // A regular expression (linear time, size-limited), or plain text with `literal`.
  string pattern = 1;
  bool literal = 2;
  bool ignore_case = 3;
  // More plain-text alternatives.
  repeated string literals = 4;
  // The panes to search; empty means every mirrored pane (needs all_panes).
  repeated uint32 panes = 5;
  // How many of each pane's newest lines (screen included); default 200, at most 2000.
  optional uint32 lines = 6;
  // Default 100, at most 1000.
  optional uint32 max_matches = 7;
  // Connected hosts to search too (all their panes); `*` means every live host.
  repeated string hosts = 8;
  // Default 2000, at most 10000; panes not searched in time are reported.
  optional uint32 timeout_ms = 9;
  // Only panes whose title matches this regular expression.
  optional string title = 10;
  // Bytes of matching line text returned in all; default 65536, at most 1048576.
  optional uint32 max_bytes = 11;
}

message QueryMatch {
  // Absent for this host.
  optional string host = 1;
  uint32 pane = 2;
  // Index in the searched window, oldest first.
  uint32 line = 3;
  string text = 4;
  // Byte offsets of the match in text.
  uint32 match_start = 5;
  uint32 match_end = 6;
}

message QueryResult {
  repeated QueryMatch matches = 1;
  uint32 panes_searched = 2;
  // A bound cut the answer short; see notes.
  bool truncated = 3;
  // What was cut and why, and hosts that could not be searched.
  repeated string notes = 4;
}

// A mark on one line of a pane: data for clients to draw, never part of the terminal stream.
message Decoration {
  uint64 id = 1;
  uint32 pane = 2;
  uint64 generation = 3;
  // The line's row counted from the top of the pane's history.
  uint64 row = 4;
  // The line, as it was when marked.
  string text = 5;
  DecorationStyle style = 6;
  optional string badge = 7;
  // The filter that made it.
  string filter = 8;
  // The pane's width when marked; a reflow invalidates it.
  uint32 cols = 9;
}

message DecorationQuery {
  uint32 pane = 1;
}

message DecorationList {
  uint32 pane = 1;
  // Still valid: same generation and width, and the line is still at its row.
  repeated Decoration decorations = 2;
}

// A typed trigger: fixed text typed into a pane. Matched text is never typed.
message FilterInput {
  uint32 pane = 1;
  string text = 2;
}

message FilterSpec {
  // Unique; its sender identity is filter:<name>.
  string name = 1;
  repeated uint32 panes = 2;
  bool every_pane = 3;
  // As in terminal.query: a regular expression, or plain text with `literal`.
  string pattern = 4;
  bool literal = 5;
  repeated string literals = 6;
  bool ignore_case = 7;
  // Publish each matched line here (the derived stream).
  optional string topic = 8;
  // Send each matched line to this instance.
  optional string recipient = 9;
  // Record each match as a filters.matched event (scripts receive them with on_event).
  bool event = 10;
  // Type this into a pane on each match.
  FilterInput input = 11;
  // What the filter may do: taps.subscribe for its panes, plus what its outputs need.
  ScriptGrant grant = 12;
  // Matches acted on per second; more are counted as dropped. Default 20.
  optional uint32 per_second = 13;
  // Triggers (topic, recipient, input) allowed in any 10 s; one more trips the filter. Default 50.
  optional uint32 breaker = 14;
  // Mark each matched line on its pane (drawn by clients).
  DecorationStyle decorate = 15;
  // The badge text for decorate: badge.
  optional string badge = 16;
}

message FilterRef {
  string name = 1;
}

message FilterStatus {
  string name = 1;
  FilterState state = 2;
  uint64 matched = 3;
  // Matches over per_second.
  uint64 dropped = 4;
  uint64 triggered = 5;
  // Lines skipped because they echo this filter's own input.
  uint64 skipped_own = 6;
  optional string last_error = 7;
  // Why it is paused or tripped.
  optional string reason = 8;
}

message FilterList {
  repeated FilterStatus filters = 1;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

message JobStart {
  // The exact program and arguments; no shell.
  repeated string argv = 1;
  optional string cwd = 2;
  // Added to the job's environment; names are [A-Z_][A-Z0-9_]*.
  repeated EnvVar env = 3;
  // The tmux window name; default the program's name.
  optional string name = 4;
  // The session for its window; default the first session.
  optional uint32 session = 5;
}

message JobRecord {
  string id = 1;
  repeated string argv = 2;
  optional string cwd = 3;
  // Its tmux pane: read its output with terminal.read while the pane remains.
  uint32 pane = 4;
  JobState state = 5;
  optional int32 exit_code = 6;
  optional int32 signal = 7;
  uint64 started_unix_ms = 8;
  optional uint64 ended_unix_ms = 9;
  // The directory the job was given as DREAMER_JOB_ARTIFACTS.
  string artifacts = 10;
  // jobs.cancel was asked.
  bool cancelled = 11;
  optional uint32 pid = 12;
}

message JobRef {
  string id = 1;
}

message JobList {
  repeated JobRecord jobs = 1;
}

message JobFile {
  // Relative to the artifacts directory.
  string path = 1;
  uint64 bytes = 2;
}

message JobArtifacts {
  string id = 1;
  string directory = 2;
  // At most 1000, sorted by path.
  repeated JobFile files = 3;
}

message ProcessQuery {
  // Only processes in these panes; empty means every process of the user (needs all_panes).
  repeated uint32 panes = 1;
  // Only processes that are agent runs.
  bool runs_only = 2;
  // Only runs of this provider: claude or codex.
  optional string provider = 3;
}

// One process and what the registry can say about it, with the evidence. Absent fields are unknown, not zero.
message ProcessRecord {
  uint32 pid = 1;
  // With pid, the process's identity: a reused pid has a different start.
  uint64 started_unix_ms = 2;
  uint32 ppid = 3;
  uint32 pgid = 4;
  optional string tty = 5;
  // The program's file name.
  string command = 6;
  // The command line (at most 1024 bytes).
  string args = 7;
  // Reported for runs only, when the system says.
  optional string cwd = 8;
  optional uint32 pane = 9;
  // ancestry (it descends from the pane's program) or terminal (it only shares the pane's terminal).
  optional string pane_evidence = 10;
  // claude or codex, when this is the topmost process of an agent run.
  optional string provider = 11;
  // high, medium, or low, for a run.
  optional string confidence = 12;
  // Why it is counted as a run.
  optional string evidence = 13;
  // The run this process serves (a tool, a server); never itself a run.
  optional uint32 helper_of = 14;
  // CPU use in tenths of a percent of one core, as ps averages it.
  uint32 cpu_permille = 15;
  // Resident memory.
  uint64 rss_kib = 16;
}

message AgentRunQuery {
  // Connected hosts to ask too; `*` means every live host.
  repeated string hosts = 1;
  // claude or codex.
  optional string provider = 2;
}

// One agent run, by evidence. State says only what is known: never inferred from titles, CPU, or output.
message AgentRun {
  // Absent for this host.
  optional string host = 1;
  uint32 pid = 2;
  // With host and pid, the run's identity.
  uint64 started_unix_ms = 3;
  string provider = 4;
  optional uint32 pane = 5;
  optional string cwd = 6;
  uint64 age_ms = 7;
  uint32 cpu_permille = 8;
  uint64 rss_kib = 9;
  string confidence = 10;
  string evidence = 11;
  // passive (found from its process only) or hooks (its provider's hooks report to the daemon).
  string instrumentation = 12;
  // passive: running. hooks: active, working, waiting_for_permission, idle (a turn ended), ended, or stale (no report for a while).
  string state = 13;
  // Processes serving it (tools, servers), not counted as runs.
  uint32 helpers = 14;
  // The provider's session, when its hooks report it.
  optional string session_id = 15;
  // When its hooks last reported.
  optional uint64 last_event_unix_ms = 16;
}

// One provider hook report, as dream hook sends it.
message AgentEvent {
  // claude
  string provider = 1;
  // The provider's event name, such as SessionStart or Notification.
  string event = 2;
  string session_id = 3;
  optional string cwd = 4;
  // The notification type, or why a session ended.
  optional string detail = 5;
  // The reporting hook process; its ancestry finds the run. It is never the run itself.
  uint32 hook_pid = 6;
}

message AgentRunList {
  repeated AgentRun runs = 1;
  // Hosts that could not be asked, and why.
  repeated string notes = 2;
}

message ProcessList {
  repeated ProcessRecord processes = 1;
  uint64 taken_unix_ms = 2;
}

// One pane, with what an agent needs to choose it.
message TerminalInfo {
  uint32 pane = 1;
  uint32 session = 2;
  string session_name = 3;
  uint32 window = 4;
  string window_name = 5;
  uint32 window_index = 6;
  // The program in the foreground, as tmux reports it.
  string command = 7;
  // The last directory the program reported (OSC 7).
  optional string cwd = 8;
  string title = 9;
  uint32 cols = 10;
  uint32 rows = 11;
  // The active pane of its window.
  bool active = 12;
  // Its program has exited; the pane stays with its output.
  bool dead = 13;
  Tier tier = 14;
  // Time since the pane last wrote anything; absent when it is not mirrored.
  optional uint64 quiet_ms = 15;
  // The calling connection created this pane.
  bool owned = 16;
}

message TerminalList {
  repeated TerminalInfo terminals = 1;
}

// Wait for one of: `pattern` appearing in new output, the pane writing nothing for `quiet_ms`, or (with `exit`) its program ending. At least one condition is needed; the first to happen ends the wait.
message TerminalWatch {
  uint32 pane = 1;
  // A regular expression (linear time, size-limited), or plain text with `literal`; matched against lines written after the watch starts.
  optional string pattern = 2;
  bool literal = 3;
  bool ignore_case = 4;
  // How long without output counts as quiet; at least 50.
  optional uint32 quiet_ms = 5;
  // End when the pane's program ends.
  bool exit = 6;
  // Default 30000, at most 600000.
  optional uint32 timeout_ms = 7;
}

message WatchResult {
  WatchOutcome outcome = 1;
  // The matching line.
  optional string text = 2;
  // Byte offsets of the match in text.
  uint32 match_start = 3;
  uint32 match_end = 4;
  uint64 elapsed_ms = 5;
  // When the program was a job and exited.
  optional int32 exit_code = 6;
  // When the program was a job and a signal ended it.
  optional int32 signal = 7;
}

// Run an exact program as a job, in a new window or a new pane split from `split`, wait for it, and return its status and output. The calling connection owns the new pane.
message TerminalRun {
  // The exact program and arguments; no shell.
  repeated string argv = 1;
  optional string cwd = 2;
  repeated EnvVar env = 3;
  // The session for a new window; default the first session.
  optional uint32 session = 4;
  // The new window's name; default the program's name.
  optional string name = 5;
  // Split this pane for the program instead of opening a window; acting on that pane.
  optional uint32 split = 6;
  // For split; default vertical.
  SplitDirection direction = 7;
  // How long to wait; default 60000, at most 600000. The program keeps running after it.
  optional uint32 timeout_ms = 8;
  // Output lines returned at most, the newest; default 200, at most 2000.
  optional uint32 lines = 9;
}

message RunResult {
  // Its state, exit code or signal, and pane.
  JobRecord job = 1;
  // False when the wait timed out; the program is still running.
  bool finished = 2;
  // The pane's text, oldest first, without trailing blank lines.
  repeated string output = 3;
  // Older output was left out.
  bool truncated = 4;
}

// An action waiting for the user: a connection at the elsewhere level acting on panes it did not create.
message Approval {
  string id = 1;
  // Who asks: an app instance, or owner:N for a narrowed connection of the user's own.
  string requester = 2;
  string method = 3;
  // What it would do, in words.
  string action = 4;
  // The panes it would act on that the requester did not create.
  repeated uint32 panes = 5;
  // It closes panes or ends a program; `pane` approval does not cover it.
  bool closing = 6;
  uint64 created_unix_ms = 7;
  // Unanswered by then, it is denied.
  uint64 expires_unix_ms = 8;
}

message ApprovalList {
  repeated Approval approvals = 1;
}

message ApprovalAnswer {
  string id = 1;
  ApprovalDecision decision = 2;
}

// The panes a collector covers: exactly one of these.
message CollectFrom {
  // Every pane, including panes created later.
  bool all = 1;
  // The panes of the session with this name.
  optional string session = 2;
  // The panes of this window (@N).
  optional uint32 window = 3;
  // These panes.
  repeated uint32 panes = 4;
  // Panes whose current command (as tmux names it) matches this regular expression, while it does.
  optional string command = 5;
}

// What makes a row: exactly one of these.
message CollectWhen {
  // A committed line matches this regular expression.
  optional string line = 1;
  // For line.
  bool ignore_case = 2;
  // A command finished, as the shell reports it through shell integration (OSC 133).
  bool command_end = 3;
  // The pane wrote nothing for this long after writing something (at least 100).
  optional uint32 idle_ms = 4;
  // The pane rang the bell.
  bool bell = 5;
  // The pane's process ended: the pane closed, died, or was respawned.
  bool exit = 6;
  // Every this many seconds (at least 1); captures the screen unless capture says lines.
  optional uint32 every_s = 7;
}

message CollectField {
  string name = 1;
  string value = 2;
}

// What a row keeps besides its metadata.
message CollectCapture {
  // Fields from a line match: each value is a template where $1 or ${name} stands for a group.
  repeated CollectField fields = 1;
  // The matched line is a JSON object: its top-level members become fields.
  bool json = 2;
  // Keep the pane's screen.
  bool screen = 3;
  // Keep the pane's last N lines (at most 1000).
  optional uint32 lines = 4;
  // Lines before a matched line to keep (at most 100).
  uint32 before = 5;
  // Lines after a matched line to keep (at most 100).
  uint32 after = 6;
}

message CollectKeep {
  // Rows kept; the oldest go first. Default 5000, at most 100000.
  optional uint32 rows = 1;
  // Rows older than this go. Default 7 days.
  optional uint64 max_age_s = 2;
}

message CollectorSpec {
  // Letters, digits, `-`, `_`, or `.`; unique.
  string name = 1;
  CollectFrom from = 2;
  CollectWhen when = 3;
  CollectCapture capture = 4;
  CollectKeep keep = 5;
  // Rows per second per pane; more are dropped and counted. Default 10, at most 1000.
  optional uint32 per_second = 6;
  // A shipped definition to start from (errors, test-failures, commands, urls, paths); each part given here replaces the preset's. The name defaults to the preset's.
  optional string preset = 7;
}

message CollectorStatus {
  string name = 1;
  CollectorSpec spec = 2;
  CollectorState state = 3;
  // Rows kept now.
  uint64 rows = 4;
  // Rows recorded since it was created.
  uint64 collected = 5;
  // Rows not recorded since it was created: over per_second, or the writer fell behind.
  uint64 dropped = 6;
  // The panes it follows now.
  repeated uint32 panes = 7;
  uint64 created_unix_ms = 8;
  optional string last_error = 9;
}

message CollectList {
  repeated CollectorStatus collectors = 1;
}

// One row of a collector's table.
message CollectRow {
  // Increases by one per row of the collector, across daemon restarts.
  uint64 id = 1;
  string collector = 2;
  uint64 time_unix_ms = 3;
  uint32 pane = 4;
  // The pane's session name.
  string session = 5;
  // The pane's working directory: as the shell reports it (OSC 7), else its process's.
  optional string cwd = 6;
  // The command line the shell reported, else the pane's current command.
  optional string command = 7;
  // line, command_end, idle, bell, exit, or interval.
  string trigger = 8;
  // The matched line (line trigger).
  string line = 9;
  repeated CollectField fields = 10;
  // Context lines before the matched line, oldest first.
  repeated string before = 11;
  // Context lines after the matched line.
  repeated string after = 12;
  // The screen or the last lines, when capture asks for them.
  repeated string lines = 13;
  // command_end: the status the shell reported.
  optional int32 exit_status = 14;
  // Rows this pane dropped (rate cap) since its previous recorded row.
  uint64 dropped = 15;
  optional uint32 window = 16;
}

message CollectQuery {
  string name = 1;
  // Only rows from these panes.
  repeated uint32 panes = 2;
  // Only rows with each of these fields at exactly this value.
  repeated CollectField fields = 3;
  optional uint64 since_unix_ms = 4;
  optional uint64 until_unix_ms = 5;
  // Only rows after this row id: the first `limit` of them. Without it, the newest `limit`.
  optional uint64 after = 6;
  // Default 100, at most 10000.
  optional uint32 limit = 7;
  // Count rows by a field, or by pane, session, window, cwd, command, or trigger, instead of listing them.
  optional string group_by = 8;
}

message CollectGroup {
  // Empty for rows without the field.
  string value = 1;
  uint64 count = 2;
  uint64 latest_unix_ms = 3;
}

message CollectResult {
  // Oldest first.
  repeated CollectRow rows = 1;
  // With group_by: most rows first.
  repeated CollectGroup groups = 2;
  // Rows that passed the filters.
  uint64 matched = 3;
  // More rows matched than were returned.
  bool truncated = 4;
  // The collector's dropped count (see CollectorStatus).
  uint64 dropped = 5;
}

message CollectRef {
  string name = 1;
  // Also delete its definition and rows.
  bool delete = 2;
}

// Which session's drawer, and where to show it. With none of session, window, or pane given the request is refused.
message DrawerRequest {
  // The tmux session whose drawer this is.
  optional uint32 session = 1;
  // The window to show it in; names the session when `session` is absent. Default: the session's active window.
  optional uint32 window = 2;
  // The pane asking (a shell's TMUX_PANE): names the window and session when they are absent. The drawer pane itself names its own session.
  optional uint32 pane = 3;
  DrawerWant want = 4;
  optional string endpoint = 5;
}

message DrawerStatus {
  uint32 session = 1;
  // The drawer's pane; absent while the session has none.
  optional uint32 pane = 2;
  // In a window of the session (not the holding session).
  bool shown = 3;
  // The window the pane is in, the holding session's while hidden.
  optional uint32 window = 4;
  // The active pane of its window, and that window the session's active one.
  bool focused = 5;
  // Shown zoomed, because the window was too small to dock it.
  bool zoomed = 6;
  // This call started the harness.
  bool created = 7;
  // The harness the pane was started with.
  string harness = 8;
  // The program and arguments it was started with; empty unless this call started it.
  repeated string command = 9;
  // Why the harness could not start; the pane says the same.
  optional string problem = 10;
  // The pane that had focus before the drawer was last shown or focused, while it exists: where hiding returns focus, and the pane the harness's context commands read.
  optional uint32 from_pane = 11;
}

message AgentSessionCreate {
  // A harness from the agents settings; default agents.default.
  optional string harness = 1;
  // The harness's working directory; default the daemon's home directory.
  optional string cwd = 2;
  // What the session may do through Dreamer, within the caller's own grant. Default: the terminal tools on every pane at the observe level.
  Grant grant = 3;
  // Default agents.<harness>.model, else the harness's own default.
  optional string model = 4;
  optional string name = 5;
}

message AgentSession {
  string id = 1;
  string harness = 2;
  string cwd = 3;
  AgentSessionState state = 4;
  // The session's grant: the outer limit for everything its harness does through Dreamer.
  Grant grant = 5;
  // The harness's own session id, kept for resume.
  optional string harness_session = 6;
  // The harness process while it runs.
  optional uint32 pid = 7;
  uint64 created_unix_ms = 8;
  // The newest event's sequence number.
  uint64 last_seq = 9;
  optional string model = 10;
  optional string name = 11;
  // Why it is detached, or what went wrong at start.
  optional string detail = 12;
  optional string harness_version = 13;
}

message AgentSessionList {
  repeated AgentSession sessions = 1;
}

message AgentSessionRef {
  string session = 1;
}

message AgentSessionSend {
  string session = 1;
  // The prompt. Sent while a turn runs, it waits for that turn to end.
  string text = 2;
}

message AgentSessionAnswer {
  string session = 1;
  // The approval_request event's id.
  string approval = 2;
  // For a request with options, the one chosen when approving.
  optional string option = 3;
}

message AgentSessionEventsQuery {
  string session = 1;
  // Events after this sequence number; default from the start of the transcript.
  optional uint64 after = 2;
  // Keep streaming: the reply carries no events, and `agent.sessions.events` notifications follow, the stored ones first. End it with terminal.unsubscribe.
  bool follow = 3;
  // Without follow, the most events in the reply; default 1000, at most 10000.
  optional uint32 limit = 4;
}

message AgentText {
  string text = 1;
}

message AgentToolCall {
  string id = 1;
  string name = 2;
  AgentToolStatus status = 3;
  // The tool's input as JSON.
  optional string input = 4;
  // Its output as text: the latest partial output, or the final one.
  optional string output = 5;
}

// The harness asks the user before going on. Answer with agent.sessions.approve or agent.sessions.deny.
message AgentApprovalRequest {
  string id = 1;
  string title = 2;
  optional string message = 3;
  // Choices offered; empty for a yes or no question.
  repeated string options = 4;
  // The harness answers by itself after this.
  optional uint64 expires_unix_ms = 5;
}

message AgentApprovalAnswer {
  string id = 1;
  bool allowed = 2;
  optional string option = 3;
  // Who answered: owner:N, an app instance, or `dreamer` when the session closed first.
  string by = 4;
}

message AgentPlanEntry {
  string content = 1;
  // pending, in_progress, or completed.
  string status = 2;
  optional string priority = 3;
}

message AgentPlan {
  repeated AgentPlanEntry entries = 1;
}

// Tokens of the latest model response, as the harness reports them.
message AgentUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cache_read_tokens = 3;
  uint64 cache_write_tokens = 4;
  // What the harness says it cost, in millionths of a US dollar.
  optional uint64 cost_micro_usd = 5;
}

message AgentTurnEnd {
  AgentStopReason stop_reason = 1;
}

message AgentError {
  string message = 1;
}

// The session changed state: the harness started, resumed, or ended, or the session closed.
message AgentSessionStatus {
  AgentSessionState state = 1;
  optional string detail = 2;
  optional string harness_session = 3;
}

// One normalised event, the same whatever the harness. Its shape follows the Agent Client Protocol: text and thinking arrive as deltas, a tool call as started, updated, and finished records with one id.
message AgentSessionEvent {
  // Its place in the session's transcript, from 1.
  uint64 seq = 1;
  uint64 unix_ms = 2;
  oneof kind {
    AgentText user_message = 10;
    AgentText text_delta = 11;
    AgentText thinking_delta = 12;
    AgentToolCall tool_call = 13;
    AgentApprovalRequest approval_request = 14;
    AgentApprovalAnswer approval_answer = 15;
    AgentPlan plan = 16;
    AgentUsage usage = 17;
    AgentTurnEnd turn_end = 18;
    AgentError error = 19;
    AgentSessionStatus status = 20;
  }
}

// The reply to agent.sessions.events, and the payload of each `agent.sessions.events` notification.
message AgentSessionEvents {
  string session = 1;
  // When following.
  optional uint64 subscription = 2;
  repeated AgentSessionEvent events = 3;
  // Without follow: more events follow the last one; ask again after it.
  bool more = 4;
}

// Who is asking, for the project and session scopes.
message MemoryContext {
  // The caller's working directory; the project is the nearest directory above it holding .dreamer/memory, else its git root, else the directory itself.
  optional string cwd = 1;
  // The agent session id, for the session scope.
  optional string session = 2;
}

message MemoryItem {
  // Stable while the memory exists; for the files provider, the scope and the file's name without .md (user/prefers-tabs).
  string id = 1;
  MemoryScope scope = 2;
  MemoryKind kind = 3;
  string title = 4;
  // One line, for the index.
  string description = 5;
  string text = 6;
  // Paths, URLs, or other memories' ids.
  repeated string links = 7;
  uint64 created_unix_ms = 8;
  uint64 updated_unix_ms = 9;
  // The file that holds it, for a provider that keeps files.
  optional string path = 10;
  // memory.recall: how well it matched; higher is better.
  optional uint32 score = 11;
}

// A memory file that could not be read; it is left as it is and skipped.
message MemoryProblem {
  string path = 1;
  string message = 2;
}

message MemoryItems {
  repeated MemoryItem items = 1;
  repeated MemoryProblem problems = 2;
  // The provider in force (files).
  string provider = 3;
}

message MemoryRecall {
  // Words to look for; empty returns the newest.
  string query = 1;
  // Unspecified: every scope the context reaches.
  MemoryScope scope = 2;
  // Default 10, at most 100.
  optional uint32 limit = 3;
  MemoryContext context = 4;
}

message MemoryRemember {
  string text = 1;
  MemoryKind kind = 2;
  MemoryScope scope = 3;
  // Default: the text's first line, shortened.
  optional string title = 4;
  // Default: the title.
  optional string description = 5;
  repeated string links = 6;
  MemoryContext context = 7;
}

message MemoryListQuery {
  // Unspecified: every scope the context reaches.
  MemoryScope scope = 1;
  // Unspecified: every kind.
  MemoryKind kind = 2;
  MemoryContext context = 3;
}

message MemoryRef {
  string id = 1;
  // Needed for an id in the project or session scope.
  MemoryContext context = 2;
}

// Change a memory; what is not given stays.
message MemoryUpdate {
  string id = 1;
  optional string text = 2;
  // Unspecified: unchanged.
  MemoryKind kind = 3;
  // The id stays the same.
  optional string title = 4;
  optional string description = 5;
  // Replace the links with these.
  repeated string links = 6;
  // Remove every link.
  bool clear_links = 7;
  MemoryContext context = 8;
}

// Methods (request record -> response record):
//   daemon.version (Empty -> VersionInfo)
//   daemon.status (Empty -> DaemonStatus)
//   daemon.shutdown (Empty -> ShutdownResult) mutation
//   tmux.topology (TopologyParams -> Topology)
//   tmux.size_window (SizeWindow -> SizeResult) mutation
//   clipboard.read_tmux_buffer (TmuxBufferRead -> TmuxBuffer)
//   clipboard.write_tmux_buffer (TmuxBufferWrite -> Empty) mutation
//   clipboard.list_tmux_buffers (TmuxBufferListParams -> TmuxBufferList)
//   tmux.key_options (KeyOptionsParams -> KeyOptions)
//   tmux.prefix_key (PrefixKey -> PrefixKeyResult) mutation
//   tmux.watch (TopologyParams -> TopologyUpdate)
//   actions.submit (SubmitAction -> ActionRecord) mutation
//   leases.acquire (LeaseAcquire -> Lease) mutation
//   leases.release (LeaseRef -> Empty) mutation
//   actions.get (ActionQuery -> ActionRecord)
//   actions.list (ActionListParams -> ActionList)
//   terminal.read (ReadParams -> TerminalText)
//   terminal.mirrors (TopologyParams -> MirrorList)
//   terminal.set_tier (SetTier -> Empty) mutation
//   terminal.subscribe (TerminalSubscribe -> Subscription)
//   terminal.unsubscribe (Unsubscribe -> Empty)
//   terminal.input (TerminalInput -> InputResult) mutation
//   hosts.connect (HostConnect -> HostStatus) mutation
//   hosts.list (Empty -> HostList)
//   hosts.disconnect (HostRef -> HostStatus) mutation
//   hosts.reconnect (HostRef -> HostStatus) mutation
//   hosts.subscribe (HostSubscribe -> Subscription)
//   hosts.watch (HostRef -> TopologyUpdate)
//   hosts.install_plan (InstallPlanParams -> InstallPlan)
//   hosts.install (InstallParams -> InstallResult) mutation
//   hosts.upgrade (UpgradeParams -> UpgradeResult) mutation
//   hosts.call (HostCall -> HostReply) mutation
//   grants.narrow (Grant -> Grant) mutation
//   grants.current (Empty -> Grant)
//   apps.launch (LaunchApp -> LaunchedApp) mutation
//   events.subscribe (EventSubscribe -> EventSubscription)
//   events.unsubscribe (Unsubscribe -> Empty)
//   messages.publish (MessagePublish -> MessageSent) mutation
//   messages.request (MessageRequest -> MessageEnvelope) mutation
//   messages.reply (MessageReply -> MessageSent) mutation
//   messages.subscribe (MessageSubscribe -> MessageSubscription)
//   messages.unsubscribe (Unsubscribe -> Empty)
//   extensions.list (Empty -> ExtensionList)
//   extensions.restart (ExtensionRef -> ExtensionStatus) mutation
//   scripts.validate (ScriptSource -> ScriptCheck)
//   scripts.load (ScriptLoad -> ScriptStatus) mutation
//   scripts.reload (ScriptSource -> ScriptStatus) mutation
//   scripts.stop (ScriptRef -> ScriptStatus) mutation
//   scripts.list (Empty -> ScriptList)
//   terminal.query (TerminalQuery -> QueryResult)
//   decorations.list (DecorationQuery -> DecorationList)
//   filters.install (FilterSpec -> FilterStatus) mutation
//   filters.list (Empty -> FilterList)
//   filters.pause (FilterRef -> FilterStatus) mutation
//   filters.resume (FilterRef -> FilterStatus) mutation
//   filters.remove (FilterRef -> FilterStatus) mutation
//   jobs.start (JobStart -> JobRecord) mutation
//   jobs.get (JobRef -> JobRecord)
//   jobs.list (Empty -> JobList)
//   jobs.cancel (JobRef -> JobRecord) mutation
