# Dreamer API schema: the single source for every typed operation.
#
# `cargo xtask api` regenerates, from this file:
#   crates/api/src/generated.rs      Rust SDK types (Protobuf + JSON) and dispatch
#   crates/api/generated/openrpc.json  JSON-RPC surface (OpenRPC 1.3)
#   crates/api/generated/dreamer.luau  Luau module stubs for scripts
#   crates/api/generated/dreamer.proto Protobuf description for other languages
# and checks it against crates/api/schema/compat.lock. Evolution rules are in
# docs/api.md: never reuse or renumber a field, never change a field's type,
# add instead of changing, and bump the major version for anything breaking.
#
# Field types: string, bool, u32, u64, i32, i64, bytes, an enum or message
# name. `repeated: true` makes a list; `optional: true` an explicitly
# optional scalar (messages are always optional).

version: { major: 1, minor: 36 }
package: dreamer.v1

types:
  - message: Empty
    doc: No parameters or no result.

  - message: RpcError
    doc: A failed call. Codes follow JSON-RPC 2.0 where they apply.
    fields:
      - { n: 1, name: code, type: i32 }
      - { n: 2, name: message, type: string }
      - { n: 3, name: data, type: string, optional: true, doc: Machine-readable detail. }

  # ---- daemon -------------------------------------------------------------

  - message: VersionInfo
    fields:
      - { n: 1, name: protocol_major, type: u32 }
      - { n: 2, name: protocol_minor, type: u32 }
      - { n: 3, name: daemon_version, type: string }
      - { n: 4, name: build_family, type: string, doc: "Engine build family; peers must match exactly." }
      - { n: 5, name: ghostty_commit, type: string }
      - { n: 6, name: platform, type: string, doc: "For example aarch64-apple-darwin." }

  - enum: LinkState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: connecting }
      - { n: 2, name: live }
      - { n: 3, name: closed }
      - { n: 4, name: failed }

  - message: EndpointStatus
    doc: One tmux server the daemon manages.
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: socket, type: string, doc: "tmux -L name or -S path, as configured." }
      - { n: 3, name: state, type: LinkState }
      - { n: 4, name: tmux_version, type: string, optional: true }
      - { n: 5, name: detail, type: string, optional: true, doc: Why the link is not live. }

  - message: DaemonStatus
    fields:
      - { n: 1, name: pid, type: u32 }
      - { n: 2, name: started_unix_ms, type: u64 }
      - { n: 3, name: uptime_ms, type: u64 }
      - { n: 4, name: socket_path, type: string }
      - { n: 5, name: log_path, type: string }
      - { n: 6, name: endpoints, type: EndpointStatus, repeated: true }
      - { n: 7, name: version, type: VersionInfo }
      - { n: 8, name: clients, type: u32, doc: "Connected API clients, including the caller." }

  - message: ShutdownResult
    fields:
      - { n: 1, name: effect, type: string, doc: "What stops and what keeps running (tmux panes always keep running)." }

  # ---- tmux topology ------------------------------------------------------

  - message: TopologyParams
    fields:
      - { n: 1, name: endpoint, type: string, optional: true, doc: Endpoint name; the default endpoint when absent. }

  - message: Session
    fields:
      - { n: 1, name: id, type: u32, doc: "tmux session id ($N)." }
      - { n: 2, name: name, type: string }
      - { n: 3, name: windows, type: u32, repeated: true, doc: Window ids in index order. }
      - { n: 4, name: active_window, type: u32, optional: true }

  - message: Window
    fields:
      - { n: 1, name: id, type: u32, doc: "tmux window id (@N)." }
      - { n: 2, name: name, type: string }
      - { n: 3, name: sessions, type: u32, repeated: true, doc: Sessions the window is linked into. }
      - { n: 4, name: index, type: u32 }
      - { n: 5, name: panes, type: u32, repeated: true }
      - { n: 6, name: active_pane, type: u32, optional: true }
      - { n: 7, name: zoomed, type: bool }
      - { n: 8, name: layout_supported, type: bool, doc: "False for layouts Dreamer cannot draw yet (floating panes)." }
      - { n: 9, name: width, type: u32 }
      - { n: 10, name: height, type: u32 }

  - message: Pane
    fields:
      - { n: 1, name: id, type: u32, doc: "tmux pane id (%N)." }
      - { n: 2, name: window, type: u32 }
      - { n: 3, name: width, type: u32 }
      - { n: 4, name: height, type: u32 }
      - { n: 5, name: left, type: u32 }
      - { n: 6, name: top, type: u32 }
      - { n: 7, name: active, type: bool }
      - { n: 8, name: pid, type: u32, optional: true }
      - { n: 9, name: current_command, type: string }
      - { n: 10, name: title, type: string }
      - { n: 11, name: dead, type: bool }
      - { n: 12, name: generation, type: u64, doc: Process generation; changes when the pane is respawned. }
      - { n: 13, name: mode, type: string, optional: true, doc: "A tmux-drawn mode the pane is in (copy-mode, tree-mode, ...). Its screen is tmux's, not the program's, and Dreamer does not draw it." }

  - message: Topology
    fields:
      - { n: 1, name: endpoint, type: string }
      - { n: 2, name: sessions, type: Session, repeated: true }
      - { n: 3, name: windows, type: Window, repeated: true }
      - { n: 4, name: panes, type: Pane, repeated: true }
      - { n: 5, name: incarnation, type: u64, doc: "Identifies this run of the tmux server. Session, window, and pane ids are only meaningful within one incarnation: never reuse a saved id from another." }

  - message: SizeWindow
    doc: >-
      Ask for a tmux window's size in cells. Applied only for the window's
      sizing owner: the first client to ask, until it disconnects or
      releases the window. Send it when your own window changes size, never
      in reaction to a topology change.
    fields:
      - { n: 1, name: window, type: u32 }
      - { n: 2, name: cols, type: u32 }
      - { n: 3, name: rows, type: u32 }
      - { n: 4, name: client, type: u64, doc: "The client's id (as in TerminalSubscribe)." }
      - { n: 5, name: release, type: bool, doc: "Give up ownership instead (cols and rows are ignored)." }
      - { n: 6, name: endpoint, type: string, optional: true }

  - message: SizeResult
    fields:
      - { n: 1, name: owner, type: bool, doc: "The asking client owns the window's size." }
      - { n: 2, name: applied, type: bool, doc: "The size was sent to tmux." }
      - { n: 3, name: owner_client, type: u64, optional: true, doc: "The current owner, if any." }

  - message: TopologyUpdate
    doc: >-
      A topology with its revision. After tmux.watch, the connection gets
      one as a `tmux.topology` event whenever the topology changes
      (including changes another tmux client made), coalesced to the latest.
    fields:
      - { n: 1, name: revision, type: u64, doc: "Increases with every change; never repeats within a daemon run." }
      - { n: 2, name: topology, type: Topology }

  # ---- actions ------------------------------------------------------------

  - enum: SplitDirection
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: horizontal, doc: Side by side. }
      - { n: 2, name: vertical, doc: One above the other. }

  - message: SplitPane
    doc: Split a pane; the new pane runs the default shell unless argv is given.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: direction, type: SplitDirection }
      - { n: 3, name: percent, type: u32, optional: true }
      - { n: 4, name: cells, type: u32, optional: true }
      - { n: 5, name: argv, type: string, repeated: true, doc: Exact program and arguments; never a shell string. }
      - { n: 6, name: cwd, type: string, optional: true }

  - message: NewWindow
    doc: A window at the end of a session; it runs the default shell unless argv is given.
    fields:
      - { n: 1, name: session, type: u32 }
      - { n: 2, name: name, type: string, optional: true }
      - { n: 3, name: argv, type: string, repeated: true, doc: Exact program and arguments; never a shell string. }
      - { n: 4, name: cwd, type: string, optional: true }

  - message: ResizePane
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: width, type: u32, optional: true }
      - { n: 3, name: height, type: u32, optional: true }

  - message: SelectPane
    fields:
      - { n: 1, name: pane, type: u32 }

  - message: SelectWindow
    fields:
      - { n: 1, name: window, type: u32 }

  - message: ZoomPane
    doc: Toggle zoom of a pane.
    fields:
      - { n: 1, name: pane, type: u32 }

  - message: RenameWindow
    fields:
      - { n: 1, name: window, type: u32 }
      - { n: 2, name: name, type: string }

  - message: RenameSession
    fields:
      - { n: 1, name: session, type: u32 }
      - { n: 2, name: name, type: string }

  - message: SendInput
    doc: >-
      Exact bytes to whatever runs in the pane now. With `generation`, the
      input is refused if the pane's process was replaced.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: data, type: bytes }
      - { n: 3, name: generation, type: u64, optional: true }
      - { n: 4, name: lease, type: string, optional: true, doc: "Automation's interaction lease on this pane." }

  - message: SendKeys
    doc: Named keys (tmux key names such as Enter or C-c) to the pane.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: keys, type: string, repeated: true }
      - { n: 3, name: generation, type: u64, optional: true }
      - { n: 4, name: lease, type: string, optional: true, doc: "Automation's interaction lease on this pane." }

  - message: KillPane
    fields:
      - { n: 1, name: pane, type: u32 }

  - message: KillWindow
    fields:
      - { n: 1, name: window, type: u32 }

  - message: MovePane
    doc: >-
      Move a pane, with its process, into another window: an existing one
      (`window`), or a new window of its own named `new_window` in the
      pane's session. Exactly one of the two. The pane keeps its id.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: window, type: u32, optional: true }
      - { n: 3, name: new_window, type: string, optional: true }

  - message: Action
    oneof:
      name: kind
      variants:
        - { n: 1, name: split_pane, type: SplitPane }
        - { n: 2, name: resize_pane, type: ResizePane }
        - { n: 3, name: select_pane, type: SelectPane }
        - { n: 4, name: select_window, type: SelectWindow }
        - { n: 5, name: zoom_pane, type: ZoomPane }
        - { n: 6, name: rename_window, type: RenameWindow }
        - { n: 7, name: rename_session, type: RenameSession }
        - { n: 8, name: send_input, type: SendInput }
        - { n: 9, name: send_keys, type: SendKeys }
        - { n: 10, name: kill_pane, type: KillPane }
        - { n: 11, name: kill_window, type: KillWindow }
        - { n: 12, name: new_window, type: NewWindow }
        - { n: 13, name: move_pane, type: MovePane }

  - message: SubmitAction
    fields:
      - { n: 1, name: action, type: Action }
      - { n: 2, name: endpoint, type: string, optional: true }
      - { n: 3, name: idempotency_key, type: string, optional: true, doc: "Resubmitting the same key returns the first action; different content is rejected." }
      - { n: 4, name: deadline_ms, type: u32, optional: true }

  - enum: ActionState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: accepted }
      - { n: 2, name: prepared }
      - { n: 3, name: dispatching }
      - { n: 4, name: completed }
      - { n: 5, name: failed }
      - { n: 6, name: cancelled }
      - { n: 7, name: outcome_unknown, doc: "The effect may or may not have happened; never retried automatically." }

  - message: ActionRecord
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: action, type: Action }
      - { n: 3, name: state, type: ActionState }
      - { n: 4, name: reason, type: string, optional: true, doc: Why it failed or why the outcome is unknown. }
      - { n: 5, name: observed, type: string, optional: true, doc: "What was observed in tmux afterwards, for example the new pane id." }
      - { n: 6, name: endpoint, type: string }
      - { n: 7, name: idempotency_key, type: string, optional: true }
      - { n: 8, name: created_unix_ms, type: u64 }
      - { n: 9, name: updated_unix_ms, type: u64 }
      - { n: 10, name: new_pane, type: u32, optional: true }

  - message: ActionQuery
    fields:
      - { n: 1, name: id, type: string }

  - message: ActionListParams
    fields:
      - { n: 1, name: limit, type: u32, optional: true, doc: Newest first; default 50. }

  - message: ActionList
    fields:
      - { n: 1, name: actions, type: ActionRecord, repeated: true }

  # ---- terminal mirrors ---------------------------------------------------

  - message: ReadParams
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: history, type: u32, optional: true, doc: "Scrollback lines to include before the screen; default 0, at most 10000." }
      - { n: 3, name: endpoint, type: string, optional: true }

  - message: TerminalText
    doc: A pane's text as the daemon's canonical mirror holds it.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: generation, type: u64 }
      - { n: 3, name: epoch, type: u64, doc: The control connection epoch the mirror belongs to. }
      - { n: 4, name: sequence, type: u64, doc: Records applied since the mirror attached. }
      - { n: 5, name: cols, type: u32 }
      - { n: 6, name: rows, type: u32 }
      - { n: 7, name: cursor_x, type: u32 }
      - { n: 8, name: cursor_y, type: u32 }
      - { n: 9, name: lines, type: string, repeated: true, doc: "Oldest first: history lines, then the screen." }
      - { n: 10, name: history_lines, type: u32 }

  - enum: MirrorState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: attaching, doc: Paused and being captured. }
      - { n: 2, name: live }
      - { n: 3, name: failed }

  - message: MirrorStatus
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: generation, type: u64 }
      - { n: 3, name: epoch, type: u64 }
      - { n: 4, name: state, type: MirrorState }
      - { n: 5, name: sequence, type: u64 }
      - { n: 6, name: ingested_bytes, type: u64 }
      - { n: 7, name: worker, type: u32 }
      - { n: 8, name: cols, type: u32 }
      - { n: 9, name: rows, type: u32 }
      - { n: 10, name: detail, type: string, optional: true }
      - { n: 11, name: tier, type: Tier }
      - { n: 12, name: journal_bytes, type: u64 }
      - { n: 13, name: journal_first_sequence, type: u64, doc: "Oldest retained journal record; sequence + 1 when none is retained." }
      - { n: 14, name: journal_records, type: u32 }
      - { n: 15, name: title, type: string, optional: true, doc: "Latest title the program set (OSC 0/2)." }
      - { n: 16, name: cwd, type: string, optional: true, doc: "Latest working directory the program reported (OSC 7)." }
      - { n: 17, name: reattaches, type: u32, doc: "Times the mirror was rebuilt from a fresh capture because the pane's output outran it." }

  - message: MirrorList
    fields:
      - { n: 1, name: mirrors, type: MirrorStatus, repeated: true }
      - { n: 2, name: workers, type: u32 }
      - { n: 3, name: host_journal_bytes, type: u64 }
      - { n: 4, name: journal_pane_limit, type: u64 }
      - { n: 5, name: journal_host_limit, type: u64 }
      - { n: 6, name: journal_max_age_ms, type: u64 }

  - enum: Tier
    doc: "Observation tier (spec 16.6). Hot: visible in a client. Warm: mirrored and journaled, not shown. Cold: metadata only."
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: hot }
      - { n: 2, name: warm }
      - { n: 3, name: cold }

  - message: SetTier
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: tier, type: Tier }
      - { n: 3, name: endpoint, type: string, optional: true }

  # ---- terminal subscriptions ---------------------------------------------
  # After `terminal.subscribe`, the daemon pushes on the same connection:
  #   bulk  topic `terminal.checkpoint`  CheckpointData (stream = subscription)
  #   event topic `terminal.records`     RecordBatch
  #   event topic `terminal.end`         SubscriptionEnd
  # A checkpoint (bulk) may arrive after records that follow it (events go
  # first); records with sequence <= the checkpoint's are already in it.

  - message: TerminalSubscribe
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: endpoint, type: string, optional: true }
      - { n: 3, name: resume_epoch, type: u64, optional: true, doc: "With generation and sequence: continue after this record instead of a new checkpoint, if it is still retained." }
      - { n: 4, name: resume_generation, type: u64, optional: true }
      - { n: 5, name: resume_sequence, type: u64, optional: true }
      - { n: 6, name: client, type: u64, optional: true, doc: "An id the client picks once per window; it names the client in TerminalInput too, so the daemon can address effects such as clipboard writes to exactly one." }

  - enum: SubscribeMode
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: checkpoint, doc: A checkpoint follows; records continue after its sequence. }
      - { n: 2, name: replay, doc: "No checkpoint; records continue right after the resume point." }

  - message: Subscription
    fields:
      - { n: 1, name: id, type: u64 }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: epoch, type: u64 }
      - { n: 4, name: generation, type: u64 }
      - { n: 5, name: mode, type: SubscribeMode }
      - { n: 6, name: sequence, type: u64, doc: "Checkpoint mode: the checkpoint's sequence. Replay mode: the resume point." }
      - { n: 7, name: checkpoint_bytes, type: u64 }
      - { n: 8, name: checkpoint_pause_us, type: u64, doc: How long the snapshot held the pane's owner. }
      - { n: 9, name: scrollback_lines, type: u32, doc: "The mirror's scrollback limit; a replica uses the same so both keep the same history." }
      - { n: 10, name: title, type: string, optional: true, doc: "The pane's current title: state, not an event." }
      - { n: 11, name: cwd, type: string, optional: true, doc: "The pane's current working directory: state, not an event." }

  - message: TerminalRecord
    doc: One journaled change. A resize when cols and rows are set, otherwise output bytes.
    fields:
      - { n: 1, name: sequence, type: u64 }
      - { n: 2, name: data, type: bytes }
      - { n: 3, name: cols, type: u32, optional: true }
      - { n: 4, name: rows, type: u32, optional: true }

  - message: RecordBatch
    fields:
      - { n: 1, name: subscription, type: u64 }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: epoch, type: u64 }
      - { n: 4, name: generation, type: u64 }
      - { n: 5, name: records, type: TerminalRecord, repeated: true }
      - { n: 6, name: effects, type: TerminalEffect, repeated: true, doc: "Live effects of these records; never present in replayed records." }

  - message: TerminalEffect
    doc: >-
      What applying one live record did besides changing the screen. Sent
      only to subscribers live when it happened: never replayed from the
      journal, a checkpoint, bootstrap, or a reconnect.
    fields:
      - { n: 1, name: id, type: u64, doc: "Increasing per pane mirror." }
      - { n: 2, name: sequence, type: u64, doc: "The record that produced it." }
      - { n: 3, name: bells, type: u32 }
      - { n: 4, name: title, type: string, optional: true, doc: "New title." }
      - { n: 5, name: cwd, type: string, optional: true, doc: "New working directory." }
      - { n: 6, name: clipboard, type: bytes, optional: true, doc: "Text the program wrote to the clipboard (OSC 52). Sent only to the subscription of the pane's focused client." }

  - message: CheckpointData
    fields:
      - { n: 1, name: subscription, type: u64 }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: epoch, type: u64 }
      - { n: 4, name: generation, type: u64 }
      - { n: 5, name: sequence, type: u64 }
      - { n: 6, name: snapshot, type: bytes, doc: "Engine snapshot; peers share the build family checked at handshake." }

  - enum: EndReason
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: lagged, doc: "The subscriber fell behind; resubscribe (resume if still retained)." }
      - { n: 2, name: pane_closed }
      - { n: 3, name: respawned, doc: The pane's process was replaced; subscribe to the new generation. }
      - { n: 4, name: connection_lost, doc: "The daemon lost its tmux connection; a new epoch follows." }
      - { n: 5, name: unsubscribed }
      - { n: 6, name: reattached, doc: "The pane's output outran its mirror, so the daemon rebuilt the mirror from a fresh capture. Subscribe again; a checkpoint follows." }
      - { n: 7, name: host_lost, doc: "A relayed subscription's host connection ended and will not come back by itself (disconnected, or a failure that is not retried). Subscribe again once the host is live." }
      - { n: 8, name: host_restarted, doc: "A relayed subscription's host daemon restarted, so its journal is gone. Subscribe again; a checkpoint follows." }

  - message: SubscriptionEnd
    fields:
      - { n: 1, name: subscription, type: u64 }
      - { n: 2, name: reason, type: EndReason }
      - { n: 3, name: detail, type: string, optional: true }

  - message: Unsubscribe
    fields:
      - { n: 1, name: subscription, type: u64 }

  # ---- input --------------------------------------------------------------

  - message: KeyInput
    doc: "A key press, encoded by the daemon with the pane's current keyboard modes."
    fields:
      - { n: 1, name: key, type: string, doc: "W3C KeyboardEvent.code name: KeyA, Digit1, ArrowUp, Enter, F5, ..." }
      - { n: 2, name: text, type: string, optional: true, doc: The text the key produced on the client keyboard layout. }
      - { n: 3, name: mods, type: u32, doc: "Bits: 1 shift, 2 ctrl, 4 alt, 8 super." }
      - { n: 4, name: held, type: bool, doc: "An auto-repeat of a key held down." }

  - message: TextInput
    doc: "Committed text (typing or IME commit); never IME preedit."
    fields:
      - { n: 1, name: text, type: string }

  - message: PasteInput
    doc: >-
      Bracketed exactly once when the application enabled bracketed paste.
      A paste larger than one request is sent in parts with the same id and
      `more` set on all but the last; the daemon encodes the whole paste
      once (at most 64 MiB).
    fields:
      - { n: 1, name: data, type: bytes }
      - { n: 2, name: more, type: bool }
      - { n: 3, name: id, type: u64 }

  - message: FocusInput
    doc: Sent to the application only if it asked for focus reports.
    fields:
      - { n: 1, name: gained, type: bool }

  - enum: MouseAction
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: press }
      - { n: 2, name: release }
      - { n: 3, name: motion }

  - enum: MouseButton
    values:
      - { n: 0, name: none, doc: Motion with no button held. }
      - { n: 1, name: left }
      - { n: 2, name: middle }
      - { n: 3, name: right }
      - { n: 4, name: wheel_up }
      - { n: 5, name: wheel_down }

  - message: MouseInput
    doc: >-
      A mouse event at a cell of the pane's canonical grid, encoded with the
      application's mouse tracking mode and format. Nothing is sent when the
      application does not track this kind of event. Wheel steps are presses
      of wheel_up or wheel_down, one per step.
    fields:
      - { n: 1, name: action, type: MouseAction }
      - { n: 2, name: button, type: MouseButton }
      - { n: 3, name: col, type: u32, doc: "0-based; clamped to the grid." }
      - { n: 4, name: row, type: u32, doc: "0-based; clamped to the grid." }
      - { n: 5, name: mods, type: u32, doc: "Bits as in KeyInput." }
      - { n: 6, name: buttons_held, type: bool, doc: "A button is down (for drag reporting)." }

  - message: TerminalInput
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: generation, type: u64, optional: true, doc: "Refuse the input if the pane's process was replaced." }
      - { n: 3, name: endpoint, type: string, optional: true }
      - { n: 4, name: client, type: u64, optional: true, doc: "The sending client's id (as in TerminalSubscribe); focus events make it the pane's focused client." }
      - { n: 5, name: lease, type: string, optional: true, doc: "Automation's interaction lease on this pane (leases.acquire). Without one, typed input is a person's: it revokes any lease on the pane." }
    oneof:
      name: event
      variants:
        - { n: 10, name: key, type: KeyInput }
        - { n: 11, name: text, type: TextInput }
        - { n: 12, name: paste, type: PasteInput }
        - { n: 13, name: focus, type: FocusInput }
        - { n: 14, name: mouse, type: MouseInput }

  - message: InputResult
    fields:
      - { n: 1, name: bytes, type: u64, doc: Encoded bytes delivered to the pane. }
      - { n: 2, name: batches, type: u32, doc: tmux command batches used. }

  # ---- interaction leases ---------------------------------------------------

  - message: LeaseAcquire
    doc: >-
      Ask to type into a pane as automation. One connection holds a pane's
      lease at a time; it expires unless used, and a person typing into the
      pane revokes it.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: ttl_ms, type: u32, optional: true, doc: "Idle time before the lease expires: default 30000, at most 600000. Each use starts it again." }

  - message: Lease
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: generation, type: u64, doc: "Increases with every lease on the pane; a revoked generation never comes back." }
      - { n: 4, name: expires_unix_ms, type: u64 }

  - message: LeaseRef
    fields:
      - { n: 1, name: id, type: string }

  # ---- remote hosts ---------------------------------------------------------

  - message: HostConnect
    doc: >-
      Connect the local daemon (the coordinator) to the daemon on another
      host through system ssh, running `dream bridge --stdio` there. SSH
      configuration, keys, and host verification stay the user's.
    fields:
      - { n: 1, name: name, type: string, doc: "A local label for this host; unique among hosts." }
      - { n: 2, name: destination, type: string, doc: "SSH destination: host alias, user@host, or ssh:// URI." }
      - { n: 3, name: dream, type: string, optional: true, doc: "Remote dream executable; default `dream` on the remote PATH. A leading ~/ is the remote home." }
      - { n: 4, name: tmux, type: string, optional: true, doc: "Remote tmux executable, for a remote daemon that has to be started." }
      - { n: 5, name: tmux_socket, type: string, optional: true, doc: "Remote tmux -L name." }
      - { n: 6, name: tmux_socket_path, type: string, optional: true, doc: "Remote tmux -S path." }
      - { n: 7, name: auto_reconnect, type: bool, optional: true, doc: "Retry a dropped connection by itself; default: the profile's policy, or off for a host given here." }

  - enum: HostFailure
    doc: Why the last attempt failed, and so whether retrying can help.
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: transient, doc: "Network, SSH ending, the remote daemon going away: retried under an auto policy." }
      - { n: 2, name: auth, doc: "SSH authentication was refused: never retried automatically." }
      - { n: 3, name: host_key, doc: "The host key is unknown or changed: never retried automatically." }
      - { n: 4, name: incompatible, doc: "The remote daemon's protocol or build does not match: needs an upgrade." }
      - { n: 5, name: not_installed, doc: "The remote dream executable was not found." }

  - message: HostStatus
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: destination, type: string }
      - { n: 3, name: state, type: LinkState }
      - { n: 4, name: remote, type: VersionInfo, doc: "The remote daemon's protocol and build, once live." }
      - { n: 5, name: remote_host, type: string, optional: true }
      - { n: 6, name: remote_pid, type: u32, optional: true }
      - { n: 7, name: remote_instance, type: string, optional: true, doc: "Changes when the remote daemon restarts." }
      - { n: 8, name: last_contact_unix_ms, type: u64, optional: true, doc: "Last successful exchange with the remote daemon." }
      - { n: 9, name: detail, type: string, optional: true, doc: "Why the host is not live: the reason and SSH's last diagnostic lines." }
      - { n: 10, name: failure, type: HostFailure }
      - { n: 11, name: attempts, type: u32, doc: "Failed attempts since the last live connection." }
      - { n: 12, name: next_retry_unix_ms, type: u64, optional: true, doc: "When the next automatic attempt starts, if one is scheduled." }
      - { n: 13, name: auto_reconnect, type: bool }
      - { n: 14, name: tags, type: string, repeated: true }
      - { n: 15, name: workspace, type: string, optional: true }
      - { n: 16, name: profile, type: bool, doc: "Defined in hosts.yaml." }

  - message: HostList
    doc: Every profile in hosts.yaml and every other host connected since the daemon started.
    fields:
      - { n: 1, name: hosts, type: HostStatus, repeated: true }
      - { n: 2, name: profiles_error, type: string, optional: true, doc: "hosts.yaml exists but is invalid: the error, with its location." }

  - message: HostRef
    fields:
      - { n: 1, name: name, type: string }

  - message: HostCall
    doc: >-
      One typed call forwarded to a connected host's daemon: `payload` is
      the method's parameters as Protobuf, exactly as in a local call.
      Methods that stream (subscriptions and watches) are refused.
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: method, type: string }
      - { n: 3, name: payload, type: bytes }

  - message: HostSubscribe
    doc: >-
      Follow a pane on a connected host through this daemon: the reply and
      the `terminal.*` events are those of terminal.subscribe, with this
      connection's own subscription id. When SSH drops and the host comes
      back, the subscription resumes from the host's journal by itself;
      it ends with host_lost or host_restarted when it cannot.
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: subscribe, type: TerminalSubscribe }

  - message: InstallPlanParams
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: artifacts, type: string, optional: true, doc: "Directory of server archives on this machine; default DREAMER_SERVER_ARTIFACTS, else share/dreamer/server beside this daemon." }

  - message: InstallPlan
    doc: >-
      What hosts.install would do, for review: found by probing the host
      through SSH. Installing requires this plan's id, so nothing different
      from what was reviewed can be installed.
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: destination, type: string }
      - { n: 3, name: remote_os, type: string }
      - { n: 4, name: remote_arch, type: string }
      - { n: 5, name: target, type: string, doc: "The matching Rust target, such as x86_64-unknown-linux-gnu." }
      - { n: 6, name: home, type: string }
      - { n: 7, name: installed, type: string, optional: true, doc: "The installed server's VERSION first line, if any." }
      - { n: 8, name: version, type: string, doc: "The version that would be installed (this daemon's own)." }
      - { n: 9, name: archive, type: string }
      - { n: 10, name: sha256, type: string }
      - { n: 11, name: size, type: u64 }
      - { n: 12, name: remote_dir, type: string }
      - { n: 13, name: steps, type: string, repeated: true, doc: "Each change, in order, in plain words." }
      - { n: 14, name: plan_id, type: string }

  - message: InstallParams
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: artifacts, type: string, optional: true }
      - { n: 3, name: plan_id, type: string, doc: "The id of the reviewed plan; a different plan now is refused." }

  - message: InstallResult
    fields:
      - { n: 1, name: version, type: string }
      - { n: 2, name: remote_dream, type: string, doc: "The installed dream, as run on the host." }
      - { n: 3, name: previous, type: string, optional: true }
      - { n: 4, name: check, type: string, doc: "What the installed dream --version printed on the host." }

  - message: UpgradeParams
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: artifacts, type: string, optional: true }
      - { n: 3, name: plan_id, type: string, doc: "The id of the reviewed install plan." }
      - { n: 4, name: allow_older, type: bool, doc: "Install even when the host has a newer version." }

  - message: UpgradeResult
    doc: >-
      An upgrade is a restart of the host's daemon, not a handover: its
      tmux sessions and panes keep running, but views of them start again
      from fresh checkpoints.
    fields:
      - { n: 1, name: from, type: string, optional: true, doc: "The version installed before, if any." }
      - { n: 2, name: to, type: string }
      - { n: 3, name: restarted, type: bool, doc: "The host's daemon was restarted on the new version." }
      - { n: 4, name: pid_before, type: u32, optional: true }
      - { n: 5, name: pid_after, type: u32, optional: true }
      - { n: 6, name: note, type: string }

  - message: HostReply
    doc: The remote daemon's result for a HostCall, as Protobuf.
    fields:
      - { n: 1, name: payload, type: bytes }

  # ---- grants -------------------------------------------------------------

  - message: Grant
    doc: >-
      What a connection may do. The user's own clients hold the owner grant
      (everything). A narrow grant lists its methods (exact names, or
      `service.*`), the panes it may read, follow, or type into, and an
      optional expiry. Checked by the daemon before every request; data can
      never widen it.
    fields:
      - { n: 1, name: owner, type: bool, doc: "Everything is allowed (the user's own clients)." }
      - { n: 2, name: methods, type: string, repeated: true }
      - { n: 3, name: panes, type: u32, repeated: true, doc: "Panes in scope; requests naming another pane are refused." }
      - { n: 4, name: all_panes, type: bool, doc: "Every pane is in scope." }
      - { n: 5, name: expires_unix_ms, type: u64, optional: true }

  - message: LaunchApp
    doc: >-
      Start a program in a new tmux window as a registered app. The daemon
      writes a single-use ticket to an owner-only file and gives the program
      only that file's path (DREAMER_LAUNCH_TICKET) and the launch id
      (DREAMER_LAUNCH_ID). The program registers with them for `grant`.
    fields:
      - { n: 1, name: app_id, type: string }
      - { n: 2, name: grant, type: Grant, doc: "What the app may do; with no panes and not all_panes, its own pane." }
      - { n: 3, name: argv, type: string, repeated: true, doc: Exact program and arguments; never a shell string. }
      - { n: 4, name: session, type: u32 }
      - { n: 5, name: name, type: string, optional: true, doc: "The window name; default the app id." }
      - { n: 6, name: cwd, type: string, optional: true }
      - { n: 7, name: ttl_ms, type: u32, optional: true, doc: "How long the ticket is valid; default 60000." }

  - message: LaunchedApp
    fields:
      - { n: 1, name: launch_id, type: string }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: expires_unix_ms, type: u64 }

  - message: RegisterApp
    fields:
      - { n: 1, name: launch_id, type: string }
      - { n: 2, name: ticket, type: string, doc: "The contents of the ticket file." }

  - message: Registration
    fields:
      - { n: 1, name: instance, type: string }
      - { n: 2, name: app_id, type: string }
      - { n: 3, name: pane, type: u32 }
      - { n: 4, name: grant, type: Grant }

  # ---- events -------------------------------------------------------------

  - message: DaemonEvent
    doc: "One entry of the daemon's event log: metadata only, never terminal content."
    fields:
      - { n: 1, name: sequence, type: u64, doc: "Increases by one per event within a daemon instance, from 1." }
      - { n: 2, name: kind, type: string, doc: "tmux.topology, actions.outcome, hosts.state, or apps.registered (see docs/events.md)." }
      - { n: 3, name: time_unix_ms, type: u64 }
      - { n: 4, name: pane, type: u32, optional: true, doc: "The pane the event is about, if any." }
      - { n: 5, name: host, type: string, optional: true, doc: "The remote host the event is about, if any." }
      - { n: 6, name: subject, type: string, optional: true, doc: "An action id or launch id." }
      - { n: 7, name: state, type: string, optional: true, doc: "An action outcome or a host's link state." }
      - { n: 8, name: revision, type: u64, optional: true, doc: "The topology revision." }

  - message: EventSubscribe
    fields:
      - { n: 1, name: kinds, type: string, repeated: true, doc: "Kinds or kind prefixes (`actions` matches `actions.outcome`); empty means every kind." }
      - { n: 2, name: panes, type: u32, repeated: true, doc: "Only events about these panes; empty means every event." }
      - { n: 3, name: after, type: u64, optional: true, doc: "Resume after this sequence; without it, only new events follow." }
      - { n: 4, name: instance, type: string, optional: true, doc: "The daemon instance the cursor came from (EventSubscription.instance)." }
      - { n: 5, name: quota, type: u32, optional: true, doc: "How many events this subscriber may fall behind before it skips ahead with a gap; default 1024." }

  - message: EventSubscription
    fields:
      - { n: 1, name: id, type: u64, doc: "Ends with events.unsubscribe." }
      - { n: 2, name: instance, type: string, doc: "This daemon instance; cursors are valid only within it." }
      - { n: 3, name: cursor, type: u64, doc: "Events after this sequence follow." }
      - { n: 4, name: oldest, type: u64, doc: "The oldest sequence the log still keeps." }

  - enum: EventGapReason
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: lagging, doc: "The subscriber fell further behind than its quota or the log." }
      - { n: 2, name: expired, doc: "The resume cursor is older than the log." }
      - { n: 3, name: restarted, doc: "The resume cursor is from another daemon instance; first and last are 0." }

  - message: EventGap
    doc: "Events in first..=last were not delivered; re-read state that depends on them."
    fields:
      - { n: 1, name: first, type: u64 }
      - { n: 2, name: last, type: u64 }
      - { n: 3, name: reason, type: EventGapReason }

  - message: EventBatch
    doc: "Pushed as `events.batch`: a gap, if any, comes before the events."
    fields:
      - { n: 1, name: subscription, type: u64 }
      - { n: 2, name: gap, type: EventGap }
      - { n: 3, name: events, type: DaemonEvent, repeated: true }
      - { n: 4, name: cursor, type: u64, doc: "Resume after this sequence to continue where this batch ends." }

  # ---- messages -----------------------------------------------------------

  - message: MessageSender
    doc: "Who sent a message, stamped by the daemon from the connection; never taken from the sender."
    fields:
      - { n: 1, name: instance, type: string, doc: "A registered app's instance, or owner:<n> for one of the user's own clients." }
      - { n: 2, name: app_id, type: string, optional: true }
      - { n: 3, name: pane, type: u32, optional: true, doc: "The registered app's pane." }
      - { n: 4, name: owner, type: bool, doc: "Sent under the owner grant." }

  - message: MessageEnvelope
    fields:
      - { n: 1, name: id, type: u64, doc: "Assigned by the daemon; increases per message." }
      - { n: 2, name: sender, type: MessageSender }
      - { n: 3, name: topic, type: string, optional: true }
      - { n: 4, name: recipient, type: string, optional: true, doc: "The instance a direct message, request, or reply is for." }
      - { n: 5, name: schema, type: u32, doc: "The payload's schema version, chosen by the sender." }
      - { n: 6, name: correlation, type: string, optional: true }
      - { n: 7, name: expires_unix_ms, type: u64, optional: true }
      - { n: 8, name: payload, type: bytes }
      - { n: 9, name: cause, type: u64, optional: true, doc: "The message this one answers or was caused by." }
      - { n: 10, name: origin, type: u64, doc: "The first message of this causal chain (its own id when it starts one)." }
      - { n: 11, name: depth, type: u32, doc: "Causal steps from the origin." }
      - { n: 12, name: claimed_sender, type: string, optional: true, doc: "What the sender said about itself: a claim, never authority." }
      - { n: 13, name: time_unix_ms, type: u64 }
      - { n: 14, name: request, type: bool, doc: "A request: answer it with messages.reply." }

  - message: MessagePublish
    doc: "A topic message or a direct message: give exactly one of topic and recipient."
    fields:
      - { n: 1, name: topic, type: string, optional: true, doc: "Not dreamer.*, human.*, policy.*, or approval.*: those are the daemon's." }
      - { n: 2, name: recipient, type: string, optional: true }
      - { n: 3, name: schema, type: u32 }
      - { n: 4, name: correlation, type: string, optional: true }
      - { n: 5, name: expires_unix_ms, type: u64, optional: true }
      - { n: 6, name: payload, type: bytes, doc: "At most 64 KiB." }
      - { n: 7, name: cause, type: u64, optional: true }
      - { n: 8, name: sender, type: string, optional: true, doc: "A claimed sender; recipients see it as claimed_sender, next to the stamped one." }

  - message: MessageSent
    fields:
      - { n: 1, name: id, type: u64 }
      - { n: 2, name: delivered, type: u32, doc: "Subscriptions it was handed to." }
      - { n: 3, name: depth, type: u32 }

  - message: MessageRequest
    fields:
      - { n: 1, name: recipient, type: string }
      - { n: 2, name: schema, type: u32 }
      - { n: 3, name: correlation, type: string, optional: true }
      - { n: 4, name: payload, type: bytes }
      - { n: 5, name: cause, type: u64, optional: true }
      - { n: 6, name: timeout_ms, type: u32, optional: true, doc: "Default 10000, at most 60000." }
      - { n: 7, name: sender, type: string, optional: true, doc: "A claimed sender (see MessagePublish.sender)." }

  - message: MessageReply
    fields:
      - { n: 1, name: request, type: u64, doc: "The request's id." }
      - { n: 2, name: schema, type: u32 }
      - { n: 3, name: payload, type: bytes }

  - message: MessageSubscribe
    fields:
      - { n: 1, name: topics, type: string, repeated: true, doc: "Exact topics, service.* prefixes, or *. Direct messages and requests to this connection arrive regardless." }

  - message: MessageSubscription
    fields:
      - { n: 1, name: id, type: u64, doc: "Ends with messages.unsubscribe." }
      - { n: 2, name: instance, type: string, doc: "This connection's identity as a recipient." }

  - message: MessageDelivery
    doc: "Pushed as `messages.deliver`."
    fields:
      - { n: 1, name: subscription, type: u64 }
      - { n: 2, name: envelope, type: MessageEnvelope }
      - { n: 3, name: missed, type: u64, doc: "Messages dropped for this subscription since the previous delivery, because it was full." }

  # ---- extensions ---------------------------------------------------------

  - enum: ExtensionState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: starting, doc: "Started; waiting for its answer to extension.hello." }
      - { n: 2, name: running }
      - { n: 3, name: restarting, doc: "Crashed or stalled; starting again after a delay." }
      - { n: 4, name: failed, doc: "Kept failing; parked until extensions.restart." }
      - { n: 5, name: disabled, doc: "enabled: false in extensions.yaml." }
      - { n: 6, name: stopped, doc: "The daemon is stopping." }

  - message: ExtensionStatus
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: state, type: ExtensionState }
      - { n: 3, name: pid, type: u32, optional: true }
      - { n: 4, name: restarts, type: u32, doc: "Times it was started again since the daemon started." }
      - { n: 5, name: failures, type: u32, doc: "Consecutive failures; reset after a minute of running." }
      - { n: 6, name: last_error, type: string, optional: true }
      - { n: 7, name: started_unix_ms, type: u64, optional: true }
      - { n: 8, name: next_start_unix_ms, type: u64, optional: true }
      - { n: 9, name: version, type: string, optional: true, doc: "What it said in its extension.hello answer." }
      - { n: 10, name: log, type: string, doc: "Its standard error, appended." }
      - { n: 11, name: grant, type: Grant }

  - message: ExtensionList
    fields:
      - { n: 1, name: extensions, type: ExtensionStatus, repeated: true }
      - { n: 2, name: config_error, type: string, optional: true, doc: "Why extensions.yaml could not be read; nothing was started from it." }

  - message: ExtensionRef
    fields:
      - { n: 1, name: name, type: string }

  # ---- scripts ------------------------------------------------------------

  - enum: ScriptState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: running }
      - { n: 2, name: restarting, doc: "Over a budget; starting again from its last-good source after a delay." }
      - { n: 3, name: failed, doc: "Kept failing; parked until scripts.reload." }
      - { n: 4, name: stopped }

  - message: ScriptGrant
    fields:
      - { n: 1, name: methods, type: string, repeated: true, doc: "Exact names or service.*." }
      - { n: 2, name: panes, type: u32, repeated: true }
      - { n: 3, name: all_panes, type: bool }

  - message: ScriptLimits
    doc: "Absent fields take the defaults (16 MiB, 50 ms, 5 s)."
    fields:
      - { n: 1, name: memory_bytes, type: u64, optional: true }
      - { n: 2, name: call_ms, type: u32, optional: true, doc: "Running time per call into the script." }
      - { n: 3, name: host_call_ms, type: u32, optional: true, doc: "Deadline of each dreamer.* call." }

  - message: ScriptLoad
    fields:
      - { n: 1, name: name, type: string, doc: "Unique among loaded scripts; its sender identity is script:<name>." }
      - { n: 2, name: source, type: string, doc: "Luau source; it runs once on load, then its handlers are called." }
      - { n: 3, name: grant, type: ScriptGrant }
      - { n: 4, name: events, type: string, repeated: true, doc: "Event kinds (prefixes) passed to the script's on_event; needs events.subscribe in the grant." }
      - { n: 5, name: limits, type: ScriptLimits }

  - message: ScriptSource
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: source, type: string }

  - message: ScriptCheck
    fields:
      - { n: 1, name: ok, type: bool }
      - { n: 2, name: error, type: string, optional: true }

  - message: ScriptRef
    fields:
      - { n: 1, name: name, type: string }

  - message: ScriptStatus
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: state, type: ScriptState }
      - { n: 3, name: revision, type: u32, doc: "The source revision running: 1 on load, +1 per successful reload." }
      - { n: 4, name: restarts, type: u32 }
      - { n: 5, name: failures, type: u32, doc: "Budget overruns in a row." }
      - { n: 6, name: last_error, type: string, optional: true }
      - { n: 7, name: handled, type: u64, doc: "Events passed to on_event." }
      - { n: 8, name: errors, type: u64, doc: "Handler errors (not budget overruns); the instance keeps running." }
      - { n: 9, name: grant, type: Grant }
      - { n: 10, name: events, type: string, repeated: true }

  - message: ScriptList
    fields:
      - { n: 1, name: scripts, type: ScriptStatus, repeated: true }

  # ---- taps ---------------------------------------------------------------

  - enum: TapLevel
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: raw, doc: "Decoded VT bytes in journal order." }
      - { n: 2, name: text, doc: "Committed lines without escapes; screen rows while an alternate-screen application runs." }
      - { n: 3, name: meta, doc: "Size, title, cwd, and activity; no content." }

  - message: TapSubscribe
    fields:
      - { n: 1, name: level, type: TapLevel }
      - { n: 2, name: panes, type: u32, repeated: true, doc: "The panes to follow." }
      - { n: 3, name: every_pane, type: bool, doc: "Follow every mirrored pane, including later ones (needs all_panes)." }
      - { n: 4, name: interval_ms, type: u32, optional: true, doc: "How often text and meta taps look for changes; default 250, at least 50." }

  - message: TapSubscription
    fields:
      - { n: 1, name: id, type: u64, doc: "Ends with taps.unsubscribe." }
      - { n: 2, name: panes, type: u32, repeated: true, doc: "The panes followed now." }

  - message: TapMeta
    fields:
      - { n: 1, name: cols, type: u32 }
      - { n: 2, name: rows, type: u32 }
      - { n: 3, name: title, type: string, optional: true }
      - { n: 4, name: cwd, type: string, optional: true }
      - { n: 5, name: sequence, type: u64, doc: "Records applied; it advancing means output." }
      - { n: 6, name: alt_screen, type: bool }

  - message: TapRow
    fields:
      - { n: 1, name: row, type: u32, doc: "0 is the top row of the screen." }
      - { n: 2, name: text, type: string }

  - message: TapGap
    doc: "Output this tap did not deliver. The pane itself lost nothing."
    fields:
      - { n: 1, name: reason, type: string, doc: "lagging (the tap fell behind), window (more lines scrolled between looks than a look reads), or restarted (the pane's program was replaced)." }
      - { n: 2, name: lines, type: u64, optional: true, doc: "Lines missed, when known." }

  - message: TapData
    doc: "Pushed as `taps.data`, for one pane."
    fields:
      - { n: 1, name: tap, type: u64 }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: generation, type: u64 }
      - { n: 4, name: gap, type: TapGap }
      - { n: 5, name: raw, type: bytes, doc: "raw: bytes as the program wrote them." }
      - { n: 6, name: lines, type: string, repeated: true, doc: "text: lines that scrolled into history, oldest first." }
      - { n: 7, name: screen, type: TapRow, repeated: true, doc: "text: rows of an alternate screen that changed." }
      - { n: 8, name: meta, type: TapMeta, doc: "meta: the pane's state when it changed." }
      - { n: 9, name: ended, type: bool, doc: "The pane is gone; nothing more follows for it." }
      - { n: 10, name: rows, type: u64, repeated: true, doc: "text: each line's row, counted from the top of the pane's history at the time." }
      - { n: 11, name: cols, type: u32, doc: "text: the pane's width when the lines were read." }

  # ---- terminal.query -----------------------------------------------------

  - message: TerminalQuery
    doc: "Which panes' recent lines match a pattern. Every bound is enforced; a truncated answer says so."
    fields:
      - { n: 1, name: pattern, type: string, doc: "A regular expression (linear time, size-limited), or plain text with `literal`." }
      - { n: 2, name: literal, type: bool }
      - { n: 3, name: ignore_case, type: bool }
      - { n: 4, name: literals, type: string, repeated: true, doc: "More plain-text alternatives." }
      - { n: 5, name: panes, type: u32, repeated: true, doc: "The panes to search; empty means every mirrored pane (needs all_panes)." }
      - { n: 6, name: lines, type: u32, optional: true, doc: "How many of each pane's newest lines (screen included); default 200, at most 2000." }
      - { n: 7, name: max_matches, type: u32, optional: true, doc: "Default 100, at most 1000." }
      - { n: 8, name: hosts, type: string, repeated: true, doc: "Connected hosts to search too (all their panes); `*` means every live host." }
      - { n: 9, name: timeout_ms, type: u32, optional: true, doc: "Default 2000, at most 10000; panes not searched in time are reported." }
      - { n: 10, name: title, type: string, optional: true, doc: "Only panes whose title matches this regular expression." }

  - message: QueryMatch
    fields:
      - { n: 1, name: host, type: string, optional: true, doc: "Absent for this host." }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: line, type: u32, doc: "Index in the searched window, oldest first." }
      - { n: 4, name: text, type: string }
      - { n: 5, name: match_start, type: u32, doc: "Byte offsets of the match in text." }
      - { n: 6, name: match_end, type: u32 }

  - message: QueryResult
    fields:
      - { n: 1, name: matches, type: QueryMatch, repeated: true }
      - { n: 2, name: panes_searched, type: u32 }
      - { n: 3, name: truncated, type: bool, doc: "A bound cut the answer short; see notes." }
      - { n: 4, name: notes, type: string, repeated: true, doc: "What was cut and why, and hosts that could not be searched." }

  # ---- filters ------------------------------------------------------------

  - enum: DecorationStyle
    values:
      - { n: 0, name: unspecified, doc: "No decoration." }
      - { n: 1, name: highlight }
      - { n: 2, name: dim }
      - { n: 3, name: fold, doc: "Clients may fold the line away; a local presentation choice." }
      - { n: 4, name: badge }

  - message: Decoration
    doc: "A mark on one line of a pane: data for clients to draw, never part of the terminal stream."
    fields:
      - { n: 1, name: id, type: u64 }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: generation, type: u64 }
      - { n: 4, name: row, type: u64, doc: "The line's row counted from the top of the pane's history." }
      - { n: 5, name: text, type: string, doc: "The line, as it was when marked." }
      - { n: 6, name: style, type: DecorationStyle }
      - { n: 7, name: badge, type: string, optional: true }
      - { n: 8, name: filter, type: string, doc: "The filter that made it." }
      - { n: 9, name: cols, type: u32, doc: "The pane's width when marked; a reflow invalidates it." }

  - message: DecorationQuery
    fields:
      - { n: 1, name: pane, type: u32 }

  - message: DecorationList
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: decorations, type: Decoration, repeated: true, doc: "Still valid: same generation and width, and the line is still at its row." }

  - enum: FilterState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: running }
      - { n: 2, name: paused, doc: "Paused with filters.pause." }
      - { n: 3, name: tripped, doc: "Its triggers came too fast (a loop?); paused until filters.resume." }

  - message: FilterInput
    doc: "A typed trigger: fixed text typed into a pane. Matched text is never typed."
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: text, type: string }

  - message: FilterSpec
    fields:
      - { n: 1, name: name, type: string, doc: "Unique; its sender identity is filter:<name>." }
      - { n: 2, name: panes, type: u32, repeated: true }
      - { n: 3, name: every_pane, type: bool }
      - { n: 4, name: pattern, type: string, doc: "As in terminal.query: a regular expression, or plain text with `literal`." }
      - { n: 5, name: literal, type: bool }
      - { n: 6, name: literals, type: string, repeated: true }
      - { n: 7, name: ignore_case, type: bool }
      - { n: 8, name: topic, type: string, optional: true, doc: "Publish each matched line here (the derived stream)." }
      - { n: 9, name: recipient, type: string, optional: true, doc: "Send each matched line to this instance." }
      - { n: 10, name: event, type: bool, doc: "Record each match as a filters.matched event (scripts receive them with on_event)." }
      - { n: 11, name: input, type: FilterInput, doc: "Type this into a pane on each match." }
      - { n: 12, name: grant, type: ScriptGrant, doc: "What the filter may do: taps.subscribe for its panes, plus what its outputs need." }
      - { n: 13, name: per_second, type: u32, optional: true, doc: "Matches acted on per second; more are counted as dropped. Default 20." }
      - { n: 14, name: breaker, type: u32, optional: true, doc: "Triggers (topic, recipient, input) allowed in any 10 s; one more trips the filter. Default 50." }
      - { n: 15, name: decorate, type: DecorationStyle, doc: "Mark each matched line on its pane (drawn by clients)." }
      - { n: 16, name: badge, type: string, optional: true, doc: "The badge text for decorate: badge." }

  - message: FilterRef
    fields:
      - { n: 1, name: name, type: string }

  - message: FilterStatus
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: state, type: FilterState }
      - { n: 3, name: matched, type: u64 }
      - { n: 4, name: dropped, type: u64, doc: "Matches over per_second." }
      - { n: 5, name: triggered, type: u64 }
      - { n: 6, name: skipped_own, type: u64, doc: "Lines skipped because they echo this filter's own input." }
      - { n: 7, name: last_error, type: string, optional: true }
      - { n: 8, name: reason, type: string, optional: true, doc: "Why it is paused or tripped." }

  - message: FilterList
    fields:
      - { n: 1, name: filters, type: FilterStatus, repeated: true }

  # ---- jobs ---------------------------------------------------------------

  - enum: JobState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: running }
      - { n: 2, name: succeeded, doc: "Exited with status 0." }
      - { n: 3, name: failed, doc: "Exited with another status." }
      - { n: 4, name: killed, doc: "Ended by a signal (including a cancel)." }
      - { n: 5, name: lost, doc: "Its pane is gone and it left no exit status." }

  - message: EnvVar
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: value, type: string }

  - message: JobStart
    fields:
      - { n: 1, name: argv, type: string, repeated: true, doc: "The exact program and arguments; no shell." }
      - { n: 2, name: cwd, type: string, optional: true }
      - { n: 3, name: env, type: EnvVar, repeated: true, doc: "Added to the job's environment; names are [A-Z_][A-Z0-9_]*." }
      - { n: 4, name: name, type: string, optional: true, doc: "The tmux window name; default the program's name." }
      - { n: 5, name: session, type: u32, optional: true, doc: "The session for its window; default the first session." }

  - message: JobRecord
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: argv, type: string, repeated: true }
      - { n: 3, name: cwd, type: string, optional: true }
      - { n: 4, name: pane, type: u32, doc: "Its tmux pane: read its output with terminal.read while the pane remains." }
      - { n: 5, name: state, type: JobState }
      - { n: 6, name: exit_code, type: i32, optional: true }
      - { n: 7, name: signal, type: i32, optional: true }
      - { n: 8, name: started_unix_ms, type: u64 }
      - { n: 9, name: ended_unix_ms, type: u64, optional: true }
      - { n: 10, name: artifacts, type: string, doc: "The directory the job was given as DREAMER_JOB_ARTIFACTS." }
      - { n: 11, name: cancelled, type: bool, doc: "jobs.cancel was asked." }
      - { n: 12, name: pid, type: u32, optional: true }

  - message: JobRef
    fields:
      - { n: 1, name: id, type: string }

  - message: JobList
    fields:
      - { n: 1, name: jobs, type: JobRecord, repeated: true }

  - message: JobFile
    fields:
      - { n: 1, name: path, type: string, doc: "Relative to the artifacts directory." }
      - { n: 2, name: bytes, type: u64 }

  - message: JobArtifacts
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: directory, type: string }
      - { n: 3, name: files, type: JobFile, repeated: true, doc: "At most 1000, sorted by path." }

  # ---- processes ----------------------------------------------------------

  - message: ProcessQuery
    fields:
      - { n: 1, name: panes, type: u32, repeated: true, doc: "Only processes in these panes; empty means every process of the user (needs all_panes)." }
      - { n: 2, name: runs_only, type: bool, doc: "Only processes that are agent runs." }
      - { n: 3, name: provider, type: string, optional: true, doc: "Only runs of this provider: claude or codex." }

  - message: ProcessRecord
    doc: "One process and what the registry can say about it, with the evidence. Absent fields are unknown, not zero."
    fields:
      - { n: 1, name: pid, type: u32 }
      - { n: 2, name: started_unix_ms, type: u64, doc: "With pid, the process's identity: a reused pid has a different start." }
      - { n: 3, name: ppid, type: u32 }
      - { n: 4, name: pgid, type: u32 }
      - { n: 5, name: tty, type: string, optional: true }
      - { n: 6, name: command, type: string, doc: "The program's file name." }
      - { n: 7, name: args, type: string, doc: "The command line (at most 1024 bytes)." }
      - { n: 8, name: cwd, type: string, optional: true, doc: "Reported for runs only, when the system says." }
      - { n: 9, name: pane, type: u32, optional: true }
      - { n: 10, name: pane_evidence, type: string, optional: true, doc: "ancestry (it descends from the pane's program) or terminal (it only shares the pane's terminal)." }
      - { n: 11, name: provider, type: string, optional: true, doc: "claude or codex, when this is the topmost process of an agent run." }
      - { n: 12, name: confidence, type: string, optional: true, doc: "high, medium, or low, for a run." }
      - { n: 13, name: evidence, type: string, optional: true, doc: "Why it is counted as a run." }
      - { n: 14, name: helper_of, type: u32, optional: true, doc: "The run this process serves (a tool, a server); never itself a run." }
      - { n: 15, name: cpu_permille, type: u32, doc: "CPU use in tenths of a percent of one core, as ps averages it." }
      - { n: 16, name: rss_kib, type: u64, doc: "Resident memory." }

  - message: AgentRunQuery
    fields:
      - { n: 1, name: hosts, type: string, repeated: true, doc: "Connected hosts to ask too; `*` means every live host." }
      - { n: 2, name: provider, type: string, optional: true, doc: "claude or codex." }

  - message: AgentRun
    doc: "One agent run, by evidence. State says only what is known: never inferred from titles, CPU, or output."
    fields:
      - { n: 1, name: host, type: string, optional: true, doc: "Absent for this host." }
      - { n: 2, name: pid, type: u32 }
      - { n: 3, name: started_unix_ms, type: u64, doc: "With host and pid, the run's identity." }
      - { n: 4, name: provider, type: string }
      - { n: 5, name: pane, type: u32, optional: true }
      - { n: 6, name: cwd, type: string, optional: true }
      - { n: 7, name: age_ms, type: u64 }
      - { n: 8, name: cpu_permille, type: u32 }
      - { n: 9, name: rss_kib, type: u64 }
      - { n: 10, name: confidence, type: string }
      - { n: 11, name: evidence, type: string }
      - { n: 12, name: instrumentation, type: string, doc: "passive (found from its process only) or hooks (its provider's hooks report to the daemon)." }
      - { n: 13, name: state, type: string, doc: "passive: running. hooks: active, working, waiting_for_permission, idle (a turn ended), ended, or stale (no report for a while)." }
      - { n: 14, name: helpers, type: u32, doc: "Processes serving it (tools, servers), not counted as runs." }
      - { n: 15, name: session_id, type: string, optional: true, doc: "The provider's session, when its hooks report it." }
      - { n: 16, name: last_event_unix_ms, type: u64, optional: true, doc: "When its hooks last reported." }

  - message: AgentEvent
    doc: "One provider hook report, as dream hook sends it."
    fields:
      - { n: 1, name: provider, type: string, doc: "claude" }
      - { n: 2, name: event, type: string, doc: "The provider's event name, such as SessionStart or Notification." }
      - { n: 3, name: session_id, type: string }
      - { n: 4, name: cwd, type: string, optional: true }
      - { n: 5, name: detail, type: string, optional: true, doc: "The notification type, or why a session ended." }
      - { n: 6, name: hook_pid, type: u32, doc: "The reporting hook process; its ancestry finds the run. It is never the run itself." }

  - message: AgentRunList
    fields:
      - { n: 1, name: runs, type: AgentRun, repeated: true }
      - { n: 2, name: notes, type: string, repeated: true, doc: "Hosts that could not be asked, and why." }

  - message: ProcessList
    fields:
      - { n: 1, name: processes, type: ProcessRecord, repeated: true }
      - { n: 2, name: taken_unix_ms, type: u64 }

methods:
  - { method: daemon.version, params: Empty, result: VersionInfo, doc: Protocol and build identity. }
  - { method: daemon.status, params: Empty, result: DaemonStatus, doc: "Process, socket, log, and tmux endpoint state." }
  - { method: daemon.shutdown, params: Empty, result: ShutdownResult, mutation: true, doc: "Stop the daemon; tmux sessions and panes keep running." }
  - { method: tmux.topology, params: TopologyParams, result: Topology, doc: "Sessions, windows, and panes of one endpoint." }
  - { method: tmux.size_window, params: SizeWindow, result: SizeResult, mutation: true, doc: "Size a tmux window for the client that owns its size (see SizeWindow)." }
  - { method: tmux.watch, params: TopologyParams, result: TopologyUpdate, doc: "The current topology; afterwards `tmux.topology` events follow every change." }
  - { method: actions.submit, params: SubmitAction, result: ActionRecord, mutation: true, doc: "Run a typed action and report its observed outcome." }
  - { method: leases.acquire, params: LeaseAcquire, result: Lease, mutation: true, doc: "Hold a pane's interaction lease, so automated input to it is accepted until a person types there." }
  - { method: leases.release, params: LeaseRef, result: Empty, mutation: true }
  - { method: actions.get, params: ActionQuery, result: ActionRecord }
  - { method: actions.list, params: ActionListParams, result: ActionList }
  - { method: terminal.read, params: ReadParams, result: TerminalText, doc: "Bounded text, cursor, and size from a pane's canonical mirror." }
  - { method: terminal.mirrors, params: TopologyParams, result: MirrorList, doc: Every mirrored pane and its state. }
  - { method: terminal.set_tier, params: SetTier, result: Empty, mutation: true, doc: Mark a mirrored pane Hot or Warm. }
  - { method: terminal.subscribe, params: TerminalSubscribe, result: Subscription, doc: "Follow a pane's canonical mirror: checkpoint or replay, then ordered records." }
  - { method: terminal.unsubscribe, params: Unsubscribe, result: Empty }
  - { method: terminal.input, params: TerminalInput, result: InputResult, mutation: true, doc: "Keys, text, paste, focus, or mouse for a pane, encoded against its canonical state." }
  - { method: hosts.connect, params: HostConnect, result: HostStatus, mutation: true, doc: "Connect to another host's daemon over ssh; the connection belongs to this daemon, not the caller. With no destination, `name` is a profile from hosts.yaml." }
  - { method: hosts.list, params: Empty, result: HostList, doc: "Every remote host this daemon knows and its state." }
  - { method: hosts.disconnect, params: HostRef, result: HostStatus, mutation: true, doc: "Close a host's ssh connection. The remote daemon and its tmux keep running." }
  - { method: hosts.reconnect, params: HostRef, result: HostStatus, mutation: true, doc: "Connect again now, also after a failure that is not retried automatically." }
  - { method: hosts.subscribe, params: HostSubscribe, result: Subscription, doc: "Follow a pane on a connected host; resumes from the host's journal after SSH loss. End it with terminal.unsubscribe." }
  - { method: hosts.watch, params: HostRef, result: TopologyUpdate, doc: "A host's topology; afterwards `tmux.topology` events follow every change, across reconnects. One watch (local or a host) per connection." }
  - { method: hosts.install_plan, params: InstallPlanParams, result: InstallPlan, doc: "Probe a host over SSH and say what installing this daemon's server version there would do." }
  - { method: hosts.install, params: InstallParams, result: InstallResult, mutation: true, doc: "Install the reviewed plan: stream the archive, verify its SHA-256 on the host, unpack into a versioned directory, switch atomically." }
  - { method: hosts.upgrade, params: UpgradeParams, result: UpgradeResult, mutation: true, doc: "Install the reviewed plan, restart the host's daemon on it (tmux keeps running), and reconnect." }
  - { method: hosts.call, params: HostCall, result: HostReply, mutation: true, doc: "Forward one typed call to a connected host's daemon." }
  - { method: grants.narrow, params: Grant, result: Grant, mutation: true, doc: "Give up authority on this connection: the new grant must be within the current one. Nothing widens a grant." }
  - { method: grants.current, params: Empty, result: Grant, doc: "The calling connection's own grant." }
  - { method: apps.launch, params: LaunchApp, result: LaunchedApp, mutation: true, doc: "Start a program in a new tmux window with a single-use registration ticket (owner only)." }
  - { method: events.subscribe, params: EventSubscribe, result: EventSubscription, doc: "Follow the daemon's event log: `events.batch` events follow, with a gap whenever events were skipped." }
  - { method: events.unsubscribe, params: Unsubscribe, result: Empty }
  - { method: messages.publish, params: MessagePublish, result: MessageSent, mutation: true, doc: "Send a topic or direct message; the daemon stamps the sender. Never typed into a pane." }
  - { method: messages.request, params: MessageRequest, result: MessageEnvelope, mutation: true, doc: "Send a request to one instance and wait for its reply." }
  - { method: messages.reply, params: MessageReply, result: MessageSent, mutation: true, doc: "Answer a request sent to this connection." }
  - { method: messages.subscribe, params: MessageSubscribe, result: MessageSubscription, doc: "Receive messages: `messages.deliver` events follow." }
  - { method: messages.unsubscribe, params: Unsubscribe, result: Empty }
  - { method: extensions.list, params: Empty, result: ExtensionList, doc: "Supervised extensions and their state." }
  - { method: extensions.restart, params: ExtensionRef, result: ExtensionStatus, mutation: true, doc: "Stop an extension if it runs and start it now, also one parked as failed (owner only)." }
  - { method: scripts.validate, params: ScriptSource, result: ScriptCheck, doc: "Compile a script without running it." }
  - { method: scripts.load, params: ScriptLoad, result: ScriptStatus, mutation: true, doc: "Run a script in its own sandboxed VM with the given grant until it is stopped or the daemon stops (owner only)." }
  - { method: scripts.reload, params: ScriptSource, result: ScriptStatus, mutation: true, doc: "Replace a script's source atomically; an update that does not load leaves the last-good version running (owner only)." }
  - { method: scripts.stop, params: ScriptRef, result: ScriptStatus, mutation: true, doc: "Stop and unload a script (owner only)." }
  - { method: scripts.list, params: Empty, result: ScriptList }
  - { method: terminal.query, params: TerminalQuery, result: QueryResult, doc: "Search the newest lines of many panes, here and on connected hosts, within fixed bounds." }
  - { method: decorations.list, params: DecorationQuery, result: DecorationList, doc: "A pane's valid decorations; a decorations.changed event says when to list again." }
  - { method: filters.install, params: FilterSpec, result: FilterStatus, mutation: true, doc: "Start a filter: a text tap, the Rust match stage, and its outputs, under its own grant (owner only)." }
  - { method: filters.list, params: Empty, result: FilterList }
  - { method: filters.pause, params: FilterRef, result: FilterStatus, mutation: true, doc: "(owner only)" }
  - { method: filters.resume, params: FilterRef, result: FilterStatus, mutation: true, doc: "Resume a paused or tripped filter (owner only)." }
  - { method: filters.remove, params: FilterRef, result: FilterStatus, mutation: true, doc: "(owner only)" }
  - { method: jobs.start, params: JobStart, result: JobRecord, mutation: true, doc: "Run an exact program in its own tmux window through the job wrapper; it keeps running if the daemon stops." }
  - { method: jobs.get, params: JobRef, result: JobRecord }
  - { method: jobs.list, params: Empty, result: JobList }
  - { method: jobs.cancel, params: JobRef, result: JobRecord, mutation: true, doc: "Send SIGTERM to the job's program; its record says killed once it ends." }
  - { method: jobs.artifacts, params: JobRef, result: JobArtifacts, doc: "The files the job left in its artifacts directory." }
  - { method: processes.list, params: ProcessQuery, result: ProcessList, doc: "The user's processes on this host, with their panes and agent runs, by evidence." }
  - { method: agents.event, params: AgentEvent, result: Empty, mutation: true, doc: "A provider hook's report about its session (sent by dream hook)." }
  - { method: agents.runs, params: AgentRunQuery, result: AgentRunList, doc: "Agent runs (Claude Code, Codex) here and on connected hosts, from the process registry." }
  - { method: taps.subscribe, params: TapSubscribe, result: TapSubscription, doc: "Follow panes at one level; `taps.data` events follow. A tap never slows the panes it reads: one that falls behind gets a gap." }
  - { method: taps.unsubscribe, params: Unsubscribe, result: Empty }
  - { method: apps.register, params: RegisterApp, result: Registration, mutation: true, doc: "Trade a launch ticket for the app's narrow grant on this connection." }

# What the daemon pushes on a connection, by topic. JSON-RPC clients receive
# each as a notification whose method is the topic and whose params is the
# payload record.
notifications:
  - { topic: terminal.records, payload: RecordBatch, doc: "Records of a terminal or host subscription, in order." }
  - { topic: terminal.checkpoint, payload: CheckpointData, doc: "A subscription's starting snapshot (a bulk stream on the native wire)." }
  - { topic: terminal.end, payload: SubscriptionEnd, doc: "A subscription ended; nothing more follows for it." }
  - { topic: tmux.topology, payload: TopologyUpdate, doc: "The watched topology changed." }
  - { topic: events.batch, payload: EventBatch, doc: "Events of an events.subscribe subscription, after its gap if any." }
  - { topic: messages.deliver, payload: MessageDelivery, doc: "A message for a messages.subscribe subscription." }
  - { topic: taps.data, payload: TapData, doc: "Output of a taps.subscribe subscription, for one pane." }
