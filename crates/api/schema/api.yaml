# Dreamer API schema: the single source for every typed operation.
#
# `cargo xtask api` regenerates, from this file:
#   crates/api/src/generated.rs      Rust SDK types (Protobuf + JSON) and dispatch
#   crates/api/generated/openrpc.json  JSON-RPC surface (OpenRPC 1.3)
#   crates/api/generated/dreamer.luau  Luau module stubs for scripts
#   crates/api/generated/dreamer.proto Protobuf description for other languages
# and checks it against crates/api/schema/compat.lock. Evolution rules are in
# docs/api.md: never reuse or renumber a field, never change a field's type,
# add instead of changing, and bump the major version for anything breaking.
#
# Field types: string, bool, u32, u64, i32, i64, bytes, an enum or message
# name. `repeated: true` makes a list; `optional: true` an explicitly
# optional scalar (messages are always optional).

version: { major: 1, minor: 64 }
package: dreamer.v1

types:
  - message: Empty
    doc: No parameters or no result.

  - message: RpcError
    doc: A failed call. Codes follow JSON-RPC 2.0 where they apply.
    fields:
      - { n: 1, name: code, type: i32 }
      - { n: 2, name: message, type: string }
      - { n: 3, name: data, type: string, optional: true, doc: Machine-readable detail. }

  # ---- daemon -------------------------------------------------------------

  - message: VersionInfo
    fields:
      - { n: 1, name: protocol_major, type: u32 }
      - { n: 2, name: protocol_minor, type: u32 }
      - { n: 3, name: daemon_version, type: string }
      - { n: 4, name: build_family, type: string, doc: "Engine build family; peers must match exactly." }
      - { n: 5, name: ghostty_commit, type: string }
      - { n: 6, name: platform, type: string, doc: "For example aarch64-apple-darwin." }

  - enum: LinkState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: connecting }
      - { n: 2, name: live }
      - { n: 3, name: closed }
      - { n: 4, name: failed }

  - message: EndpointStatus
    doc: One tmux server the daemon manages.
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: socket, type: string, doc: "tmux -L name or -S path, as configured." }
      - { n: 3, name: state, type: LinkState }
      - { n: 4, name: tmux_version, type: string, optional: true }
      - { n: 5, name: detail, type: string, optional: true, doc: Why the link is not live. }

  - message: DaemonStatus
    fields:
      - { n: 1, name: pid, type: u32 }
      - { n: 2, name: started_unix_ms, type: u64 }
      - { n: 3, name: uptime_ms, type: u64 }
      - { n: 4, name: socket_path, type: string }
      - { n: 5, name: log_path, type: string }
      - { n: 6, name: endpoints, type: EndpointStatus, repeated: true }
      - { n: 7, name: version, type: VersionInfo }
      - { n: 8, name: clients, type: u32, doc: "Connected API clients, including the caller." }
      - { n: 9, name: heap_in_use, type: u64, optional: true, doc: "Bytes the daemon's allocator has handed out and not had back, without the freed memory it keeps for reuse; absent where the platform cannot tell." }
      - { n: 10, name: desktops, type: u32, doc: "Desktop processes connected now that answer apps.capture." }

  - message: DiagnosticsSettings
    doc: "Turn the daemon's performance diagnostics on or off. They are off by default, and cost nothing while off."
    fields:
      - { n: 1, name: enabled, type: bool }
      - { n: 2, name: reset, type: bool, doc: "Also start every timing and counter again from zero." }

  - message: StageTiming
    doc: "How long one stage of the terminal path took, over every sample since diagnostics were turned on or reset. Percentiles come from histogram buckets and are within 6 %."
    fields:
      - { n: 1, name: stage, type: string, doc: "input, tmux, decode, route, parse, publish, or transfer; see docs/performance.md." }
      - { n: 2, name: count, type: u64 }
      - { n: 3, name: total_ns, type: u64 }
      - { n: 4, name: p50_ns, type: u64 }
      - { n: 5, name: p95_ns, type: u64 }
      - { n: 6, name: p99_ns, type: u64 }
      - { n: 7, name: max_ns, type: u64 }

  - message: Diagnostics
    doc: "The daemon's performance diagnostics. Timings and counters cover the time since diagnostics were turned on or reset, and only while on; queue depths are read now, on or off. Nothing here holds terminal content."
    fields:
      - { n: 1, name: enabled, type: bool }
      - { n: 2, name: collecting_ms, type: u64, doc: "Since diagnostics were turned on or last reset." }
      - { n: 3, name: stages, type: StageTiming, repeated: true, doc: "The daemon's stages, in path order." }
      - { n: 4, name: tmux_bytes, type: u64, doc: "Bytes read from tmux's control output." }
      - { n: 5, name: parsed_bytes, type: u64, doc: "Output bytes parsed by canonical mirrors." }
      - { n: 6, name: parser_bytes_per_second, type: u64, doc: "parsed_bytes over the time spent in the parse stage: the canonical parser's throughput while it works." }
      - { n: 7, name: records, type: u64, doc: "Records (output chunks and resizes) applied by canonical mirrors." }
      - { n: 8, name: transferred_bytes, type: u64, doc: "Terminal record bytes sent to subscribed clients, replays included." }
      - { n: 9, name: transferred_batches, type: u64 }
      - { n: 10, name: checkpoints, type: u64, doc: "Subscriptions (views, taps, collectors) started from a checkpoint." }
      - { n: 11, name: checkpoint_bytes, type: u64 }
      - { n: 12, name: replays, type: u64, doc: "Subscriptions started by replaying the journal." }
      - { n: 13, name: lagged_subscribers, type: u64, doc: "Subscriptions ended because their queue was full: dropped subscriber events, each reported to its subscriber as lagged." }
      - { n: 14, name: reattaches, type: u64, doc: "Mirrors rebuilt from a fresh capture because a pane's output outran them." }
      - { n: 15, name: cold_dropped_bytes, type: u64, doc: "Output of Cold panes, dropped before any VT work." }
      - { n: 16, name: event_queue, type: u32, doc: "Events from tmux waiting for the mirror router." }
      - { n: 17, name: backlog_panes, type: u32, doc: "Panes with output held because their owner's queue is full." }
      - { n: 18, name: backlog_bytes, type: u64 }
      - { n: 19, name: attaching, type: u32, doc: "Mirror attaches in progress." }
      - { n: 20, name: attach_queue, type: u32, doc: "Panes waiting for a turn to attach." }
      - { n: 21, name: worker_queues, type: u32, repeated: true, doc: "Output messages waiting for each VT owner." }
      - { n: 22, name: worker_queue_capacity, type: u32 }
      - { n: 23, name: subscribers, type: u32, doc: "Subscriptions following mirrors now." }
      - { n: 24, name: subscriber_queue_max, type: u32, doc: "Records waiting in the fullest subscriber queue." }
      - { n: 25, name: subscriber_queue_capacity, type: u32 }

  - message: ShutdownResult
    fields:
      - { n: 1, name: effect, type: string, doc: "What stops and what keeps running (tmux panes always keep running)." }

  # ---- tmux topology ------------------------------------------------------

  - message: TopologyParams
    fields:
      - { n: 1, name: endpoint, type: string, optional: true, doc: Endpoint name; the default endpoint when absent. }

  - message: Session
    fields:
      - { n: 1, name: id, type: u32, doc: "tmux session id ($N)." }
      - { n: 2, name: name, type: string }
      - { n: 3, name: windows, type: u32, repeated: true, doc: Window ids in index order. }
      - { n: 4, name: active_window, type: u32, optional: true }
      - { n: 5, name: holding, type: bool, doc: "Dreamer's holding session for hidden harness drawers. Clients leave it out of tabs, sidebars, and session lists." }

  - message: Window
    fields:
      - { n: 1, name: id, type: u32, doc: "tmux window id (@N)." }
      - { n: 2, name: name, type: string }
      - { n: 3, name: sessions, type: u32, repeated: true, doc: Sessions the window is linked into. }
      - { n: 4, name: index, type: u32 }
      - { n: 5, name: panes, type: u32, repeated: true }
      - { n: 6, name: active_pane, type: u32, optional: true }
      - { n: 7, name: zoomed, type: bool }
      - { n: 8, name: layout_supported, type: bool, doc: "False for layouts Dreamer cannot draw yet (floating panes)." }
      - { n: 9, name: width, type: u32 }
      - { n: 10, name: height, type: u32 }

  - message: Pane
    fields:
      - { n: 1, name: id, type: u32, doc: "tmux pane id (%N)." }
      - { n: 2, name: window, type: u32 }
      - { n: 3, name: width, type: u32 }
      - { n: 4, name: height, type: u32 }
      - { n: 5, name: left, type: u32 }
      - { n: 6, name: top, type: u32 }
      - { n: 7, name: active, type: bool }
      - { n: 8, name: pid, type: u32, optional: true }
      - { n: 9, name: current_command, type: string }
      - { n: 10, name: title, type: string }
      - { n: 11, name: dead, type: bool }
      - { n: 12, name: generation, type: u64, doc: Process generation; changes when the pane is respawned. }
      - { n: 13, name: mode, type: string, optional: true, doc: "A tmux-drawn mode the pane is in (copy-mode, tree-mode, ...). Its screen is tmux's, not the program's, and Dreamer does not draw it." }
      - { n: 14, name: drawer_of, type: u32, optional: true, doc: "This pane is the harness drawer of that tmux session (drawer.toggle)." }
      - { n: 15, name: app, type: PaneApp, doc: "The registered app whose host is this pane's program, if any: desktops draw its view (apps.view) in the pane's rectangle instead of the terminal." }
      - { n: 16, name: web, type: string, optional: true, doc: "This pane is a placeholder for a web page at this URL (web.open): desktops that can draw web pages show the page in the pane's rectangle instead of the terminal; other clients see the placeholder's text." }
      - { n: 17, name: web_scroll_x, type: i32, doc: "A web pane's scroll position in CSS pixels as the desktop drawing it last reported it (web.state), kept in the placeholder for the page to open there again; 0 before a report." }
      - { n: 18, name: web_scroll_y, type: i32 }

  - message: PaneApp
    fields:
      - { n: 1, name: instance, type: string }
      - { n: 2, name: app_id, type: string }
      - { n: 3, name: live, type: bool, doc: "The host is connected. When false, apps.view keeps its last view, to be shown as stale." }

  - message: Topology
    fields:
      - { n: 1, name: endpoint, type: string }
      - { n: 2, name: sessions, type: Session, repeated: true }
      - { n: 3, name: windows, type: Window, repeated: true }
      - { n: 4, name: panes, type: Pane, repeated: true }
      - { n: 5, name: incarnation, type: u64, doc: "Identifies this run of the tmux server. Session, window, and pane ids are only meaningful within one incarnation: never reuse a saved id from another." }

  - message: SizeWindow
    doc: >-
      Ask for a tmux window's size in cells. Applied only for the window's
      sizing owner: the first client to ask, until it disconnects or
      releases the window. Send it when your own window changes size, never
      in reaction to a topology change.
    fields:
      - { n: 1, name: window, type: u32 }
      - { n: 2, name: cols, type: u32 }
      - { n: 3, name: rows, type: u32 }
      - { n: 4, name: client, type: u64, doc: "The client's id (as in TerminalSubscribe)." }
      - { n: 5, name: release, type: bool, doc: "Give up ownership instead (cols and rows are ignored)." }
      - { n: 6, name: endpoint, type: string, optional: true }

  - message: SizeResult
    fields:
      - { n: 1, name: owner, type: bool, doc: "The asking client owns the window's size." }
      - { n: 2, name: applied, type: bool, doc: "The size was sent to tmux." }
      - { n: 3, name: owner_client, type: u64, optional: true, doc: "The current owner, if any." }

  - message: TopologyUpdate
    doc: >-
      A topology with its revision. After tmux.watch, the connection gets
      one as a `tmux.topology` event whenever the topology changes
      (including changes another tmux client made), coalesced to the latest.
    fields:
      - { n: 1, name: revision, type: u64, doc: "Increases with every change; never repeats within a daemon run." }
      - { n: 2, name: topology, type: Topology }

  # ---- actions ------------------------------------------------------------

  - enum: SplitDirection
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: horizontal, doc: Side by side. }
      - { n: 2, name: vertical, doc: One above the other. }

  - message: SplitPane
    doc: Split a pane; the new pane runs the default shell unless argv is given.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: direction, type: SplitDirection }
      - { n: 3, name: percent, type: u32, optional: true }
      - { n: 4, name: cells, type: u32, optional: true }
      - { n: 5, name: argv, type: string, repeated: true, doc: Exact program and arguments; never a shell string. }
      - { n: 6, name: cwd, type: string, optional: true }

  - message: NewWindow
    doc: A window at the end of a session; it runs the default shell unless argv is given.
    fields:
      - { n: 1, name: session, type: u32 }
      - { n: 2, name: name, type: string, optional: true }
      - { n: 3, name: argv, type: string, repeated: true, doc: Exact program and arguments; never a shell string. }
      - { n: 4, name: cwd, type: string, optional: true }

  - message: NewSession
    doc: >-
      A new detached session with one window; it runs the default shell
      unless argv is given. tmux names it when `name` is absent. The
      record's `new_pane` is its first pane.
    fields:
      - { n: 1, name: name, type: string, optional: true }
      - { n: 2, name: argv, type: string, repeated: true, doc: Exact program and arguments; never a shell string. }
      - { n: 3, name: cwd, type: string, optional: true }

  - message: ResizePane
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: width, type: u32, optional: true }
      - { n: 3, name: height, type: u32, optional: true }

  - message: SelectPane
    fields:
      - { n: 1, name: pane, type: u32 }

  - message: SelectWindow
    fields:
      - { n: 1, name: window, type: u32 }

  - message: ZoomPane
    doc: Toggle zoom of a pane.
    fields:
      - { n: 1, name: pane, type: u32 }

  - message: RenameWindow
    fields:
      - { n: 1, name: window, type: u32 }
      - { n: 2, name: name, type: string }

  - message: RenameSession
    fields:
      - { n: 1, name: session, type: u32 }
      - { n: 2, name: name, type: string }

  - message: SendInput
    doc: >-
      Exact bytes to whatever runs in the pane now. With `generation`, the
      input is refused if the pane's process was replaced.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: data, type: bytes }
      - { n: 3, name: generation, type: u64, optional: true }
      - { n: 4, name: lease, type: string, optional: true, doc: "Automation's interaction lease on this pane." }

  - message: SendKeys
    doc: Named keys (tmux key names such as Enter or C-c) to the pane.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: keys, type: string, repeated: true }
      - { n: 3, name: generation, type: u64, optional: true }
      - { n: 4, name: lease, type: string, optional: true, doc: "Automation's interaction lease on this pane." }

  - message: KillPane
    fields:
      - { n: 1, name: pane, type: u32 }

  - message: KillWindow
    fields:
      - { n: 1, name: window, type: u32 }

  - message: MovePane
    doc: >-
      Move a pane, with its process, into another window: an existing one
      (`window`), or a new window of its own named `new_window` in the
      pane's session. Exactly one of the two. The pane keeps its id.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: window, type: u32, optional: true }
      - { n: 3, name: new_window, type: string, optional: true }

  - message: Action
    oneof:
      name: kind
      variants:
        - { n: 1, name: split_pane, type: SplitPane }
        - { n: 2, name: resize_pane, type: ResizePane }
        - { n: 3, name: select_pane, type: SelectPane }
        - { n: 4, name: select_window, type: SelectWindow }
        - { n: 5, name: zoom_pane, type: ZoomPane }
        - { n: 6, name: rename_window, type: RenameWindow }
        - { n: 7, name: rename_session, type: RenameSession }
        - { n: 8, name: send_input, type: SendInput }
        - { n: 9, name: send_keys, type: SendKeys }
        - { n: 10, name: kill_pane, type: KillPane }
        - { n: 11, name: kill_window, type: KillWindow }
        - { n: 12, name: new_window, type: NewWindow }
        - { n: 13, name: move_pane, type: MovePane }
        - { n: 14, name: new_session, type: NewSession }

  - message: SubmitAction
    fields:
      - { n: 1, name: action, type: Action }
      - { n: 2, name: endpoint, type: string, optional: true }
      - { n: 3, name: idempotency_key, type: string, optional: true, doc: "Resubmitting the same key returns the first action; different content is rejected." }
      - { n: 4, name: deadline_ms, type: u32, optional: true }

  - enum: ActionState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: accepted }
      - { n: 2, name: prepared }
      - { n: 3, name: dispatching }
      - { n: 4, name: completed }
      - { n: 5, name: failed }
      - { n: 6, name: cancelled }
      - { n: 7, name: outcome_unknown, doc: "The effect may or may not have happened; never retried automatically." }

  - message: ActionRecord
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: action, type: Action }
      - { n: 3, name: state, type: ActionState }
      - { n: 4, name: reason, type: string, optional: true, doc: Why it failed or why the outcome is unknown. }
      - { n: 5, name: observed, type: string, optional: true, doc: "What was observed in tmux afterwards, for example the new pane id." }
      - { n: 6, name: endpoint, type: string }
      - { n: 7, name: idempotency_key, type: string, optional: true }
      - { n: 8, name: created_unix_ms, type: u64 }
      - { n: 9, name: updated_unix_ms, type: u64 }
      - { n: 10, name: new_pane, type: u32, optional: true }

  - message: ActionQuery
    fields:
      - { n: 1, name: id, type: string }

  - message: ActionListParams
    fields:
      - { n: 1, name: limit, type: u32, optional: true, doc: Newest first; default 50. }

  - message: ActionList
    fields:
      - { n: 1, name: actions, type: ActionRecord, repeated: true }

  # ---- terminal mirrors ---------------------------------------------------

  - message: ReadParams
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: history, type: u32, optional: true, doc: "Scrollback lines to include before the screen; default 0, at most 10000." }
      - { n: 3, name: endpoint, type: string, optional: true }

  - message: TerminalText
    doc: A pane's text as the daemon's canonical mirror holds it.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: generation, type: u64 }
      - { n: 3, name: epoch, type: u64, doc: The control connection epoch the mirror belongs to. }
      - { n: 4, name: sequence, type: u64, doc: Records applied since the mirror attached. }
      - { n: 5, name: cols, type: u32 }
      - { n: 6, name: rows, type: u32 }
      - { n: 7, name: cursor_x, type: u32 }
      - { n: 8, name: cursor_y, type: u32 }
      - { n: 9, name: lines, type: string, repeated: true, doc: "Oldest first: history lines, then the screen." }
      - { n: 10, name: history_lines, type: u32 }

  - enum: MirrorState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: attaching, doc: Paused and being captured. }
      - { n: 2, name: live }
      - { n: 3, name: failed }
      - { n: 4, name: cold, doc: "The Cold tier: no mirror and no output from tmux for this client; asking for its content attaches it again." }
      - { n: 5, name: not_streaming, doc: "Reserved. Meant a mirror tmux sends no output for. API 1.64 reported it for panes outside the session the daemon's control client was attached to; the daemon now keeps a control client per tmux session, so every pane streams and nothing reports this state." }

  - message: MirrorStatus
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: generation, type: u64 }
      - { n: 3, name: epoch, type: u64 }
      - { n: 4, name: state, type: MirrorState }
      - { n: 5, name: sequence, type: u64 }
      - { n: 6, name: ingested_bytes, type: u64 }
      - { n: 7, name: worker, type: u32 }
      - { n: 8, name: cols, type: u32 }
      - { n: 9, name: rows, type: u32 }
      - { n: 10, name: detail, type: string, optional: true }
      - { n: 11, name: tier, type: Tier }
      - { n: 12, name: journal_bytes, type: u64 }
      - { n: 13, name: journal_first_sequence, type: u64, doc: "Oldest retained journal record; sequence + 1 when none is retained." }
      - { n: 14, name: journal_records, type: u32 }
      - { n: 15, name: title, type: string, optional: true, doc: "Latest title the program set (OSC 0/2)." }
      - { n: 16, name: cwd, type: string, optional: true, doc: "Latest working directory the program reported (OSC 7)." }
      - { n: 17, name: reattaches, type: u32, doc: "Times the mirror was rebuilt from a fresh capture because the pane's output outran it." }

  - message: MirrorList
    fields:
      - { n: 1, name: mirrors, type: MirrorStatus, repeated: true }
      - { n: 2, name: workers, type: u32 }
      - { n: 3, name: host_journal_bytes, type: u64 }
      - { n: 4, name: journal_pane_limit, type: u64 }
      - { n: 5, name: journal_host_limit, type: u64 }
      - { n: 6, name: journal_max_age_ms, type: u64 }

  - enum: Tier
    doc: "Observation tier. Hot: visible in a client. Warm: mirrored and journaled, not shown. Cold: metadata only."
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: hot }
      - { n: 2, name: warm }
      - { n: 3, name: cold }

  - message: SetTier
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: tier, type: Tier }
      - { n: 3, name: endpoint, type: string, optional: true }

  # ---- terminal subscriptions ---------------------------------------------
  # After `terminal.subscribe`, the daemon pushes on the same connection:
  #   bulk  topic `terminal.checkpoint`  CheckpointData (stream = subscription)
  #   event topic `terminal.records`     RecordBatch
  #   event topic `terminal.end`         SubscriptionEnd
  # A checkpoint (bulk) may arrive after records that follow it (events go
  # first); records with sequence <= the checkpoint's are already in it.

  - message: TerminalSubscribe
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: endpoint, type: string, optional: true }
      - { n: 3, name: resume_epoch, type: u64, optional: true, doc: "With generation and sequence: continue after this record instead of a new checkpoint, if it is still retained." }
      - { n: 4, name: resume_generation, type: u64, optional: true }
      - { n: 5, name: resume_sequence, type: u64, optional: true }
      - { n: 6, name: client, type: u64, optional: true, doc: "An id the client picks once per window; it names the client in TerminalInput too, so the daemon can address effects such as clipboard writes to exactly one." }

  - enum: SubscribeMode
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: checkpoint, doc: A checkpoint follows; records continue after its sequence. }
      - { n: 2, name: replay, doc: "No checkpoint; records continue right after the resume point." }

  - message: Subscription
    fields:
      - { n: 1, name: id, type: u64 }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: epoch, type: u64 }
      - { n: 4, name: generation, type: u64 }
      - { n: 5, name: mode, type: SubscribeMode }
      - { n: 6, name: sequence, type: u64, doc: "Checkpoint mode: the checkpoint's sequence. Replay mode: the resume point." }
      - { n: 7, name: checkpoint_bytes, type: u64 }
      - { n: 8, name: checkpoint_pause_us, type: u64, doc: How long the snapshot held the pane's owner. }
      - { n: 9, name: scrollback_lines, type: u32, doc: "The mirror's scrollback limit; a replica uses the same so both keep the same history." }
      - { n: 10, name: title, type: string, optional: true, doc: "The pane's current title: state, not an event." }
      - { n: 11, name: cwd, type: string, optional: true, doc: "The pane's current working directory: state, not an event." }

  - message: TerminalRecord
    doc: One journaled change. A resize when cols and rows are set, otherwise output bytes.
    fields:
      - { n: 1, name: sequence, type: u64 }
      - { n: 2, name: data, type: bytes }
      - { n: 3, name: cols, type: u32, optional: true }
      - { n: 4, name: rows, type: u32, optional: true }

  - message: RecordBatch
    fields:
      - { n: 1, name: subscription, type: u64 }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: epoch, type: u64 }
      - { n: 4, name: generation, type: u64 }
      - { n: 5, name: records, type: TerminalRecord, repeated: true }
      - { n: 6, name: effects, type: TerminalEffect, repeated: true, doc: "Live effects of these records; never present in replayed records." }

  - message: TerminalEffect
    doc: >-
      What applying one live record did besides changing the screen. Sent
      only to subscribers live when it happened: never replayed from the
      journal, a checkpoint, bootstrap, or a reconnect.
    fields:
      - { n: 1, name: id, type: u64, doc: "Increasing per pane mirror." }
      - { n: 2, name: sequence, type: u64, doc: "The record that produced it." }
      - { n: 3, name: bells, type: u32 }
      - { n: 4, name: title, type: string, optional: true, doc: "New title." }
      - { n: 5, name: cwd, type: string, optional: true, doc: "New working directory." }
      - { n: 6, name: clipboard, type: bytes, optional: true, doc: "Text the program wrote to the clipboard (OSC 52). Sent only to the subscription of the pane's focused client." }

  - message: CheckpointData
    fields:
      - { n: 1, name: subscription, type: u64 }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: epoch, type: u64 }
      - { n: 4, name: generation, type: u64 }
      - { n: 5, name: sequence, type: u64 }
      - { n: 6, name: snapshot, type: bytes, doc: "Engine snapshot; peers share the build family checked at handshake." }

  - enum: EndReason
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: lagged, doc: "The subscriber fell behind; resubscribe (resume if still retained)." }
      - { n: 2, name: pane_closed }
      - { n: 3, name: respawned, doc: The pane's process was replaced; subscribe to the new generation. }
      - { n: 4, name: connection_lost, doc: "The daemon lost its tmux connection; a new epoch follows." }
      - { n: 5, name: unsubscribed }
      - { n: 6, name: reattached, doc: "The pane's output outran its mirror, so the daemon rebuilt the mirror from a fresh capture. Subscribe again; a checkpoint follows." }
      - { n: 7, name: host_lost, doc: "A relayed subscription's host connection ended and will not come back by itself (disconnected, or a failure that is not retried). Subscribe again once the host is live." }
      - { n: 8, name: host_restarted, doc: "A relayed subscription's host daemon restarted, so its journal is gone. Subscribe again; a checkpoint follows." }

  - message: SubscriptionEnd
    fields:
      - { n: 1, name: subscription, type: u64 }
      - { n: 2, name: reason, type: EndReason }
      - { n: 3, name: detail, type: string, optional: true }

  - message: Unsubscribe
    fields:
      - { n: 1, name: subscription, type: u64 }

  # ---- input --------------------------------------------------------------

  - message: KeyInput
    doc: "A key press, encoded by the daemon with the pane's current keyboard modes."
    fields:
      - { n: 1, name: key, type: string, doc: "W3C KeyboardEvent.code name: KeyA, Digit1, ArrowUp, Enter, F5, ..." }
      - { n: 2, name: text, type: string, optional: true, doc: The text the key produced on the client keyboard layout. }
      - { n: 3, name: mods, type: u32, doc: "Bits: 1 shift, 2 ctrl, 4 alt, 8 super." }
      - { n: 4, name: held, type: bool, doc: "An auto-repeat of a key held down." }

  - message: TextInput
    doc: "Committed text (typing or IME commit); never IME preedit."
    fields:
      - { n: 1, name: text, type: string }

  - message: PasteInput
    doc: >-
      Bracketed exactly once when the application enabled bracketed paste.
      A paste larger than one request is sent in parts with the same id and
      `more` set on all but the last; the daemon encodes the whole paste
      once (at most 64 MiB).
    fields:
      - { n: 1, name: data, type: bytes }
      - { n: 2, name: more, type: bool }
      - { n: 3, name: id, type: u64 }

  - message: FocusInput
    doc: Sent to the application only if it asked for focus reports.
    fields:
      - { n: 1, name: gained, type: bool }

  - enum: MouseAction
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: press }
      - { n: 2, name: release }
      - { n: 3, name: motion }

  - enum: MouseButton
    values:
      - { n: 0, name: none, doc: Motion with no button held. }
      - { n: 1, name: left }
      - { n: 2, name: middle }
      - { n: 3, name: right }
      - { n: 4, name: wheel_up }
      - { n: 5, name: wheel_down }

  - message: MouseInput
    doc: >-
      A mouse event at a cell of the pane's canonical grid, encoded with the
      application's mouse tracking mode and format. Nothing is sent when the
      application does not track this kind of event. Wheel steps are presses
      of wheel_up or wheel_down, one per step.
    fields:
      - { n: 1, name: action, type: MouseAction }
      - { n: 2, name: button, type: MouseButton }
      - { n: 3, name: col, type: u32, doc: "0-based; clamped to the grid." }
      - { n: 4, name: row, type: u32, doc: "0-based; clamped to the grid." }
      - { n: 5, name: mods, type: u32, doc: "Bits as in KeyInput." }
      - { n: 6, name: buttons_held, type: bool, doc: "A button is down (for drag reporting)." }

  - message: TerminalInput
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: generation, type: u64, optional: true, doc: "Refuse the input if the pane's process was replaced." }
      - { n: 3, name: endpoint, type: string, optional: true }
      - { n: 4, name: client, type: u64, optional: true, doc: "The sending client's id (as in TerminalSubscribe); focus events make it the pane's focused client." }
      - { n: 5, name: lease, type: string, optional: true, doc: "Automation's interaction lease on this pane (leases.acquire). Without one, typed input is a person's: it revokes any lease on the pane." }
    oneof:
      name: event
      variants:
        - { n: 10, name: key, type: KeyInput }
        - { n: 11, name: text, type: TextInput }
        - { n: 12, name: paste, type: PasteInput }
        - { n: 13, name: focus, type: FocusInput }
        - { n: 14, name: mouse, type: MouseInput }

  - message: InputResult
    fields:
      - { n: 1, name: bytes, type: u64, doc: Encoded bytes delivered to the pane. }
      - { n: 2, name: batches, type: u32, doc: tmux command batches used. }

  # ---- interaction leases ---------------------------------------------------

  - message: LeaseAcquire
    doc: >-
      Ask to type into a pane as automation. One connection holds a pane's
      lease at a time; it expires unless used, and a person typing into the
      pane revokes it.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: ttl_ms, type: u32, optional: true, doc: "Idle time before the lease expires: default 30000, at most 600000. Each use starts it again." }

  - message: Lease
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: generation, type: u64, doc: "Increases with every lease on the pane; a revoked generation never comes back." }
      - { n: 4, name: expires_unix_ms, type: u64 }

  - message: LeaseRef
    fields:
      - { n: 1, name: id, type: string }

  # ---- remote hosts ---------------------------------------------------------

  - message: HostConnect
    doc: >-
      Connect the local daemon (the coordinator) to the daemon on another
      host through system ssh, running `dream bridge --stdio` there. SSH
      configuration, keys, and host verification stay the user's.
    fields:
      - { n: 1, name: name, type: string, doc: "A local label for this host; unique among hosts." }
      - { n: 2, name: destination, type: string, doc: "SSH destination: host alias, user@host, or ssh:// URI." }
      - { n: 3, name: dream, type: string, optional: true, doc: "Remote dream executable; default `dream` on the remote PATH. A leading ~/ is the remote home." }
      - { n: 4, name: tmux, type: string, optional: true, doc: "Remote tmux executable, for a remote daemon that has to be started." }
      - { n: 5, name: tmux_socket, type: string, optional: true, doc: "Remote tmux -L name." }
      - { n: 6, name: tmux_socket_path, type: string, optional: true, doc: "Remote tmux -S path." }
      - { n: 7, name: auto_reconnect, type: bool, optional: true, doc: "Retry a dropped connection by itself; default: the profile's policy, or off for a host given here." }

  - enum: HostFailure
    doc: Why the last attempt failed, and so whether retrying can help.
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: transient, doc: "Network, SSH ending, the remote daemon going away: retried under an auto policy." }
      - { n: 2, name: auth, doc: "SSH authentication was refused: never retried automatically." }
      - { n: 3, name: host_key, doc: "The host key is unknown or changed: never retried automatically." }
      - { n: 4, name: incompatible, doc: "The remote daemon's protocol or build does not match: needs an upgrade." }
      - { n: 5, name: not_installed, doc: "The remote dream executable was not found." }

  - message: HostStatus
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: destination, type: string }
      - { n: 3, name: state, type: LinkState }
      - { n: 4, name: remote, type: VersionInfo, doc: "The remote daemon's protocol and build, once live." }
      - { n: 5, name: remote_host, type: string, optional: true }
      - { n: 6, name: remote_pid, type: u32, optional: true }
      - { n: 7, name: remote_instance, type: string, optional: true, doc: "Changes when the remote daemon restarts." }
      - { n: 8, name: last_contact_unix_ms, type: u64, optional: true, doc: "Last successful exchange with the remote daemon." }
      - { n: 9, name: detail, type: string, optional: true, doc: "Why the host is not live: the reason and SSH's last diagnostic lines." }
      - { n: 10, name: failure, type: HostFailure }
      - { n: 11, name: attempts, type: u32, doc: "Failed attempts since the last live connection." }
      - { n: 12, name: next_retry_unix_ms, type: u64, optional: true, doc: "When the next automatic attempt starts, if one is scheduled." }
      - { n: 13, name: auto_reconnect, type: bool }
      - { n: 14, name: tags, type: string, repeated: true }
      - { n: 15, name: workspace, type: string, optional: true }
      - { n: 16, name: profile, type: bool, doc: "Defined in hosts.yaml." }

  - message: HostList
    doc: Every profile in hosts.yaml and every other host connected since the daemon started.
    fields:
      - { n: 1, name: hosts, type: HostStatus, repeated: true }
      - { n: 2, name: profiles_error, type: string, optional: true, doc: "hosts.yaml exists but is invalid: the error, with its location." }

  - message: HostRef
    fields:
      - { n: 1, name: name, type: string }

  - message: HostCall
    doc: >-
      One typed call forwarded to a connected host's daemon: `payload` is
      the method's parameters as Protobuf, exactly as in a local call.
      Methods that stream (subscriptions and watches) are refused.
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: method, type: string }
      - { n: 3, name: payload, type: bytes }

  - message: HostSubscribe
    doc: >-
      Follow a pane on a connected host through this daemon: the reply and
      the `terminal.*` events are those of terminal.subscribe, with this
      connection's own subscription id. When SSH drops and the host comes
      back, the subscription resumes from the host's journal by itself;
      it ends with host_lost or host_restarted when it cannot.
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: subscribe, type: TerminalSubscribe }

  - message: InstallPlanParams
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: artifacts, type: string, optional: true, doc: "Directory of server archives on this machine, used with no download; default DREAMER_SERVER_ARTIFACTS. With neither, the archive is taken from share/dreamer/server beside this daemon or the downloads kept in the data directory, else downloaded from this version's release (or DREAMER_SERVER_URL)." }

  - message: InstallPlan
    doc: >-
      What hosts.install would do, for review: found by probing the host
      through SSH. Installing requires this plan's id, so nothing different
      from what was reviewed can be installed.
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: destination, type: string }
      - { n: 3, name: remote_os, type: string }
      - { n: 4, name: remote_arch, type: string }
      - { n: 5, name: target, type: string, doc: "The matching Rust target, such as x86_64-unknown-linux-gnu." }
      - { n: 6, name: home, type: string }
      - { n: 7, name: installed, type: string, optional: true, doc: "The installed server's VERSION first line, if any." }
      - { n: 8, name: version, type: string, doc: "The version that would be installed (this daemon's own)." }
      - { n: 9, name: archive, type: string, doc: "The archive on this machine, or the address hosts.install downloads it from." }
      - { n: 10, name: sha256, type: string }
      - { n: 11, name: size, type: u64 }
      - { n: 12, name: remote_dir, type: string }
      - { n: 13, name: steps, type: string, repeated: true, doc: "Each change, in order, in plain words." }
      - { n: 14, name: plan_id, type: string }

  - message: InstallParams
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: artifacts, type: string, optional: true }
      - { n: 3, name: plan_id, type: string, doc: "The id of the reviewed plan; a different plan now is refused." }

  - message: InstallResult
    fields:
      - { n: 1, name: version, type: string }
      - { n: 2, name: remote_dream, type: string, doc: "The installed dream, as run on the host." }
      - { n: 3, name: previous, type: string, optional: true }
      - { n: 4, name: check, type: string, doc: "What the installed dream --version printed on the host." }

  - message: UpgradeParams
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: artifacts, type: string, optional: true }
      - { n: 3, name: plan_id, type: string, doc: "The id of the reviewed install plan." }
      - { n: 4, name: allow_older, type: bool, doc: "Install even when the host has a newer version." }

  - message: UpgradeResult
    doc: >-
      An upgrade is a restart of the host's daemon, not a handover: its
      tmux sessions and panes keep running, but views of them start again
      from fresh checkpoints.
    fields:
      - { n: 1, name: from, type: string, optional: true, doc: "The version installed before, if any." }
      - { n: 2, name: to, type: string }
      - { n: 3, name: restarted, type: bool, doc: "The host's daemon was restarted on the new version." }
      - { n: 4, name: pid_before, type: u32, optional: true }
      - { n: 5, name: pid_after, type: u32, optional: true }
      - { n: 6, name: note, type: string }

  - message: HostForward
    doc: >-
      A TCP port on a connected host's own loopback, to reach from this
      machine through the host's SSH connection (hosts.forward). Nothing
      on the host listens for it, and nothing is exposed on the network.
    fields:
      - { n: 1, name: name, type: string, doc: "The host." }
      - { n: 2, name: port, type: u32, doc: "The port on the host's loopback (127.0.0.1, else ::1)." }

  - message: HostForwarded
    doc: >-
      A forward held by the calling connection until hosts.unforward or
      until the connection closes. Holds of one host port share one
      listener, closed when the last hold goes.
    fields:
      - { n: 1, name: forward, type: u64, doc: "This hold, for hosts.unforward." }
      - { n: 2, name: local_port, type: u32, doc: "The port on this machine's 127.0.0.1 that reaches the host's port." }

  - message: HostForwardRef
    fields:
      - { n: 1, name: forward, type: u64 }

  - message: ForwardOpen
    doc: >-
      A new stream to a port on this daemon's own loopback, for the
      coordinator's connection (forward.open). Its data arrives as
      `forward.data` bulk records, only as far as the caller's credit
      (forward.ack) allows.
    fields:
      - { n: 1, name: port, type: u32 }

  - message: ForwardStream
    fields:
      - { n: 1, name: stream, type: u64, doc: "Unique within the daemon; belongs to the connection that opened it." }

  - message: ForwardData
    doc: Bytes of a forward stream, in order, in either direction.
    fields:
      - { n: 1, name: stream, type: u64 }
      - { n: 2, name: data, type: bytes }
      - { n: 3, name: eof, type: bool, doc: "Nothing more follows in this direction (after data, if any)." }
      - { n: 4, name: error, type: string, optional: true, doc: "Why the stream ended, when it failed." }

  - message: ForwardAck
    doc: Credit for a stream's incoming data, in bytes, given as the receiver passes data on.
    fields:
      - { n: 1, name: stream, type: u64 }
      - { n: 2, name: bytes, type: u32 }

  - message: HostReply
    doc: The remote daemon's result for a HostCall, as Protobuf.
    fields:
      - { n: 1, name: payload, type: bytes }

  # ---- grants -------------------------------------------------------------

  - message: Grant
    doc: >-
      What a connection may do. The user's own clients hold the owner grant
      (everything). A narrow grant lists its methods (exact names, or
      `service.*`), the panes it may read, follow, or type into, and an
      optional expiry. Checked by the daemon before every request; data can
      never widen it.
    fields:
      - { n: 1, name: owner, type: bool, doc: "Everything is allowed (the user's own clients)." }
      - { n: 2, name: methods, type: string, repeated: true }
      - { n: 3, name: panes, type: u32, repeated: true, doc: "Panes in scope; requests naming another pane are refused." }
      - { n: 4, name: all_panes, type: bool, doc: "Every pane is in scope." }
      - { n: 5, name: expires_unix_ms, type: u64, optional: true }
      - { n: 6, name: level, type: ActLevel, doc: "How far the grant acts on panes; unspecified leaves it to the methods and panes alone." }

  - message: LaunchApp
    doc: >-
      Start a program in a new tmux window as a registered app. The daemon
      writes a single-use ticket to an owner-only file and gives the program
      only that file's path (DREAMER_LAUNCH_TICKET) and the launch id
      (DREAMER_LAUNCH_ID). The program registers with them for `grant`.
    fields:
      - { n: 1, name: app_id, type: string }
      - { n: 2, name: grant, type: Grant, doc: "What the app may do; with no panes and not all_panes, its own pane." }
      - { n: 3, name: argv, type: string, repeated: true, doc: Exact program and arguments; never a shell string. }
      - { n: 4, name: session, type: u32 }
      - { n: 5, name: name, type: string, optional: true, doc: "The window name; default the app id." }
      - { n: 6, name: cwd, type: string, optional: true }
      - { n: 7, name: ttl_ms, type: u32, optional: true, doc: "How long the ticket is valid; default 60000." }
      - { n: 8, name: split, type: u32, optional: true, doc: "Open the app in a pane split from this one, side by side, instead of a new window of `session`." }

  - message: LaunchedApp
    fields:
      - { n: 1, name: launch_id, type: string }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: expires_unix_ms, type: u64 }

  - message: RegisterApp
    fields:
      - { n: 1, name: launch_id, type: string }
      - { n: 2, name: ticket, type: string, doc: "The contents of the ticket file." }

  - message: Registration
    fields:
      - { n: 1, name: instance, type: string }
      - { n: 2, name: app_id, type: string }
      - { n: 3, name: pane, type: u32 }
      - { n: 4, name: grant, type: Grant }

  - message: AppViewPublish
    fields:
      - { n: 1, name: view, type: string, doc: "The app's model as JSON, as the app host draws it." }

  - message: AppViewQuery
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: after, type: u64, doc: "Wait for a revision newer than this one; 0 answers at once." }
      - { n: 3, name: wait_ms, type: u32, optional: true, doc: "How long to wait for a newer revision; default 20000, at most 60000. The current one is returned when it runs out." }

  - message: AppView
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: instance, type: string }
      - { n: 3, name: app_id, type: string }
      - { n: 4, name: revision, type: u64, doc: "Grows with every new view and every change of `live`." }
      - { n: 5, name: live, type: bool, doc: "The host is connected; when false, `view` is its last one." }
      - { n: 6, name: view, type: string, doc: "The latest model the host published, as JSON; empty before its first." }

  - message: AppTreePublish
    doc: "A version of an app host's view tree (docs/termapp.md, view trees): the whole tree, or the keyed changes from the version before."
    fields:
      - { n: 1, name: seq, type: u64, doc: "This version; a patch's is one more than the version it changes." }
      - { n: 2, name: tree, type: string, doc: "The whole tree as JSON (a frame: title, status, focus, root); empty with a patch." }
      - { n: 3, name: patch, type: string, doc: "The changes from version seq - 1 as a JSON list of keyed ops; empty with a tree." }

  - message: AppTreeQuery
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: after, type: u64, doc: "Wait for a revision newer than this one; 0 answers at once." }
      - { n: 3, name: seq, type: u64, doc: "The tree version the caller holds; 0 for none. The answer brings it to the newest." }
      - { n: 4, name: wait_ms, type: u32, optional: true, doc: "How long to wait for a newer revision; default 20000, at most 60000." }

  - message: AppTree
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: instance, type: string }
      - { n: 3, name: app_id, type: string }
      - { n: 4, name: revision, type: u64, doc: "Grows with every new tree version and every change of `live`." }
      - { n: 5, name: live, type: bool, doc: "The host is connected; when false, the tree is its last one." }
      - { n: 6, name: seq, type: u64, doc: "The tree version the caller holds after applying this answer; 0 before the host's first tree." }
      - { n: 7, name: tree, type: string, doc: "The whole tree as JSON, when the caller's version is unknown or too old for patches; else empty." }
      - { n: 8, name: patches, type: string, repeated: true, doc: "The changes from the caller's version, one JSON list of ops per version, in order." }

  - message: AppCapture
    doc: "Ask the user's desktop for an image of an app pane as the desktop draws it natively (dream app preview --png)."
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: path, type: string, doc: "Absolute path of the PNG file the desktop writes; replaced when it exists." }
      - { n: 3, name: seq, type: u64, doc: "Wait until the desktop has drawn at least this version of the pane's view tree; 0 takes what it shows." }
      - { n: 4, name: wait_ms, type: u32, optional: true, doc: "How long to wait for the desktop's answer; default 10000, at most 60000." }

  - message: AppCaptured
    fields:
      - { n: 1, name: path, type: string }
      - { n: 2, name: width, type: u32, doc: "The image's width in pixels." }
      - { n: 3, name: height, type: u32, doc: "The image's height in pixels." }

  - message: AppCaptureWait
    fields:
      - { n: 1, name: wait_ms, type: u32, optional: true, doc: "How long to wait for a request; default 20000, at most 60000. Answered with id 0 when none came." }

  - message: AppCaptureRequest
    doc: "A capture for a desktop to make, answered with apps.capture_done."
    fields:
      - { n: 1, name: id, type: u64, doc: "0 when no request came within the wait." }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: path, type: string }
      - { n: 4, name: seq, type: u64 }
      - { n: 5, name: method, type: string, doc: "A web.* method (web.read, web.screenshot, web.click, web.type) to run on the pane's page instead of taking an image; empty for apps.capture." }
      - { n: 6, name: params, type: string, doc: "That method's parameters, as the API's JSON." }

  - message: AppCaptureDone
    fields:
      - { n: 1, name: id, type: u64 }
      - { n: 2, name: error, type: string, optional: true, doc: "Why this desktop wrote no image (for example, it does not show the pane); absent when it wrote one." }
      - { n: 3, name: width, type: u32 }
      - { n: 4, name: height, type: u32 }
      - { n: 5, name: result, type: string, doc: "For a request with a method, its result as the API's JSON." }

  - message: AppCall
    doc: >-
      A call a web page of the app in pane makes through its bridge
      (window.dreamer.call), passed on by the desktop drawing the page. The
      daemon runs it as that app: under the app's grant, as the app's own
      connection would.
    fields:
      - { n: 1, name: pane, type: u32, doc: "The app pane whose page calls." }
      - { n: 2, name: method, type: string }
      - { n: 3, name: params, type: string, doc: "The method's parameters as JSON, as the API takes them; empty for none." }

  - message: AppCallResult
    fields:
      - { n: 1, name: result, type: string, doc: "The method's result as JSON." }

  - message: AppInput
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: key, type: string, doc: "A key by the app model's names: a character, Enter, Esc, Tab, Up, Ctrl-c, F2, ... Empty when the input is one of the fields below; exactly one is given." }
      - { n: 3, name: text, type: string, optional: true, doc: "Text for the view's focused input (a text or number field, a prompt) as one edit: text committed by the platform's text input (IME) or pasted. Line breaks become spaces (a composer keeps them) and other control characters are dropped. A view with no focused input ignores it, so pasted text never runs a command." }
      - { n: 4, name: select, type: u32, optional: true, doc: "A click: select this row of a table or list, or focus this form field, by index." }
      - { n: 5, name: scroll, type: i32, optional: true, doc: "Wheel steps: positive moves a table's or list's selection down, negative up." }
      - { n: 6, name: node, type: string, optional: true, doc: "In a view tree (manifest version 2), the node a click or wheel steps are for, by key; the host focuses it first. Without it they go to the focused node. Only with select or scroll." }

  # ---- events -------------------------------------------------------------

  - message: TmuxBufferRead
    fields:
      - { n: 1, name: endpoint, type: string, optional: true, doc: Endpoint name; the default endpoint when absent. }
      - { n: 2, name: name, type: string, optional: true, doc: "The buffer to read (from a clipboard.tmux_buffer event); the newest when absent." }

  - message: TmuxBuffer
    fields:
      - { n: 1, name: found, type: bool, doc: "False when there is no such buffer." }
      - { n: 2, name: text, type: string, doc: "The buffer's text, at most 4 MiB." }

  - message: TmuxBufferWrite
    fields:
      - { n: 1, name: endpoint, type: string, optional: true, doc: Endpoint name; the default endpoint when absent. }
      - { n: 2, name: text, type: string, doc: "Becomes tmux's newest paste buffer (1 byte to 4 MiB)." }

  - message: TmuxBufferListParams
    fields:
      - { n: 1, name: endpoint, type: string, optional: true, doc: Endpoint name; the default endpoint when absent. }

  - message: TmuxBufferInfo
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: size, type: u64, doc: Bytes. }
      - { n: 3, name: sample, type: string, doc: "The start of the text, as tmux shows it (control characters escaped)." }

  - message: TmuxBufferList
    fields:
      - { n: 1, name: buffers, type: TmuxBufferInfo, repeated: true, doc: Newest first. }

  - message: KeyOptionsParams
    fields:
      - { n: 1, name: endpoint, type: string, optional: true, doc: Endpoint name; the default endpoint when absent. }

  - message: KeyOptions
    doc: "tmux's global key and copy-mode options, as tmux reports them. Read only: Dreamer never changes them."
    fields:
      - { n: 1, name: prefix, type: string, doc: "A tmux key name such as C-b, or None." }
      - { n: 2, name: prefix2, type: string, doc: "A tmux key name, or None." }
      - { n: 3, name: mode_keys, type: string, doc: "vi or emacs." }
      - { n: 4, name: mode_style, type: string, doc: "As tmux reports it, for example bg=yellow,fg=black." }

  - message: PrefixKey
    fields:
      - { n: 1, name: endpoint, type: string, optional: true, doc: Endpoint name; the default endpoint when absent. }
      - { n: 2, name: pane, type: u32, doc: The pane the key is typed on. }
      - { n: 3, name: key, type: string, doc: "One tmux key name (c, C-o, M-Up, PPage), typed after the prefix." }

  - message: PrefixKeyResult
    fields:
      - { n: 1, name: mode_cancelled, type: string, optional: true, doc: "A mode the binding opened on the pane (copy-mode, tree-mode, ...), which was cancelled: tmux draws modes only for ordinary clients." }

  - message: DaemonEvent
    doc: "One entry of the daemon's event log: metadata only, never terminal content."
    fields:
      - { n: 1, name: sequence, type: u64, doc: "Increases by one per event within a daemon instance, from 1." }
      - { n: 2, name: kind, type: string, doc: "tmux.topology, actions.outcome, hosts.state, or apps.registered (see docs/events.md)." }
      - { n: 3, name: time_unix_ms, type: u64 }
      - { n: 4, name: pane, type: u32, optional: true, doc: "The pane the event is about, if any." }
      - { n: 5, name: host, type: string, optional: true, doc: "The remote host the event is about, if any." }
      - { n: 6, name: subject, type: string, optional: true, doc: "An action id or launch id." }
      - { n: 7, name: state, type: string, optional: true, doc: "An action outcome or a host's link state." }
      - { n: 8, name: revision, type: u64, optional: true, doc: "The topology revision." }

  - message: EventSubscribe
    fields:
      - { n: 1, name: kinds, type: string, repeated: true, doc: "Kinds or kind prefixes (`actions` matches `actions.outcome`); empty means every kind." }
      - { n: 2, name: panes, type: u32, repeated: true, doc: "Only events about these panes; empty means every event." }
      - { n: 3, name: after, type: u64, optional: true, doc: "Resume after this sequence; without it, only new events follow." }
      - { n: 4, name: instance, type: string, optional: true, doc: "The daemon instance the cursor came from (EventSubscription.instance)." }
      - { n: 5, name: quota, type: u32, optional: true, doc: "How many events this subscriber may fall behind before it skips ahead with a gap; default 1024." }

  - message: EventSubscription
    fields:
      - { n: 1, name: id, type: u64, doc: "Ends with events.unsubscribe." }
      - { n: 2, name: instance, type: string, doc: "This daemon instance; cursors are valid only within it." }
      - { n: 3, name: cursor, type: u64, doc: "Events after this sequence follow." }
      - { n: 4, name: oldest, type: u64, doc: "The oldest sequence the log still keeps." }

  - enum: EventGapReason
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: lagging, doc: "The subscriber fell further behind than its quota or the log." }
      - { n: 2, name: expired, doc: "The resume cursor is older than the log." }
      - { n: 3, name: restarted, doc: "The resume cursor is from another daemon instance; first and last are 0." }

  - message: EventGap
    doc: "Events in first..=last were not delivered; re-read state that depends on them."
    fields:
      - { n: 1, name: first, type: u64 }
      - { n: 2, name: last, type: u64 }
      - { n: 3, name: reason, type: EventGapReason }

  - message: EventBatch
    doc: "Pushed as `events.batch`: a gap, if any, comes before the events."
    fields:
      - { n: 1, name: subscription, type: u64 }
      - { n: 2, name: gap, type: EventGap }
      - { n: 3, name: events, type: DaemonEvent, repeated: true }
      - { n: 4, name: cursor, type: u64, doc: "Resume after this sequence to continue where this batch ends." }

  # ---- messages -----------------------------------------------------------

  - message: MessageSender
    doc: "Who sent a message, stamped by the daemon from the connection; never taken from the sender."
    fields:
      - { n: 1, name: instance, type: string, doc: "A registered app's instance, or owner:<n> for one of the user's own clients." }
      - { n: 2, name: app_id, type: string, optional: true }
      - { n: 3, name: pane, type: u32, optional: true, doc: "The registered app's pane." }
      - { n: 4, name: owner, type: bool, doc: "Sent under the owner grant." }

  - message: MessageEnvelope
    fields:
      - { n: 1, name: id, type: u64, doc: "Assigned by the daemon; increases per message." }
      - { n: 2, name: sender, type: MessageSender }
      - { n: 3, name: topic, type: string, optional: true }
      - { n: 4, name: recipient, type: string, optional: true, doc: "The instance a direct message, request, or reply is for." }
      - { n: 5, name: schema, type: u32, doc: "The payload's schema version, chosen by the sender." }
      - { n: 6, name: correlation, type: string, optional: true }
      - { n: 7, name: expires_unix_ms, type: u64, optional: true }
      - { n: 8, name: payload, type: bytes }
      - { n: 9, name: cause, type: u64, optional: true, doc: "The message this one answers or was caused by." }
      - { n: 10, name: origin, type: u64, doc: "The first message of this causal chain (its own id when it starts one)." }
      - { n: 11, name: depth, type: u32, doc: "Causal steps from the origin." }
      - { n: 12, name: claimed_sender, type: string, optional: true, doc: "What the sender said about itself: a claim, never authority." }
      - { n: 13, name: time_unix_ms, type: u64 }
      - { n: 14, name: request, type: bool, doc: "A request: answer it with messages.reply." }

  - message: MessagePublish
    doc: "A topic message or a direct message: give exactly one of topic and recipient."
    fields:
      - { n: 1, name: topic, type: string, optional: true, doc: "Not dreamer.*, human.*, policy.*, or approval.*: those are the daemon's." }
      - { n: 2, name: recipient, type: string, optional: true }
      - { n: 3, name: schema, type: u32 }
      - { n: 4, name: correlation, type: string, optional: true }
      - { n: 5, name: expires_unix_ms, type: u64, optional: true }
      - { n: 6, name: payload, type: bytes, doc: "At most 64 KiB." }
      - { n: 7, name: cause, type: u64, optional: true }
      - { n: 8, name: sender, type: string, optional: true, doc: "A claimed sender; recipients see it as claimed_sender, next to the stamped one." }

  - message: MessageSent
    fields:
      - { n: 1, name: id, type: u64 }
      - { n: 2, name: delivered, type: u32, doc: "Subscriptions it was handed to." }
      - { n: 3, name: depth, type: u32 }

  - message: MessageRequest
    fields:
      - { n: 1, name: recipient, type: string }
      - { n: 2, name: schema, type: u32 }
      - { n: 3, name: correlation, type: string, optional: true }
      - { n: 4, name: payload, type: bytes }
      - { n: 5, name: cause, type: u64, optional: true }
      - { n: 6, name: timeout_ms, type: u32, optional: true, doc: "Default 10000, at most 60000." }
      - { n: 7, name: sender, type: string, optional: true, doc: "A claimed sender (see MessagePublish.sender)." }

  - message: MessageReply
    fields:
      - { n: 1, name: request, type: u64, doc: "The request's id." }
      - { n: 2, name: schema, type: u32 }
      - { n: 3, name: payload, type: bytes }

  - message: MessageSubscribe
    fields:
      - { n: 1, name: topics, type: string, repeated: true, doc: "Exact topics, service.* prefixes, or *. Direct messages and requests to this connection arrive regardless." }

  - message: MessageSubscription
    fields:
      - { n: 1, name: id, type: u64, doc: "Ends with messages.unsubscribe." }
      - { n: 2, name: instance, type: string, doc: "This connection's identity as a recipient." }

  - message: MessageDelivery
    doc: "Pushed as `messages.deliver`."
    fields:
      - { n: 1, name: subscription, type: u64 }
      - { n: 2, name: envelope, type: MessageEnvelope }
      - { n: 3, name: missed, type: u64, doc: "Messages dropped for this subscription since the previous delivery, because it was full." }

  # ---- extensions ---------------------------------------------------------

  - enum: ExtensionState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: starting, doc: "Started; waiting for its answer to extension.hello." }
      - { n: 2, name: running }
      - { n: 3, name: restarting, doc: "Crashed or stalled; starting again after a delay." }
      - { n: 4, name: failed, doc: "Kept failing; parked until extensions.restart." }
      - { n: 5, name: disabled, doc: "enabled: false in extensions.yaml." }
      - { n: 6, name: stopped, doc: "The daemon is stopping." }

  - message: ExtensionStatus
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: state, type: ExtensionState }
      - { n: 3, name: pid, type: u32, optional: true }
      - { n: 4, name: restarts, type: u32, doc: "Times it was started again since the daemon started." }
      - { n: 5, name: failures, type: u32, doc: "Consecutive failures; reset after a minute of running." }
      - { n: 6, name: last_error, type: string, optional: true }
      - { n: 7, name: started_unix_ms, type: u64, optional: true }
      - { n: 8, name: next_start_unix_ms, type: u64, optional: true }
      - { n: 9, name: version, type: string, optional: true, doc: "What it said in its extension.hello answer." }
      - { n: 10, name: log, type: string, doc: "Its standard error, appended." }
      - { n: 11, name: grant, type: Grant }

  - message: ExtensionList
    fields:
      - { n: 1, name: extensions, type: ExtensionStatus, repeated: true }
      - { n: 2, name: config_error, type: string, optional: true, doc: "Why extensions.yaml could not be read; nothing was started from it." }

  - message: ExtensionRef
    fields:
      - { n: 1, name: name, type: string }

  # ---- scripts ------------------------------------------------------------

  - enum: ScriptState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: running }
      - { n: 2, name: restarting, doc: "Over a budget; starting again from its last-good source after a delay." }
      - { n: 3, name: failed, doc: "Kept failing; parked until scripts.reload." }
      - { n: 4, name: stopped }

  - message: ScriptGrant
    fields:
      - { n: 1, name: methods, type: string, repeated: true, doc: "Exact names or service.*." }
      - { n: 2, name: panes, type: u32, repeated: true }
      - { n: 3, name: all_panes, type: bool }

  - message: ScriptLimits
    doc: "Absent fields take the defaults (16 MiB, 50 ms, 5 s)."
    fields:
      - { n: 1, name: memory_bytes, type: u64, optional: true }
      - { n: 2, name: call_ms, type: u32, optional: true, doc: "Running time per call into the script." }
      - { n: 3, name: host_call_ms, type: u32, optional: true, doc: "Deadline of each dreamer.* call." }

  - message: ScriptLoad
    fields:
      - { n: 1, name: name, type: string, doc: "Unique among loaded scripts; its sender identity is script:<name>." }
      - { n: 2, name: source, type: string, doc: "Luau source; it runs once on load, then its handlers are called." }
      - { n: 3, name: grant, type: ScriptGrant }
      - { n: 4, name: events, type: string, repeated: true, doc: "Event kinds (prefixes) passed to the script's on_event; needs events.subscribe in the grant." }
      - { n: 5, name: limits, type: ScriptLimits }

  - message: ScriptSource
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: source, type: string }

  - message: ScriptCheck
    fields:
      - { n: 1, name: ok, type: bool }
      - { n: 2, name: error, type: string, optional: true }

  - message: ScriptRef
    fields:
      - { n: 1, name: name, type: string }

  - message: ScriptStatus
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: state, type: ScriptState }
      - { n: 3, name: revision, type: u32, doc: "The source revision running: 1 on load, +1 per successful reload." }
      - { n: 4, name: restarts, type: u32 }
      - { n: 5, name: failures, type: u32, doc: "Budget overruns in a row." }
      - { n: 6, name: last_error, type: string, optional: true }
      - { n: 7, name: handled, type: u64, doc: "Events passed to on_event." }
      - { n: 8, name: errors, type: u64, doc: "Handler errors (not budget overruns); the instance keeps running." }
      - { n: 9, name: grant, type: Grant }
      - { n: 10, name: events, type: string, repeated: true }

  - message: ScriptList
    fields:
      - { n: 1, name: scripts, type: ScriptStatus, repeated: true }

  # ---- taps ---------------------------------------------------------------

  - enum: TapLevel
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: raw, doc: "Decoded VT bytes in journal order." }
      - { n: 2, name: text, doc: "Committed lines without escapes; screen rows while an alternate-screen application runs." }
      - { n: 3, name: meta, doc: "Size, title, cwd, and activity; no content." }

  - message: TapSubscribe
    fields:
      - { n: 1, name: level, type: TapLevel }
      - { n: 2, name: panes, type: u32, repeated: true, doc: "The panes to follow." }
      - { n: 3, name: every_pane, type: bool, doc: "Follow every mirrored pane, including later ones (needs all_panes)." }
      - { n: 4, name: interval_ms, type: u32, optional: true, doc: "How often text and meta taps look for changes; default 250, at least 50." }
      - { n: 5, name: for_pane, type: u32, optional: true, doc: "Follow for the app in this app pane, as a desktop drawing a `log` bound to a tap: the app's grant must allow this subscription too, as well as the caller's." }

  - message: TapSubscription
    fields:
      - { n: 1, name: id, type: u64, doc: "Ends with taps.unsubscribe." }
      - { n: 2, name: panes, type: u32, repeated: true, doc: "The panes followed now." }

  - message: TapMeta
    fields:
      - { n: 1, name: cols, type: u32 }
      - { n: 2, name: rows, type: u32 }
      - { n: 3, name: title, type: string, optional: true }
      - { n: 4, name: cwd, type: string, optional: true }
      - { n: 5, name: sequence, type: u64, doc: "Records applied; it advancing means output." }
      - { n: 6, name: alt_screen, type: bool }

  - message: TapRow
    fields:
      - { n: 1, name: row, type: u32, doc: "0 is the top row of the screen." }
      - { n: 2, name: text, type: string }

  - message: TapGap
    doc: "Output this tap did not deliver. The pane itself lost nothing."
    fields:
      - { n: 1, name: reason, type: string, doc: "lagging (the tap fell behind), window (more lines scrolled between looks than a look reads), or restarted (the pane's program was replaced)." }
      - { n: 2, name: lines, type: u64, optional: true, doc: "Lines missed, when known." }

  - message: TapData
    doc: "Pushed as `taps.data`, for one pane."
    fields:
      - { n: 1, name: tap, type: u64 }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: generation, type: u64 }
      - { n: 4, name: gap, type: TapGap }
      - { n: 5, name: raw, type: bytes, doc: "raw: bytes as the program wrote them." }
      - { n: 6, name: lines, type: string, repeated: true, doc: "text: lines that scrolled into history, oldest first." }
      - { n: 7, name: screen, type: TapRow, repeated: true, doc: "text: rows of an alternate screen that changed." }
      - { n: 8, name: meta, type: TapMeta, doc: "meta: the pane's state when it changed." }
      - { n: 9, name: ended, type: bool, doc: "The pane is gone; nothing more follows for it." }
      - { n: 10, name: rows, type: u64, repeated: true, doc: "text: each line's row, counted from the top of the pane's history at the time." }
      - { n: 11, name: cols, type: u32, doc: "text: the pane's width when the lines were read." }

  # ---- terminal.query -----------------------------------------------------

  - message: TerminalQuery
    doc: "Which panes' recent lines match a pattern. Every bound is enforced; a truncated answer says so."
    fields:
      - { n: 1, name: pattern, type: string, doc: "A regular expression (linear time, size-limited), or plain text with `literal`." }
      - { n: 2, name: literal, type: bool }
      - { n: 3, name: ignore_case, type: bool }
      - { n: 4, name: literals, type: string, repeated: true, doc: "More plain-text alternatives." }
      - { n: 5, name: panes, type: u32, repeated: true, doc: "The panes to search; empty means every mirrored pane (needs all_panes)." }
      - { n: 6, name: lines, type: u32, optional: true, doc: "How many of each pane's newest lines (screen included); default 200, at most 2000." }
      - { n: 7, name: max_matches, type: u32, optional: true, doc: "Default 100, at most 1000." }
      - { n: 8, name: hosts, type: string, repeated: true, doc: "Connected hosts to search too (all their panes); `*` means every live host." }
      - { n: 9, name: timeout_ms, type: u32, optional: true, doc: "Default 2000, at most 10000; panes not searched in time are reported." }
      - { n: 10, name: title, type: string, optional: true, doc: "Only panes whose title matches this regular expression." }
      - { n: 11, name: max_bytes, type: u32, optional: true, doc: "Bytes of matching line text returned in all; default 65536, at most 1048576." }

  - message: QueryMatch
    fields:
      - { n: 1, name: host, type: string, optional: true, doc: "Absent for this host." }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: line, type: u32, doc: "Index in the searched window, oldest first." }
      - { n: 4, name: text, type: string }
      - { n: 5, name: match_start, type: u32, doc: "Byte offsets of the match in text." }
      - { n: 6, name: match_end, type: u32 }

  - message: QueryResult
    fields:
      - { n: 1, name: matches, type: QueryMatch, repeated: true }
      - { n: 2, name: panes_searched, type: u32 }
      - { n: 3, name: truncated, type: bool, doc: "A bound cut the answer short; see notes." }
      - { n: 4, name: notes, type: string, repeated: true, doc: "What was cut and why, and hosts that could not be searched." }

  # ---- filters ------------------------------------------------------------

  - enum: DecorationStyle
    values:
      - { n: 0, name: unspecified, doc: "No decoration." }
      - { n: 1, name: highlight }
      - { n: 2, name: dim }
      - { n: 3, name: fold, doc: "Clients may fold the line away; a local presentation choice." }
      - { n: 4, name: badge }

  - message: Decoration
    doc: "A mark on one line of a pane: data for clients to draw, never part of the terminal stream."
    fields:
      - { n: 1, name: id, type: u64 }
      - { n: 2, name: pane, type: u32 }
      - { n: 3, name: generation, type: u64 }
      - { n: 4, name: row, type: u64, doc: "The line's row counted from the top of the pane's history." }
      - { n: 5, name: text, type: string, doc: "The line, as it was when marked." }
      - { n: 6, name: style, type: DecorationStyle }
      - { n: 7, name: badge, type: string, optional: true }
      - { n: 8, name: filter, type: string, doc: "The filter that made it." }
      - { n: 9, name: cols, type: u32, doc: "The pane's width when marked; a reflow invalidates it." }

  - message: DecorationQuery
    fields:
      - { n: 1, name: pane, type: u32 }

  - message: DecorationList
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: decorations, type: Decoration, repeated: true, doc: "Still valid: same generation and width, and the line is still at its row." }

  - enum: FilterState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: running }
      - { n: 2, name: paused, doc: "Paused with filters.pause." }
      - { n: 3, name: tripped, doc: "Its triggers came too fast (a loop?); paused until filters.resume." }

  - message: FilterInput
    doc: "A typed trigger: fixed text typed into a pane. Matched text is never typed."
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: text, type: string }

  - message: FilterSpec
    fields:
      - { n: 1, name: name, type: string, doc: "Unique; its sender identity is filter:<name>." }
      - { n: 2, name: panes, type: u32, repeated: true }
      - { n: 3, name: every_pane, type: bool }
      - { n: 4, name: pattern, type: string, doc: "As in terminal.query: a regular expression, or plain text with `literal`." }
      - { n: 5, name: literal, type: bool }
      - { n: 6, name: literals, type: string, repeated: true }
      - { n: 7, name: ignore_case, type: bool }
      - { n: 8, name: topic, type: string, optional: true, doc: "Publish each matched line here (the derived stream)." }
      - { n: 9, name: recipient, type: string, optional: true, doc: "Send each matched line to this instance." }
      - { n: 10, name: event, type: bool, doc: "Record each match as a filters.matched event (scripts receive them with on_event)." }
      - { n: 11, name: input, type: FilterInput, doc: "Type this into a pane on each match." }
      - { n: 12, name: grant, type: ScriptGrant, doc: "What the filter may do: taps.subscribe for its panes, plus what its outputs need." }
      - { n: 13, name: per_second, type: u32, optional: true, doc: "Matches acted on per second; more are counted as dropped. Default 20." }
      - { n: 14, name: breaker, type: u32, optional: true, doc: "Triggers (topic, recipient, input) allowed in any 10 s; one more trips the filter. Default 50." }
      - { n: 15, name: decorate, type: DecorationStyle, doc: "Mark each matched line on its pane (drawn by clients)." }
      - { n: 16, name: badge, type: string, optional: true, doc: "The badge text for decorate: badge." }

  - message: FilterRef
    fields:
      - { n: 1, name: name, type: string }

  - message: FilterStatus
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: state, type: FilterState }
      - { n: 3, name: matched, type: u64 }
      - { n: 4, name: dropped, type: u64, doc: "Matches over per_second." }
      - { n: 5, name: triggered, type: u64 }
      - { n: 6, name: skipped_own, type: u64, doc: "Lines skipped because they echo this filter's own input." }
      - { n: 7, name: last_error, type: string, optional: true }
      - { n: 8, name: reason, type: string, optional: true, doc: "Why it is paused or tripped." }

  - message: FilterList
    fields:
      - { n: 1, name: filters, type: FilterStatus, repeated: true }

  # ---- jobs ---------------------------------------------------------------

  - enum: JobState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: running }
      - { n: 2, name: succeeded, doc: "Exited with status 0." }
      - { n: 3, name: failed, doc: "Exited with another status." }
      - { n: 4, name: killed, doc: "Ended by a signal (including a cancel)." }
      - { n: 5, name: lost, doc: "Its pane is gone and it left no exit status." }

  - message: EnvVar
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: value, type: string }

  - message: JobStart
    fields:
      - { n: 1, name: argv, type: string, repeated: true, doc: "The exact program and arguments; no shell." }
      - { n: 2, name: cwd, type: string, optional: true }
      - { n: 3, name: env, type: EnvVar, repeated: true, doc: "Added to the job's environment; names are [A-Z_][A-Z0-9_]*." }
      - { n: 4, name: name, type: string, optional: true, doc: "The tmux window name; default the program's name." }
      - { n: 5, name: session, type: u32, optional: true, doc: "The session for its window; default the first session." }

  - message: JobRecord
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: argv, type: string, repeated: true }
      - { n: 3, name: cwd, type: string, optional: true }
      - { n: 4, name: pane, type: u32, doc: "Its tmux pane: read its output with terminal.read while the pane remains." }
      - { n: 5, name: state, type: JobState }
      - { n: 6, name: exit_code, type: i32, optional: true }
      - { n: 7, name: signal, type: i32, optional: true }
      - { n: 8, name: started_unix_ms, type: u64 }
      - { n: 9, name: ended_unix_ms, type: u64, optional: true }
      - { n: 10, name: artifacts, type: string, doc: "The directory the job was given as DREAMER_JOB_ARTIFACTS." }
      - { n: 11, name: cancelled, type: bool, doc: "jobs.cancel was asked." }
      - { n: 12, name: pid, type: u32, optional: true }

  - message: JobRef
    fields:
      - { n: 1, name: id, type: string }

  - message: JobList
    fields:
      - { n: 1, name: jobs, type: JobRecord, repeated: true }

  - message: JobFile
    fields:
      - { n: 1, name: path, type: string, doc: "Relative to the artifacts directory." }
      - { n: 2, name: bytes, type: u64 }

  - message: JobArtifacts
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: directory, type: string }
      - { n: 3, name: files, type: JobFile, repeated: true, doc: "At most 1000, sorted by path." }

  # ---- processes ----------------------------------------------------------

  - message: ProcessQuery
    fields:
      - { n: 1, name: panes, type: u32, repeated: true, doc: "Only processes in these panes; empty means every process of the user (needs all_panes)." }
      - { n: 2, name: runs_only, type: bool, doc: "Only processes that are agent runs." }
      - { n: 3, name: provider, type: string, optional: true, doc: "Only runs of this provider: claude or codex." }

  - message: ProcessRecord
    doc: "One process and what the registry can say about it, with the evidence. Absent fields are unknown, not zero."
    fields:
      - { n: 1, name: pid, type: u32 }
      - { n: 2, name: started_unix_ms, type: u64, doc: "With pid, the process's identity: a reused pid has a different start." }
      - { n: 3, name: ppid, type: u32 }
      - { n: 4, name: pgid, type: u32 }
      - { n: 5, name: tty, type: string, optional: true }
      - { n: 6, name: command, type: string, doc: "The program's file name." }
      - { n: 7, name: args, type: string, doc: "The command line (at most 1024 bytes)." }
      - { n: 8, name: cwd, type: string, optional: true, doc: "Reported for runs only, when the system says." }
      - { n: 9, name: pane, type: u32, optional: true }
      - { n: 10, name: pane_evidence, type: string, optional: true, doc: "ancestry (it descends from the pane's program) or terminal (it only shares the pane's terminal)." }
      - { n: 11, name: provider, type: string, optional: true, doc: "claude or codex, when this is the topmost process of an agent run." }
      - { n: 12, name: confidence, type: string, optional: true, doc: "high, medium, or low, for a run." }
      - { n: 13, name: evidence, type: string, optional: true, doc: "Why it is counted as a run." }
      - { n: 14, name: helper_of, type: u32, optional: true, doc: "The run this process serves (a tool, a server); never itself a run." }
      - { n: 15, name: cpu_permille, type: u32, doc: "CPU use in tenths of a percent of one core, as ps averages it." }
      - { n: 16, name: rss_kib, type: u64, doc: "Resident memory." }

  - message: AgentRunQuery
    fields:
      - { n: 1, name: hosts, type: string, repeated: true, doc: "Connected hosts to ask too; `*` means every live host." }
      - { n: 2, name: provider, type: string, optional: true, doc: "claude or codex." }

  - message: AgentRun
    doc: "One agent run, by evidence. State says only what is known: never inferred from titles, CPU, or output."
    fields:
      - { n: 1, name: host, type: string, optional: true, doc: "Absent for this host." }
      - { n: 2, name: pid, type: u32 }
      - { n: 3, name: started_unix_ms, type: u64, doc: "With host and pid, the run's identity." }
      - { n: 4, name: provider, type: string }
      - { n: 5, name: pane, type: u32, optional: true }
      - { n: 6, name: cwd, type: string, optional: true }
      - { n: 7, name: age_ms, type: u64 }
      - { n: 8, name: cpu_permille, type: u32 }
      - { n: 9, name: rss_kib, type: u64 }
      - { n: 10, name: confidence, type: string }
      - { n: 11, name: evidence, type: string }
      - { n: 12, name: instrumentation, type: string, doc: "passive (found from its process only) or hooks (its provider's hooks report to the daemon)." }
      - { n: 13, name: state, type: string, doc: "passive: running. hooks: active, working, waiting_for_permission, idle (a turn ended), ended, or stale (no report for a while)." }
      - { n: 14, name: helpers, type: u32, doc: "Processes serving it (tools, servers), not counted as runs." }
      - { n: 15, name: session_id, type: string, optional: true, doc: "The provider's session, when its hooks report it." }
      - { n: 16, name: last_event_unix_ms, type: u64, optional: true, doc: "When its hooks last reported." }

  - message: AgentEvent
    doc: "One provider hook report, as dream hook sends it."
    fields:
      - { n: 1, name: provider, type: string, doc: "claude" }
      - { n: 2, name: event, type: string, doc: "The provider's event name, such as SessionStart or Notification." }
      - { n: 3, name: session_id, type: string }
      - { n: 4, name: cwd, type: string, optional: true }
      - { n: 5, name: detail, type: string, optional: true, doc: "The notification type, or why a session ended." }
      - { n: 6, name: hook_pid, type: u32, doc: "The reporting hook process; its ancestry finds the run. It is never the run itself." }

  - message: AgentRunList
    fields:
      - { n: 1, name: runs, type: AgentRun, repeated: true }
      - { n: 2, name: notes, type: string, repeated: true, doc: "Hosts that could not be asked, and why." }

  - message: ProcessList
    fields:
      - { n: 1, name: processes, type: ProcessRecord, repeated: true }
      - { n: 2, name: taken_unix_ms, type: u64 }

  # ---- terminal tools and act levels -----------------------------------------

  - enum: ActLevel
    doc: "How far a grant may act on panes (docs/grants.md). Each level includes the ones before it."
    values:
      - { n: 0, name: unspecified, doc: "No level: the grant's methods and panes alone decide." }
      - { n: 1, name: observe, doc: "List, read, search, and watch panes; never type, run, or change the layout." }
      - { n: 2, name: own, doc: "Also act in panes and windows this connection created." }
      - { n: 3, name: elsewhere, doc: "Also act in other panes, each time the user approves; closing always asks." }

  - message: TerminalInfo
    doc: "One pane, with what an agent needs to choose it."
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: session, type: u32 }
      - { n: 3, name: session_name, type: string }
      - { n: 4, name: window, type: u32 }
      - { n: 5, name: window_name, type: string }
      - { n: 6, name: window_index, type: u32 }
      - { n: 7, name: command, type: string, doc: "The program in the foreground, as tmux reports it." }
      - { n: 8, name: cwd, type: string, optional: true, doc: "The last directory the program reported (OSC 7)." }
      - { n: 9, name: title, type: string }
      - { n: 10, name: cols, type: u32 }
      - { n: 11, name: rows, type: u32 }
      - { n: 12, name: active, type: bool, doc: "The active pane of its window." }
      - { n: 13, name: dead, type: bool, doc: "Its program has exited; the pane stays with its output." }
      - { n: 14, name: tier, type: Tier }
      - { n: 15, name: quiet_ms, type: u64, optional: true, doc: "Time since the pane last wrote anything; absent when it is not mirrored." }
      - { n: 16, name: owned, type: bool, doc: "The calling connection created this pane." }

  - message: TerminalList
    fields:
      - { n: 1, name: terminals, type: TerminalInfo, repeated: true }

  - message: TerminalWatch
    doc: >-
      Wait for one of: `pattern` appearing in new output, the pane writing
      nothing for `quiet_ms`, or (with `exit`) its program ending. At least
      one condition is needed; the first to happen ends the wait.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: pattern, type: string, optional: true, doc: "A regular expression (linear time, size-limited), or plain text with `literal`; matched against lines written after the watch starts." }
      - { n: 3, name: literal, type: bool }
      - { n: 4, name: ignore_case, type: bool }
      - { n: 5, name: quiet_ms, type: u32, optional: true, doc: "How long without output counts as quiet; at least 50." }
      - { n: 6, name: exit, type: bool, doc: "End when the pane's program ends." }
      - { n: 7, name: timeout_ms, type: u32, optional: true, doc: "Default 30000, at most 600000." }

  - enum: WatchOutcome
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: matched, doc: "The pattern appeared; `text` is the line." }
      - { n: 2, name: quiet, doc: "The pane wrote nothing for quiet_ms." }
      - { n: 3, name: exited, doc: "The pane's program ended." }
      - { n: 4, name: closed, doc: "The pane is gone." }
      - { n: 5, name: timeout, doc: "None of the conditions happened in time." }

  - message: WatchResult
    fields:
      - { n: 1, name: outcome, type: WatchOutcome }
      - { n: 2, name: text, type: string, optional: true, doc: "The matching line." }
      - { n: 3, name: match_start, type: u32, doc: "Byte offsets of the match in text." }
      - { n: 4, name: match_end, type: u32 }
      - { n: 5, name: elapsed_ms, type: u64 }
      - { n: 6, name: exit_code, type: i32, optional: true, doc: "When the program was a job and exited." }
      - { n: 7, name: signal, type: i32, optional: true, doc: "When the program was a job and a signal ended it." }

  - message: TerminalRun
    doc: >-
      Run an exact program as a job, in a new window or a new pane split
      from `split`, wait for it, and return its status and output. The
      calling connection owns the new pane.
    fields:
      - { n: 1, name: argv, type: string, repeated: true, doc: "The exact program and arguments; no shell." }
      - { n: 2, name: cwd, type: string, optional: true }
      - { n: 3, name: env, type: EnvVar, repeated: true }
      - { n: 4, name: session, type: u32, optional: true, doc: "The session for a new window; default the first session." }
      - { n: 5, name: name, type: string, optional: true, doc: "The new window's name; default the program's name." }
      - { n: 6, name: split, type: u32, optional: true, doc: "Split this pane for the program instead of opening a window; acting on that pane." }
      - { n: 7, name: direction, type: SplitDirection, doc: "For split; default vertical." }
      - { n: 8, name: timeout_ms, type: u32, optional: true, doc: "How long to wait; default 60000, at most 600000. The program keeps running after it." }
      - { n: 9, name: lines, type: u32, optional: true, doc: "Output lines returned at most, the newest; default 200, at most 2000." }

  - message: RunResult
    fields:
      - { n: 1, name: job, type: JobRecord, doc: "Its state, exit code or signal, and pane." }
      - { n: 2, name: finished, type: bool, doc: "False when the wait timed out; the program is still running." }
      - { n: 3, name: output, type: string, repeated: true, doc: "The pane's text, oldest first, without trailing blank lines." }
      - { n: 4, name: truncated, type: bool, doc: "Older output was left out." }

  - enum: ApprovalDecision
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: once, doc: "Allow this one action." }
      - { n: 2, name: pane, doc: "Allow it and every later action in the same panes for this connection, except closing." }
      - { n: 3, name: deny }

  - message: Approval
    doc: "An action waiting for the user: a connection at the elsewhere level acting on panes it did not create."
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: requester, type: string, doc: "Who asks: an app instance, or owner:N for a narrowed connection of the user's own." }
      - { n: 3, name: method, type: string }
      - { n: 4, name: action, type: string, doc: "What it would do, in words." }
      - { n: 5, name: panes, type: u32, repeated: true, doc: "The panes it would act on that the requester did not create." }
      - { n: 6, name: closing, type: bool, doc: "It closes panes or ends a program; `pane` approval does not cover it." }
      - { n: 7, name: created_unix_ms, type: u64 }
      - { n: 8, name: expires_unix_ms, type: u64, doc: "Unanswered by then, it is denied." }

  - message: ApprovalList
    fields:
      - { n: 1, name: approvals, type: Approval, repeated: true }

  - message: ApprovalAnswer
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: decision, type: ApprovalDecision }
  # ---- collectors ---------------------------------------------------------

  - message: CollectFrom
    doc: "The panes a collector covers: exactly one of these."
    fields:
      - { n: 1, name: all, type: bool, doc: "Every pane, including panes created later." }
      - { n: 2, name: session, type: string, optional: true, doc: "The panes of the session with this name." }
      - { n: 3, name: window, type: u32, optional: true, doc: "The panes of this window (@N)." }
      - { n: 4, name: panes, type: u32, repeated: true, doc: "These panes." }
      - { n: 5, name: command, type: string, optional: true, doc: "Panes whose current command (as tmux names it) matches this regular expression, while it does." }

  - message: CollectWhen
    doc: "What makes a row: exactly one of these."
    fields:
      - { n: 1, name: line, type: string, optional: true, doc: "A committed line matches this regular expression." }
      - { n: 2, name: ignore_case, type: bool, doc: "For line." }
      - { n: 3, name: command_end, type: bool, doc: "A command finished, as the shell reports it through shell integration (OSC 133)." }
      - { n: 4, name: idle_ms, type: u32, optional: true, doc: "The pane wrote nothing for this long after writing something (at least 100)." }
      - { n: 5, name: bell, type: bool, doc: "The pane rang the bell." }
      - { n: 6, name: exit, type: bool, doc: "The pane's process ended: the pane closed, died, or was respawned." }
      - { n: 7, name: every_s, type: u32, optional: true, doc: "Every this many seconds (at least 1); captures the screen unless capture says lines." }

  - message: CollectField
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: value, type: string }

  - message: CollectCapture
    doc: "What a row keeps besides its metadata."
    fields:
      - { n: 1, name: fields, type: CollectField, repeated: true, doc: "Fields from a line match: each value is a template where $1 or ${name} stands for a group." }
      - { n: 2, name: json, type: bool, doc: "The matched line is a JSON object: its top-level members become fields." }
      - { n: 3, name: screen, type: bool, doc: "Keep the pane's screen." }
      - { n: 4, name: lines, type: u32, optional: true, doc: "Keep the pane's last N lines (at most 1000)." }
      - { n: 5, name: before, type: u32, doc: "Lines before a matched line to keep (at most 100)." }
      - { n: 6, name: after, type: u32, doc: "Lines after a matched line to keep (at most 100)." }

  - message: CollectKeep
    fields:
      - { n: 1, name: rows, type: u32, optional: true, doc: "Rows kept; the oldest go first. Default 5000, at most 100000." }
      - { n: 2, name: max_age_s, type: u64, optional: true, doc: "Rows older than this go. Default 7 days." }

  - message: CollectorSpec
    fields:
      - { n: 1, name: name, type: string, doc: "Letters, digits, `-`, `_`, or `.`; unique." }
      - { n: 2, name: from, type: CollectFrom }
      - { n: 3, name: when, type: CollectWhen }
      - { n: 4, name: capture, type: CollectCapture }
      - { n: 5, name: keep, type: CollectKeep }
      - { n: 6, name: per_second, type: u32, optional: true, doc: "Rows per second per pane; more are dropped and counted. Default 10, at most 1000." }
      - { n: 7, name: preset, type: string, optional: true, doc: "A shipped definition to start from (errors, test-failures, commands, urls, paths); each part given here replaces the preset's. The name defaults to the preset's." }

  - enum: CollectorState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: running }
      - { n: 2, name: stopped, doc: "Stopped with collect.stop; its rows can still be queried." }

  - message: CollectorStatus
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: spec, type: CollectorSpec }
      - { n: 3, name: state, type: CollectorState }
      - { n: 4, name: rows, type: u64, doc: "Rows kept now." }
      - { n: 5, name: collected, type: u64, doc: "Rows recorded since it was created." }
      - { n: 6, name: dropped, type: u64, doc: "Rows not recorded since it was created: over per_second, or the writer fell behind." }
      - { n: 7, name: panes, type: u32, repeated: true, doc: "The panes it follows now." }
      - { n: 8, name: created_unix_ms, type: u64 }
      - { n: 9, name: last_error, type: string, optional: true }

  - message: CollectList
    fields:
      - { n: 1, name: collectors, type: CollectorStatus, repeated: true }

  - message: CollectRow
    doc: "One row of a collector's table."
    fields:
      - { n: 1, name: id, type: u64, doc: "Increases by one per row of the collector, across daemon restarts." }
      - { n: 2, name: collector, type: string }
      - { n: 3, name: time_unix_ms, type: u64 }
      - { n: 4, name: pane, type: u32 }
      - { n: 5, name: session, type: string, doc: "The pane's session name." }
      - { n: 6, name: cwd, type: string, optional: true, doc: "The pane's working directory: as the shell reports it (OSC 7), else its process's." }
      - { n: 7, name: command, type: string, optional: true, doc: "The command line the shell reported, else the pane's current command." }
      - { n: 8, name: trigger, type: string, doc: "line, command_end, idle, bell, exit, or interval." }
      - { n: 9, name: line, type: string, doc: "The matched line (line trigger)." }
      - { n: 10, name: fields, type: CollectField, repeated: true }
      - { n: 11, name: before, type: string, repeated: true, doc: "Context lines before the matched line, oldest first." }
      - { n: 12, name: after, type: string, repeated: true, doc: "Context lines after the matched line." }
      - { n: 13, name: lines, type: string, repeated: true, doc: "The screen or the last lines, when capture asks for them." }
      - { n: 14, name: exit_status, type: i32, optional: true, doc: "command_end: the status the shell reported." }
      - { n: 15, name: dropped, type: u64, doc: "Rows this pane dropped (rate cap) since its previous recorded row." }
      - { n: 16, name: window, type: u32, optional: true }

  - message: CollectQuery
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: panes, type: u32, repeated: true, doc: "Only rows from these panes." }
      - { n: 3, name: fields, type: CollectField, repeated: true, doc: "Only rows with each of these fields at exactly this value." }
      - { n: 4, name: since_unix_ms, type: u64, optional: true }
      - { n: 5, name: until_unix_ms, type: u64, optional: true }
      - { n: 6, name: after, type: u64, optional: true, doc: "Only rows after this row id: the first `limit` of them. Without it, the newest `limit`." }
      - { n: 7, name: limit, type: u32, optional: true, doc: "Default 100, at most 10000." }
      - { n: 8, name: group_by, type: string, optional: true, doc: "Count rows by a field, or by pane, session, window, cwd, command, or trigger, instead of listing them." }

  - message: CollectGroup
    fields:
      - { n: 1, name: value, type: string, doc: "Empty for rows without the field." }
      - { n: 2, name: count, type: u64 }
      - { n: 3, name: latest_unix_ms, type: u64 }

  - message: CollectResult
    fields:
      - { n: 1, name: rows, type: CollectRow, repeated: true, doc: "Oldest first." }
      - { n: 2, name: groups, type: CollectGroup, repeated: true, doc: "With group_by: most rows first." }
      - { n: 3, name: matched, type: u64, doc: "Rows that passed the filters." }
      - { n: 4, name: truncated, type: bool, doc: "More rows matched than were returned." }
      - { n: 5, name: dropped, type: u64, doc: "The collector's dropped count (see CollectorStatus)." }

  - message: CollectRef
    fields:
      - { n: 1, name: name, type: string }
      - { n: 2, name: delete, type: bool, doc: "Also delete its definition and rows." }

  # ---- the harness drawer -------------------------------------------------

  - enum: DrawerWant
    values:
      - { n: 0, name: unspecified, doc: Same as toggle. }
      - { n: 1, name: toggle, doc: "Show and focus it when hidden or in another window; focus it when shown and not focused; hide it when focused." }
      - { n: 2, name: show, doc: "Show it in the window and focus it, starting the harness first if the session has no drawer." }
      - { n: 3, name: hide, doc: "Move it to the holding session; focus returns to the pane that had it before the drawer was shown." }
      - { n: 4, name: new, doc: "Close the session's drawer pane if there is one, and start a fresh harness, shown and focused." }

  - message: DrawerRequest
    doc: >-
      Which session's drawer, and where to show it. With none of session,
      window, or pane given the request is refused.
    fields:
      - { n: 1, name: session, type: u32, optional: true, doc: "The tmux session whose drawer this is." }
      - { n: 2, name: window, type: u32, optional: true, doc: "The window to show it in; names the session when `session` is absent. Default: the session's active window." }
      - { n: 3, name: pane, type: u32, optional: true, doc: "The pane asking (a shell's TMUX_PANE): names the window and session when they are absent. The drawer pane itself names its own session." }
      - { n: 4, name: want, type: DrawerWant }
      - { n: 5, name: endpoint, type: string, optional: true }

  - message: DrawerStatus
    fields:
      - { n: 1, name: session, type: u32 }
      - { n: 2, name: pane, type: u32, optional: true, doc: "The drawer's pane; absent while the session has none." }
      - { n: 3, name: shown, type: bool, doc: "In a window of the session (not the holding session)." }
      - { n: 4, name: window, type: u32, optional: true, doc: "The window the pane is in, the holding session's while hidden." }
      - { n: 5, name: focused, type: bool, doc: "The active pane of its window, and that window the session's active one." }
      - { n: 6, name: zoomed, type: bool, doc: "Shown zoomed, because the window was too small to dock it." }
      - { n: 7, name: created, type: bool, doc: "This call started the harness." }
      - { n: 8, name: harness, type: string, doc: "The harness the pane was started with." }
      - { n: 9, name: command, type: string, repeated: true, doc: "The program and arguments it was started with; empty unless this call started it." }
      - { n: 10, name: problem, type: string, optional: true, doc: "Why the harness could not start; the pane says the same." }
      - { n: 11, name: from_pane, type: u32, optional: true, doc: "The pane that had focus before the drawer was last shown or focused, while it exists: where hiding returns focus, and the pane the harness's context commands read." }

  # ---- web panes ----------------------------------------------------------

  - message: WebOpen
    doc: >-
      Open a web page in a new tmux pane: a placeholder pane, marked as a
      web pane, whose rectangle desktops that can draw web pages fill with
      the page. With pane, the pane is split; otherwise a new window opens
      in session.
    fields:
      - { n: 1, name: url, type: string, doc: "A URL (http, https, file, data, or about:blank), or an address as typed into a browser's address bar (example.com, localhost:3000, an absolute path), which becomes one." }
      - { n: 2, name: session, type: u32, optional: true, doc: "The session to open a new window in." }
      - { n: 3, name: pane, type: u32, optional: true, doc: "The pane to split (side by side) instead." }
      - { n: 4, name: endpoint, type: string, optional: true }
      - { n: 5, name: wait_ms, type: u32, optional: true, doc: "While Dreamer Web is not installed in a desktop that reports it (web.component) and is being added or offered there: how long to wait for it before failing; default 600000 (ten minutes), at most that. 0 returns as soon as the pane exists, as with no desktop running." }

  - message: WebOpened
    fields:
      - { n: 1, name: pane, type: u32, doc: "The new web pane." }

  - enum: WebComponentStatus
    doc: "Whether a desktop can draw web pages: Dreamer Web, the component that holds Chromium, as that desktop knows it."
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: ready, doc: "Installed: pages load." }
      - { n: 2, name: missing, doc: "Not installed, and web panes offer to add it (web.component: ask)." }
      - { n: 3, name: adding, doc: "Being added." }
      - { n: 4, name: failed, doc: "The last try to add it failed; web panes offer to try again." }
      - { n: 5, name: off, doc: "Not installed, and not offered (web.component: never)." }

  - message: WebComponentState
    doc: >-
      What a desktop reports of Dreamer Web (web.component), on the
      connection it answers captures on, whenever it changes: a web.open
      waiting for it to be added returns once a desktop reports it ready,
      and fails when every desktop that reports says it will not be.
    fields:
      - { n: 1, name: status, type: WebComponentStatus }
      - { n: 2, name: detail, type: string, optional: true, doc: "Why it is missing, failed, or off." }

  - message: WebState
    doc: >-
      What a web pane's page shows, from the desktop drawing it, kept in
      the placeholder: the page's title as the pane's title and in the
      placeholder's text for plain tmux clients, and its scroll position
      for the page to open there again.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: title, type: string, doc: "At most 200 characters are kept; control characters are dropped." }
      - { n: 3, name: scroll_x, type: i32, doc: "CSS pixels." }
      - { n: 4, name: scroll_y, type: i32 }
      - { n: 5, name: endpoint, type: string, optional: true }
      - { n: 6, name: url, type: string, optional: true, doc: "The page's address now, when the page navigated (the browser): kept as the pane's web URL, so it opens there again. Ignored unless it is a URL a web pane may show." }

  - message: WebNavigate
    doc: >-
      Load another address in an existing web pane (the browser), as if it
      were typed into its address bar: the pane's web URL changes, and a
      desktop drawing the page loads it there, its back stack kept.
    fields:
      - { n: 1, name: pane, type: u32, doc: "A web pane." }
      - { n: 2, name: url, type: string, doc: "A URL or a typed address, as in WebOpen." }
      - { n: 3, name: endpoint, type: string, optional: true }

  - message: WebRead
    doc: >-
      Read the page of a web pane, or of an app pane whose view is a page
      (a web app), from the desktop showing it. Needs web.inspect in the
      caller's grant.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: tree, type: bool, doc: "Also the page's accessibility tree." }
      - { n: 3, name: wait_ms, type: u32, optional: true, doc: "How long to wait for the desktop's answer; default 10000, at most 60000." }

  - message: WebNode
    doc: "A node of a page's accessibility tree, in document order."
    fields:
      - { n: 1, name: node, type: u64, doc: "The element's id for web.click and web.type, valid while the page stays loaded; 0 when the node is not an element." }
      - { n: 2, name: depth, type: u32, doc: "How many of the nodes listed contain it." }
      - { n: 3, name: role, type: string, doc: "Its role, such as heading, link, textbox, or button." }
      - { n: 4, name: name, type: string, doc: "Its accessible name." }
      - { n: 5, name: value, type: string, doc: "Its value, for a field." }

  - message: WebPage
    fields:
      - { n: 1, name: url, type: string }
      - { n: 2, name: title, type: string }
      - { n: 3, name: text, type: string, doc: "The page's text as it is rendered (the body's innerText), at most 100000 characters." }
      - { n: 4, name: nodes, type: WebNode, repeated: true, doc: "With tree: the accessibility tree without ignored, generic, and inline text nodes, at most 2000 nodes." }
      - { n: 5, name: truncated, type: bool, doc: "The text or the tree was cut at its bound." }

  - message: WebScreenshot
    doc: "An image of the page of a web pane (or a web app's pane) as Chromium draws it, written as a PNG file by the desktop showing it. Needs web.inspect."
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: path, type: string, doc: "Absolute path of the PNG file; replaced when it exists." }
      - { n: 3, name: wait_ms, type: u32, optional: true }

  - message: WebClick
    doc: >-
      Click an element of the page of a web pane (or a web app's pane): a
      mouse click in the middle of the element, once it is scrolled into
      view. Name the element by node (from web.read's tree) or by a CSS
      selector (its first match). Needs web.inspect.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: node, type: u64, optional: true }
      - { n: 3, name: selector, type: string, optional: true }
      - { n: 4, name: wait_ms, type: u32, optional: true }

  - message: WebType
    doc: >-
      Type text into the page of a web pane (or a web app's pane): into the
      element named by node or selector, focused first, else into what has
      the page's focus. The text is inserted at the caret as typed; the
      clipboard is not used. Needs web.inspect.
    fields:
      - { n: 1, name: pane, type: u32 }
      - { n: 2, name: node, type: u64, optional: true }
      - { n: 3, name: selector, type: string, optional: true }
      - { n: 4, name: text, type: string }
      - { n: 5, name: submit, type: bool, doc: "Then press Enter, which submits a form from one of its fields." }
      - { n: 6, name: wait_ms, type: u32, optional: true }

  # ---- agent sessions -----------------------------------------------------

  - enum: AgentSessionState
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: starting, doc: "The harness is starting." }
      - { n: 2, name: idle, doc: "The harness runs and waits for a prompt." }
      - { n: 3, name: working, doc: "A turn is running." }
      - { n: 4, name: waiting, doc: "A turn waits for an approval." }
      - { n: 5, name: detached, doc: "No harness runs (the daemon restarted, or the harness ended). Sending or resuming starts it again on the harness's own session." }
      - { n: 6, name: closed, doc: "Closed; its transcript stays." }

  - message: AgentSessionCreate
    fields:
      - { n: 1, name: harness, type: string, optional: true, doc: "A harness from the agents settings; default agents.default." }
      - { n: 2, name: cwd, type: string, optional: true, doc: "The harness's working directory; default the daemon's home directory." }
      - { n: 3, name: grant, type: Grant, doc: "What the session may do through Dreamer, within the caller's own grant. Default: the terminal tools on every pane at the observe level." }
      - { n: 4, name: model, type: string, optional: true, doc: "Default agents.<harness>.model, else the harness's own default." }
      - { n: 5, name: name, type: string, optional: true }

  - message: AgentSession
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: harness, type: string }
      - { n: 3, name: cwd, type: string }
      - { n: 4, name: state, type: AgentSessionState }
      - { n: 5, name: grant, type: Grant, doc: "The session's grant: the outer limit for everything its harness does through Dreamer." }
      - { n: 6, name: harness_session, type: string, optional: true, doc: "The harness's own session id, kept for resume." }
      - { n: 7, name: pid, type: u32, optional: true, doc: "The harness process while it runs." }
      - { n: 8, name: created_unix_ms, type: u64 }
      - { n: 9, name: last_seq, type: u64, doc: "The newest event's sequence number." }
      - { n: 10, name: model, type: string, optional: true }
      - { n: 11, name: name, type: string, optional: true }
      - { n: 12, name: detail, type: string, optional: true, doc: "Why it is detached, or what went wrong at start." }
      - { n: 13, name: harness_version, type: string, optional: true }

  - message: AgentSessionList
    fields:
      - { n: 1, name: sessions, type: AgentSession, repeated: true }

  - message: AgentSessionRef
    fields:
      - { n: 1, name: session, type: string }

  - message: AgentSessionSend
    fields:
      - { n: 1, name: session, type: string }
      - { n: 2, name: text, type: string, doc: "The prompt. Sent while a turn runs, it waits for that turn to end." }

  - message: AgentSessionAnswer
    fields:
      - { n: 1, name: session, type: string }
      - { n: 2, name: approval, type: string, doc: "The approval_request event's id." }
      - { n: 3, name: option, type: string, optional: true, doc: "For a request with options, the one chosen when approving." }
      - { n: 4, name: for_pane, type: u32, optional: true, doc: "Answer for the app in this app pane, as a desktop drawing its `transcript`'s approval card: the app's grant must allow this method and the session must be one the app may see, as well as the caller's." }

  - message: AgentSessionEventsQuery
    fields:
      - { n: 1, name: session, type: string }
      - { n: 2, name: after, type: u64, optional: true, doc: "Events after this sequence number; default from the start of the transcript." }
      - { n: 3, name: follow, type: bool, doc: "Keep streaming: the reply carries no events, and `agent.sessions.events` notifications follow, the stored ones first. End it with terminal.unsubscribe." }
      - { n: 4, name: limit, type: u32, optional: true, doc: "Without follow, the most events in the reply; default 1000, at most 10000." }
      - { n: 5, name: for_pane, type: u32, optional: true, doc: "Read for the app in this app pane, as a desktop drawing a `transcript` bound to the session: the app's grant must allow agent.sessions.events and the session must be one the app may see, as well as the caller's." }

  - enum: AgentToolStatus
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: started }
      - { n: 2, name: updated, doc: "Partial output." }
      - { n: 3, name: finished }
      - { n: 4, name: failed }

  - enum: AgentStopReason
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: end_turn }
      - { n: 2, name: cancelled }
      - { n: 3, name: error }

  - message: AgentText
    fields:
      - { n: 1, name: text, type: string }

  - message: AgentToolCall
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: name, type: string }
      - { n: 3, name: status, type: AgentToolStatus }
      - { n: 4, name: input, type: string, optional: true, doc: "The tool's input as JSON." }
      - { n: 5, name: output, type: string, optional: true, doc: "Its output as text: the latest partial output, or the final one." }

  - message: AgentApprovalRequest
    doc: "The harness asks the user before going on. Answer with agent.sessions.approve or agent.sessions.deny."
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: title, type: string }
      - { n: 3, name: message, type: string, optional: true }
      - { n: 4, name: options, type: string, repeated: true, doc: "Choices offered; empty for a yes or no question." }
      - { n: 5, name: expires_unix_ms, type: u64, optional: true, doc: "The harness answers by itself after this." }

  - message: AgentApprovalAnswer
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: allowed, type: bool }
      - { n: 3, name: option, type: string, optional: true }
      - { n: 4, name: by, type: string, doc: "Who answered: owner:N, an app instance, or `dreamer` when the session closed first." }

  - message: AgentPlanEntry
    fields:
      - { n: 1, name: content, type: string }
      - { n: 2, name: status, type: string, doc: "pending, in_progress, or completed." }
      - { n: 3, name: priority, type: string, optional: true }

  - message: AgentPlan
    fields:
      - { n: 1, name: entries, type: AgentPlanEntry, repeated: true }

  - message: AgentUsage
    doc: "Tokens of the latest model response, as the harness reports them."
    fields:
      - { n: 1, name: input_tokens, type: u64 }
      - { n: 2, name: output_tokens, type: u64 }
      - { n: 3, name: cache_read_tokens, type: u64 }
      - { n: 4, name: cache_write_tokens, type: u64 }
      - { n: 5, name: cost_micro_usd, type: u64, optional: true, doc: "What the harness says it cost, in millionths of a US dollar." }

  - message: AgentTurnEnd
    fields:
      - { n: 1, name: stop_reason, type: AgentStopReason }

  - message: AgentError
    fields:
      - { n: 1, name: message, type: string }

  - message: AgentSessionStatus
    doc: "The session changed state: the harness started, resumed, or ended, or the session closed."
    fields:
      - { n: 1, name: state, type: AgentSessionState }
      - { n: 2, name: detail, type: string, optional: true }
      - { n: 3, name: harness_session, type: string, optional: true }

  - message: AgentSessionEvent
    doc: >-
      One normalised event, the same whatever the harness. Its shape follows
      the Agent Client Protocol: text and thinking arrive as deltas, a tool
      call as started, updated, and finished records with one id.
    fields:
      - { n: 1, name: seq, type: u64, doc: "Its place in the session's transcript, from 1." }
      - { n: 2, name: unix_ms, type: u64 }
    oneof:
      name: kind
      variants:
        - { n: 10, name: user_message, type: AgentText }
        - { n: 11, name: text_delta, type: AgentText }
        - { n: 12, name: thinking_delta, type: AgentText }
        - { n: 13, name: tool_call, type: AgentToolCall }
        - { n: 14, name: approval_request, type: AgentApprovalRequest }
        - { n: 15, name: approval_answer, type: AgentApprovalAnswer }
        - { n: 16, name: plan, type: AgentPlan }
        - { n: 17, name: usage, type: AgentUsage }
        - { n: 18, name: turn_end, type: AgentTurnEnd }
        - { n: 19, name: error, type: AgentError }
        - { n: 20, name: status, type: AgentSessionStatus }

  - message: AgentSessionEvents
    doc: "The reply to agent.sessions.events, and the payload of each `agent.sessions.events` notification."
    fields:
      - { n: 1, name: session, type: string }
      - { n: 2, name: subscription, type: u64, optional: true, doc: "When following." }
      - { n: 3, name: events, type: AgentSessionEvent, repeated: true }
      - { n: 4, name: more, type: bool, doc: "Without follow: more events follow the last one; ask again after it." }

  # ---- memory -------------------------------------------------------------

  - enum: MemoryScope
    doc: "Where a memory applies. Unspecified in a query means every scope the caller's context reaches."
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: user, doc: "The user, on every host and in every project." }
      - { n: 2, name: host, doc: "This host only." }
      - { n: 3, name: project, doc: "One project: found from the caller's working directory." }
      - { n: 4, name: session, doc: "One agent session." }

  - enum: MemoryKind
    doc: "What a memory is about; the same kinds as Claude Code's memory."
    values:
      - { n: 0, name: unspecified }
      - { n: 1, name: user, doc: "About the user: role, preferences, what they know." }
      - { n: 2, name: feedback, doc: "Guidance the user gave about how to work." }
      - { n: 3, name: project, doc: "Facts about the work: decisions, people, dates." }
      - { n: 4, name: reference, doc: "Where to find something outside the project." }

  - message: MemoryContext
    doc: "Who is asking, for the project and session scopes."
    fields:
      - { n: 1, name: cwd, type: string, optional: true, doc: "The caller's working directory; the project is the nearest directory above it holding .dreamer/memory, else its git root, else the directory itself." }
      - { n: 2, name: session, type: string, optional: true, doc: "The agent session id, for the session scope." }

  - message: MemoryItem
    fields:
      - { n: 1, name: id, type: string, doc: "Stable while the memory exists; for the files provider, the scope and the file's name without .md (user/prefers-tabs)." }
      - { n: 2, name: scope, type: MemoryScope }
      - { n: 3, name: kind, type: MemoryKind }
      - { n: 4, name: title, type: string }
      - { n: 5, name: description, type: string, doc: "One line, for the index." }
      - { n: 6, name: text, type: string }
      - { n: 7, name: links, type: string, repeated: true, doc: "Paths, URLs, or other memories' ids." }
      - { n: 8, name: created_unix_ms, type: u64 }
      - { n: 9, name: updated_unix_ms, type: u64 }
      - { n: 10, name: path, type: string, optional: true, doc: "The file that holds it, for a provider that keeps files." }
      - { n: 11, name: score, type: u32, optional: true, doc: "memory.recall: how well it matched; higher is better." }

  - message: MemoryProblem
    doc: "A memory file that could not be read; it is left as it is and skipped."
    fields:
      - { n: 1, name: path, type: string }
      - { n: 2, name: message, type: string }

  - message: MemoryItems
    fields:
      - { n: 1, name: items, type: MemoryItem, repeated: true }
      - { n: 2, name: problems, type: MemoryProblem, repeated: true }
      - { n: 3, name: provider, type: string, doc: "The provider in force (files, sqlite, or kosmonaut)." }

  - message: MemoryRecall
    fields:
      - { n: 1, name: query, type: string, doc: "Words to look for; empty returns the newest." }
      - { n: 2, name: scope, type: MemoryScope, doc: "Unspecified: every scope the context reaches." }
      - { n: 3, name: limit, type: u32, optional: true, doc: "Default 10, at most 100." }
      - { n: 4, name: context, type: MemoryContext }

  - message: MemoryRemember
    fields:
      - { n: 1, name: text, type: string }
      - { n: 2, name: kind, type: MemoryKind }
      - { n: 3, name: scope, type: MemoryScope }
      - { n: 4, name: title, type: string, optional: true, doc: "Default: the text's first line, shortened." }
      - { n: 5, name: description, type: string, optional: true, doc: "Default: the title." }
      - { n: 6, name: links, type: string, repeated: true }
      - { n: 7, name: context, type: MemoryContext }

  - message: MemoryListQuery
    fields:
      - { n: 1, name: scope, type: MemoryScope, doc: "Unspecified: every scope the context reaches." }
      - { n: 2, name: kind, type: MemoryKind, doc: "Unspecified: every kind." }
      - { n: 3, name: context, type: MemoryContext }

  - message: MemoryRef
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: context, type: MemoryContext, doc: "Needed for an id in the project or session scope." }

  - message: MemoryUpdate
    doc: "Change a memory; what is not given stays."
    fields:
      - { n: 1, name: id, type: string }
      - { n: 2, name: text, type: string, optional: true }
      - { n: 3, name: kind, type: MemoryKind, doc: "Unspecified: unchanged." }
      - { n: 4, name: title, type: string, optional: true, doc: "The id stays the same." }
      - { n: 5, name: description, type: string, optional: true }
      - { n: 6, name: links, type: string, repeated: true, doc: "Replace the links with these." }
      - { n: 7, name: clear_links, type: bool, doc: "Remove every link." }
      - { n: 8, name: context, type: MemoryContext }

  - message: MemoryTransfer
    doc: "Which memories memory.import and memory.export copy."
    fields:
      - { n: 1, name: scope, type: MemoryScope, doc: "Unspecified: every scope the context reaches." }
      - { n: 2, name: context, type: MemoryContext }

  - message: MemoryTransferred
    fields:
      - { n: 1, name: ids, type: string, repeated: true, doc: "The memories copied, newest first." }
      - { n: 2, name: problems, type: MemoryProblem, repeated: true, doc: "Memory files that could not be read; they are left out." }
      - { n: 3, name: from, type: string, doc: "The provider copied from." }
      - { n: 4, name: to, type: string, doc: "The provider copied into." }

methods:
  - { method: daemon.version, params: Empty, result: VersionInfo, doc: Protocol and build identity. }
  - { method: daemon.status, params: Empty, result: DaemonStatus, doc: "Process, socket, log, and tmux endpoint state." }
  - { method: daemon.shutdown, params: Empty, result: ShutdownResult, mutation: true, doc: "Stop the daemon; tmux sessions and panes keep running." }
  - { method: daemon.diagnostics, params: Empty, result: Diagnostics, doc: "Performance diagnostics: stage timings, traffic counters, and queue depths. No terminal content." }
