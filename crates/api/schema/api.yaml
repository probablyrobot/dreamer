  - { method: web.state, params: WebState, result: Empty, mutation: true, doc: "Keep a web pane's page title and scroll position in its placeholder (owner only; the desktop drawing the page reports them)." }
  - { method: web.navigate, params: WebNavigate, result: Empty, mutation: true, doc: "Load another address in a web pane: its URL in tmux changes, and the desktop drawing it navigates there (owner, or an agent at own or elsewhere, which asks for a pane it did not create)." }
  - { method: web.read, params: WebRead, result: WebPage, doc: "A page's address, title, text, and (tree) accessibility tree, from the desktop showing it (needs web.inspect in the grant)." }
