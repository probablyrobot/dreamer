  - { method: memory.export, params: MemoryTransfer, result: MemoryTransferred, mutation: true, doc: "Copy what the provider in force holds into the files provider, as markdown files and their MEMORY.md index; a file with the same id is replaced. Refused while files is the provider in force." }
