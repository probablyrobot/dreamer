[package]
name = "providers"
description = "Agent providers: Claude Code and Codex CLIs on the user's own login, behind one contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
platform = { path = "../platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["process", "io-util", "rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
