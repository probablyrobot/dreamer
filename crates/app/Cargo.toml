[package]
name = "dreamer-app"
description = "Dreamer desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dreamer"
path = "src/main.rs"

[features]
# Web panes drawn by Chromium (CEF). macOS only so far; needs `cargo xtask
# deps web`, and the app runs from a bundle made by `cargo xtask web bundle`.
web = ["web-engine/engine", "dep:futures-lite"]

[dependencies]
api = { path = "../api" }
app-model = { path = "../app-model" }
view-tree = { path = "../view-tree" }
async-channel = "2.5.0"
futures-lite = { version = "2.6.1", optional = true }
client = { path = "../client" }
gpui.workspace = true
png = "=0.18.1"
replica = { path = "../replica" }
workspace-config = { path = "../workspace-config" }
terminal-ghostty = { path = "../terminal-ghostty" }
terminal-render = { path = "../terminal-render" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
web-engine = { path = "../web-engine" }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true
