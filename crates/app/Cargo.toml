[package]
name = "dreamer-app"
description = "Dreamer desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dreamer"
path = "src/main.rs"

[dependencies]
api = { path = "../api" }
client = { path = "../client" }
gpui.workspace = true
replica = { path = "../replica" }
workspace-config = { path = "../workspace-config" }
terminal-ghostty = { path = "../terminal-ghostty" }
terminal-render = { path = "../terminal-render" }
tokio = { version = "1.54.1", features = ["rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true
