[package]
name = "dreamer-app"
description = "Dreamer desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dreamer"
path = "src/main.rs"

[features]
# Web panes drawn by Chromium (CEF), on macOS and Linux. Chromium itself is
# the Dreamer Web component, loaded at run time from where `dream web
# install` puts it (see crates/web-component). On macOS the build needs
# `cargo xtask deps web`; on Linux it needs nothing more (libcef.so is not
# linked).
web = ["web-engine/engine", "dep:futures-lite"]

[dependencies]
api.workspace = true
app-model = { path = "../app-model" }
view-tree.workspace = true
async-channel = "2.5.0"
futures-lite = { version = "2.6.1", optional = true }
client.workspace = true
gpui.workspace = true
png = "=0.18.1"
replica = { path = "../replica" }
workspace-config.workspace = true
terminal-ghostty.workspace = true
terminal-render = { path = "../terminal-render" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
web-component.workspace = true
web-engine = { path = "../web-engine" }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSString", "NSUserDefaults", "NSValue"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true
