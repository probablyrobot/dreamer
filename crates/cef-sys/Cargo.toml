[package]
name = "cef-sys"
description = "The pinned Chromium Embedded Framework bindings and the platform glue CEF needs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Builds against CEF. Needs `cargo xtask deps web`: the pinned distribution
# as CEF_PATH, and cmake and Ninja on PATH. Without it the crate is empty.
cef = ["dep:cef", "dep:objc2", "dep:objc2-foundation", "dep:ash", "dep:libc"]

[dependencies]
# Binds CEF 156.0.30 (Chromium 156.0.8078.96); see deps/baseline.toml.
# No default features: no sandbox (not run yet), no bundler, no resources.
cef = { version = "=156.6.0", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, features = [
    "NSGeometry",
    "NSRange",
    "NSString",
] }

# Linux, Wayland: frames Chromium renders offscreen are copied on the GPU
# into buffers the compositor can keep (`dmabuf`). Both are already in the
# lock (the toolkit's renderer uses them).
[target.'cfg(target_os = "linux")'.dependencies]
ash = { version = "0.38.0", optional = true }
libc = { version = "0.2.191", optional = true }

[lints]
workspace = true
