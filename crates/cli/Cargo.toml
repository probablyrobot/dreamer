[package]
name = "dreamer-cli"
description = "Dreamer command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[[bin]]
name = "dream"
path = "src/main.rs"

[dependencies]
environment.workspace = true
app-package.workspace = true
app-registry.workspace = true
providers.workspace = true
api.workspace = true
app-protocol.workspace = true
client.workspace = true
prost = "0.14.5"
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "macros", "transport-io"] }
platform.workspace = true
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9.42"
serde_json = "1.0.154"
swc_common = "27"
swc_ts_fast_strip = "=60.0.1"
swc_ecma_ast = "=30.0.2"
swc_ecma_parser = { version = "=47.0.2", default-features = false, features = ["typescript"] }
swc_ecma_transforms_base = "=51.0.3"
swc_ecma_visit = "=30.0.0"
toml = "0.8.23"
terminal-core.workspace = true
tmux-backend.workspace = true
web-component.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "time", "io-std", "io-util", "signal"] }
workspace-config.workspace = true
workspace-host.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["process"] }
platform = { package = "dreamer-platform", path = "../platform" }
serde_json = "1.0.154"
