[package]
name = "dreamer-cli"
description = "Dreamer command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dream"
path = "src/main.rs"

[dependencies]
api = { path = "../api" }
client = { path = "../client" }
platform = { path = "../platform" }
serde_json = "1.0.154"
terminal-core = { path = "../terminal-core" }
tmux-backend = { path = "../tmux-backend" }
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "time", "io-std", "io-util"] }
workspace-config = { path = "../workspace-config" }
workspace-host = { path = "../workspace-host" }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["process"] }
platform = { path = "../platform" }
serde_json = "1.0.154"
