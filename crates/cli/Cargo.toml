[package]
name = "dreamer-cli"
description = "Dreamer command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dream"
path = "src/main.rs"

[dependencies]
tmux-backend = { path = "../tmux-backend" }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
workspace-config = { path = "../workspace-config" }

[lints]
workspace = true
