[package]
name = "terminal-render"
description = "Cell-accurate GPUI renderer for terminal frame snapshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
gpui.workspace = true
# Same versions GPUI uses, for image frames and glyph run lists.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
smallvec = "1.16.5"
terminal-core.workspace = true

# The platform shapers themselves, for comparing placed runs with them.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_apple = { workspace = true, features = ["font-kit"] }

[lints]
workspace = true
