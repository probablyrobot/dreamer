[package]
name = "dreamer-terminal-ghostty"
description = "Safe libghostty-vt terminal engine producing owned frame snapshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true


# Published as dreamer-terminal-ghostty; the library keeps its short name.
[lib]
name = "terminal_ghostty"
[[bin]]
name = "vt-dump"
path = "src/bin/vt-dump.rs"

[[bin]]
name = "snapshot-fixtures"
path = "src/bin/snapshot-fixtures.rs"

[dependencies]
ghostty-sys.workspace = true
png = "=0.18.1"
terminal-core.workspace = true

[lints]
workspace = true
