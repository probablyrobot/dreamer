[package]
name = "app-model"
description = "The model of a Dreamer app package: manifest, data, selection, forms, and commands, shared by its presentations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
api = { path = "../api" }
client = { path = "../client" }
platform = { path = "../platform" }
providers = { path = "../providers" }
script-runtime = { path = "../script-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync", "net"] }
toml = "0.8.23"

[lints]
workspace = true
