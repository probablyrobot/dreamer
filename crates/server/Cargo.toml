[package]
name = "dreamer-server"
description = "Headless Dreamer server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[[bin]]
name = "dreamerd"
path = "src/main.rs"

[features]
# The `kosmonaut` memory provider: a Kosmonaut server over gRPC
# (docs/memory.md). Off by default; without it `memory.provider: kosmonaut`
# is refused at each memory call.
kosmonaut = ["memory/kosmonaut"]

[dependencies]
api.workspace = true
client.workspace = true
matcher.workspace = true
memory.workspace = true
procreg.workspace = true
script-runtime.workspace = true
serde_json = "1.0.154"
view-tree.workspace = true
domain.workspace = true
mirror.workspace = true
perf.workspace = true
platform.workspace = true
prost = "0.14.5"
providers.workspace = true
terminal-core.workspace = true
tmux-backend.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros", "process"] }
# The same client and pin as app `fetch` (docs/dependency-baseline.md), for
# the `openai` memory embedder (src/memories/openai.rs), the one place the
# server uses it.
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
wire.workspace = true
workspace-config.workspace = true
workspace-host.workspace = true

[dev-dependencies]
terminal-ghostty = { package = "dreamer-terminal-ghostty", path = "../terminal-ghostty" }
replica = { path = "../replica" }
app-model = { path = "../app-model" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
