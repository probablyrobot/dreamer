[package]
name = "dreamer-sdk"
description = "Write Dreamer extensions and process apps in Rust: stdio JSON-RPC with typed calls and notifications, and a view builder with an event loop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["dreamer","terminal","tmux","extension","json-rpc"]
categories = ["api-bindings","command-line-interface"]
publish = true

[dependencies]
api.workspace = true
app-protocol.workspace = true
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "sync", "rt", "macros"] }
view-tree.workspace = true

[dev-dependencies]
client = { path = "../client" }
platform = { path = "../platform" }
prost = "0.14.5"
tmux-backend = { path = "../tmux-backend" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process"] }

[lints]
workspace = true
