[package]
name = "dreamer-sdk"
description = "Write Dreamer extensions in Rust: stdio JSON-RPC with typed calls and notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
api = { path = "../api" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "sync", "rt", "macros"] }

[dev-dependencies]
client = { path = "../client" }
platform = { path = "../platform" }
prost = "0.14.5"
tmux-backend = { path = "../tmux-backend" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process"] }

[lints]
workspace = true
