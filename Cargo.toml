[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "xtask"]
default-members = ["crates/*", "xtask"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/probablyrobot/dreamer"
publish = false

# GPUI is pinned to one upstream zed revision; gpui and its platform crates
# must always move together. See docs/dependency-baseline.md.
[workspace.dependencies]
# Published to crates.io under these names; the short keys keep `use` lines.
# The pins move with the workspace version.
api = { package = "dreamer-api", path = "crates/api", version = "=0.9.0" }
app-protocol = { package = "dreamer-app-protocol", path = "crates/app-protocol", version = "=0.9.0" }
view-tree = { package = "dreamer-view-tree", path = "crates/view-tree", version = "=0.9.0" }
client = { package = "dreamer-client", path = "crates/client", version = "=0.9.0" }
domain = { package = "dreamer-domain", path = "crates/domain", version = "=0.9.0" }
ghostty-sys = { package = "dreamer-ghostty-sys", path = "crates/ghostty-sys", version = "=0.9.0" }
perf = { package = "dreamer-perf", path = "crates/perf", version = "=0.9.0" }
platform = { package = "dreamer-platform", path = "crates/platform", version = "=0.9.0" }
providers = { package = "dreamer-providers", path = "crates/providers", version = "=0.9.0" }
terminal-core = { package = "dreamer-terminal-core", path = "crates/terminal-core", version = "=0.9.0" }
terminal-ghostty = { package = "dreamer-terminal-ghostty", path = "crates/terminal-ghostty", version = "=0.9.0" }
tmux-backend = { package = "dreamer-tmux-backend", path = "crates/tmux-backend", version = "=0.9.0" }
tmux-protocol = { package = "dreamer-tmux-protocol", path = "crates/tmux-protocol", version = "=0.9.0" }
web-component = { package = "dreamer-web-component", path = "crates/web-component", version = "=0.9.0" }
wire = { package = "dreamer-wire", path = "crates/wire", version = "=0.9.0" }
workspace-config = { package = "dreamer-workspace-config", path = "crates/workspace-config", version = "=0.9.0" }
workspace-host = { package = "dreamer-workspace-host", path = "crates/workspace-host", version = "=0.9.0" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "6ceb6fee8738274589b59139df27efc191ec2231", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "6ceb6fee8738274589b59139df27efc191ec2231", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Zed's workspace patches these crates and GPUI depends on the patched
# behavior. Patches in a dependency's workspace do not apply to ours, so they
# are repeated here at the revisions zed pins at the GPUI revision above.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
