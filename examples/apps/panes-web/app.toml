# A web app: its view is web/index.html, which lists the panes through
# the bridge (window.dreamer.call), under the grant below. In a terminal
# the pane shows the page's address.
# Run it with: dream app install examples/apps/panes-web, then dream app launch NAME
# with the name the install prints
schema_version = 2
id = "dreamer.panes-web"
version = "0.1.0"
title = "Panes (web)"
capabilities = ["tmux.topology"]

[package]
description = "The panes of every session, as a web page"
license = "Apache-2.0"
repository = "https://github.com/probablyrobot/dreamer"

[web]
# Origins the page may also navigate to; they never get the bridge.
allow = ["https://tmux.github.io"]
