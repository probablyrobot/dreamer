name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

# Linux only. macOS is verified by the local gate on the development Mac
# (AGENTS.md). `cargo xtask policy` fails if any workflow uses a macOS runner.

jobs:
  lint:
    name: lint and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
      - run: cargo xtask policy
      - run: cargo xtask headless --check
      - name: Cache pinned native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dreamer/deps
          key: deps-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/baseline.toml') }}
      - run: cargo xtask deps prepare --locked
      - run: cargo xtask bindings --check
      - run: cargo xtask api --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  linux-x86_64:
    name: build and test (linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-x86_64
      - name: Cache pinned native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dreamer/deps
          key: deps-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/baseline.toml') }}
      - run: cargo xtask deps prepare --locked
      - name: Build the pinned tmux baseline
        run: |
          sudo apt-get install -y --no-install-recommends libevent-dev libncurses-dev bison
          echo "DREAMER_TMUX=$(cargo xtask deps tmux | tail -n 1)" >> "$GITHUB_ENV"
      - run: cargo build --workspace --all-targets --locked
      - name: Generate snapshot fixtures
        run: cargo run --locked -p terminal-ghostty --bin snapshot-fixtures -- target/snapshot-fixtures
      - name: Upload this architecture's snapshot fixtures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots-x86_64-unknown-linux-gnu
          path: target/snapshot-fixtures/
          if-no-files-found: ignore
      - run: cargo test --workspace --locked

  linux-aarch64:
    name: headless cross-build (linux arm64, emulated tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET: aarch64-unknown-linux-gnu
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain and target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: Install cross linker and user-mode emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-aarch64
      - name: Cache pinned native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dreamer/deps
          key: deps-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/baseline.toml') }}
      - run: cargo xtask deps prepare --locked --target "$TARGET"
      - name: Generate snapshot fixtures under emulation
        run: cargo run --locked --target "$TARGET" -p terminal-ghostty --bin snapshot-fixtures -- target/snapshot-fixtures
      - name: Upload this architecture's snapshot fixtures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots-aarch64-unknown-linux-gnu
          path: target/snapshot-fixtures/
          if-no-files-found: ignore
      # Emulated runs are correctness evidence only, never performance evidence.
      - name: Test headless crates under emulation
        run: |
          cargo test --locked --target "$TARGET" $(cargo xtask headless --cargo-args-without-tmux)
          # No ARM64 tmux baseline binary exists here: unit tests only. The
          # tmux integration suite runs natively on x86-64 and macOS.
          cargo test --locked --target "$TARGET" --lib --bins $(cargo xtask headless --needs-tmux)
      - name: Run headless binaries under emulation
        run: |
          cargo build --locked --release --target "$TARGET" $(cargo xtask headless --cargo-args)
          for bin in dreamerd dream dreamer-termapp; do
            file "target/$TARGET/release/$bin"
            qemu-aarch64 -L /usr/aarch64-linux-gnu "target/$TARGET/release/$bin" --version
          done


  arch-package:
    name: arch package (makepkg, install, run)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      # base-devel, pinned by digest. Arch is rolling: the job updates the
      # system before building, as an Arch user would.
      image: archlinux:base-devel@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239
    steps:
      - name: Install build and runtime packages
        run: >-
          pacman -Syu --noconfirm --needed git rustup tmux ttf-jetbrains-mono-nerd pkgconf curl xz
          fontconfig freetype2 libxkbcommon libxkbcommon-x11 libx11 libxcb
          wayland vulkan-icd-loader
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the package as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder bash -c "cd '$GITHUB_WORKSPACE' && cargo xtask package --platform arch"
      - name: Install the package and run what it installed
        run: |
          pacman -U --noconfirm target/package/arch/dreamer-*.pkg.tar.zst
          pacman -Ql dreamer
          # No build-directory paths in the installed binaries.
          if grep -l "package/arch/src" /usr/bin/dreamer /usr/bin/dreamerd /usr/bin/dream; then
            echo "build paths leaked into the binaries above"; exit 1
          fi
          dreamerd --self-check
          dream --version
          # No display in CI: the app must say so and exit 4.
          set +e; dreamer --smoke; code=$?; set -e
          test "$code" -eq 4
          # The installed CLI starts the installed daemon and drives an
          # isolated tmux server.
          tmux -L ci-arch -f /dev/null new-session -d -s main "sleep 600"
          export DREAMER_RUNTIME_DIR=/tmp/drm-arch/rt DREAMER_STATE_DIR=/tmp/drm-arch/st DREAMER_FORBID_DEFAULT_TMUX=1
          dream ls -L ci-arch | tee /tmp/ls.txt
          grep -q 'main' /tmp/ls.txt
          dream shutdown
          tmux -L ci-arch kill-server
