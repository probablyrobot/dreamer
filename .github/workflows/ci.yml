name: ci

on:
  pull_request:
  workflow_dispatch:

# A new push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Git dependencies through git itself, so the URL rewrite below applies.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

# Linux only. macOS is verified by the local gate on the development Mac
# (AGENTS.md). `cargo xtask policy` fails if any workflow uses a macOS runner.
#
# Per pull request this is the one Linux job the Mac cannot stand in for:
# x86-64 lint, policy, build, and test. The slower Linux checks (remote
# acceptance, ARM64 emulation, Arch package, tarball) are in full.yml; the
# Mac's full gate runs clippy, the headless tests, and remote acceptance on
# ARM64 Linux in a container before every push.

jobs:
  linux-x86_64:
    name: lint, build and test (linux x86-64)
    runs-on: ubuntu-24.04
    # A cold Kosmonaut server build (once per pin, then cached) adds about 15.
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cargo fetches every git source in Cargo.lock, optional ones too, so
      # every job needs the private Kosmonaut repository (read-only token).
      - name: Access to the private Kosmonaut repository
        env:
          KOSMONAUT_TOKEN: ${{ secrets.KOSMONAUT_TOKEN }}
        run: git config --global url."https://x-access-token:${KOSMONAUT_TOKEN}@github.com/DeytaHQ/".insteadOf "https://github.com/DeytaHQ/"
      - name: Free runner disk
        # The workspace's debug target fills the runner; drop toolchains this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Lint and policy first, so a formatting or policy failure is reported
      # within a few minutes.
      - run: cargo fmt --all --check
      - name: Install GUI and tmux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libevent-dev libncurses-dev bison
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-x86_64
      - run: cargo xtask policy
      - run: cargo xtask headless --check
      - name: Cache pinned native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dreamer/deps
          key: deps-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/baseline.toml') }}
      - run: cargo xtask deps prepare --locked
      - run: cargo xtask bindings --check
      - run: cargo xtask api --check
      - run: cargo xtask schemes --check
      - run: cargo xtask icons --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The embedded Kosmonaut memory provider is behind a feature; the
      # line above checks the build without it.
      - run: cargo clippy -p memory -p dreamer-server --features dreamer-server/kosmonaut --all-targets --locked -- -D warnings
      - name: Build the pinned tmux baseline
        run: echo "DREAMER_TMUX=$(cargo xtask deps tmux | tail -n 1)" >> "$GITHUB_ENV"
      - run: cargo build --workspace --all-targets --locked
      # The benchmark harness still works: a few panes, debug binaries, on a
      # shared runner. A correctness check only; the numbers are discarded
      # and are not performance evidence.
      - name: Benchmark harness smoke (not performance evidence)
        run: |
          rm -rf target/bench
          cargo xtask bench headless --panes 4 --debug
          cargo xtask bench report target/bench/headless-*.json
          cargo xtask bench remote --samples 20 --debug
          cargo xtask bench report target/bench/remote-*.json
          rm -rf target/bench
      - name: Generate snapshot fixtures
        run: cargo run --locked -p dreamer-terminal-ghostty --bin snapshot-fixtures -- target/snapshot-fixtures
      - name: Upload this architecture's snapshot fixtures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshots-x86_64-unknown-linux-gnu
          path: target/snapshot-fixtures/
          if-no-files-found: ignore
      - run: cargo test --workspace --locked
      # Server mode's tests run each against a kosmonaut-server of their
      # own. No image is published, so the server is built from the pinned
      # commit Cargo already fetched (Cargo.lock), with its gRPC feature,
      # once per pin: the binary is cached under the commit.
      - name: Cache the Kosmonaut server
        id: kosmonaut-server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dreamer/kosmonaut-server
          key: kosmonaut-server-dbd5af275a7efa3f2ff3ca45afc45b40a214430e-grpc-${{ runner.os }}-${{ runner.arch }}
      - name: Build the Kosmonaut server
        if: steps.kosmonaut-server.outputs.cache-hit != 'true'
        run: |
          src=$(ls -d ~/.cargo/git/checkouts/kosmonaut-*/dbd5af2)
          CARGO_TARGET_DIR="$RUNNER_TEMP/kosmonaut-target" cargo build --release --locked \
            --manifest-path "$src/crates/kosmonaut-server/Cargo.toml" --features grpc --bin kosmonaut-server
          mkdir -p ~/.cache/dreamer/kosmonaut-server
          cp "$RUNNER_TEMP/kosmonaut-target/release/kosmonaut-server" ~/.cache/dreamer/kosmonaut-server/
          rm -rf "$RUNNER_TEMP/kosmonaut-target"
      - name: Test the Kosmonaut memory provider, embedded and on a server
        run: |
          export DREAMER_KOSMONAUT_SERVER="$HOME/.cache/dreamer/kosmonaut-server/kosmonaut-server"
          cargo test --locked -p memory --features kosmonaut
          cargo test --locked -p dreamer-server --features kosmonaut --test memory
          cargo test --locked -p dreamer-server --features kosmonaut --bin dreamerd memories::openai
