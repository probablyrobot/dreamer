# Draft a GitHub release for a version tag with the x86-64 Linux archives:
# the generic desktop tarball (which packaging/install.sh downloads) and
# the headless server archive, each checked on fresh ubuntu:24.04
# containers first, and the Linux Dreamer Web component (Chromium for web
# panes, which `dream web install` adds), checked by drawing a page with
# it offscreen. The macOS zip and the ARM64 archives are built and
# checked on the development Mac (no macOS or ARM64 runners) and added by
# `cargo xtask release`, with the build report; see docs/packaging.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-x86-64:
    name: release linux archives (x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
            libevent-dev libncurses-dev bison rpm
      - run: cargo xtask deps prepare --locked
      - run: cargo xtask package --platform linux
      - run: cargo xtask package --platform deb
      - run: cargo xtask package --platform rpm
      - run: cargo xtask package --platform server
      - name: The archives and packages on fresh containers
        run: cargo xtask package --fresh --arch amd64
      # The pinned CEF distribution, checksum-verified; the component is
      # checked by drawing a page from it with no display.
      - name: Dreamer Web for Linux
        run: cargo xtask package --platform web
      - name: Draft the release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" --clobber \
            target/package/linux/dreamer-x86_64-unknown-linux-gnu.tar.gz \
            target/package/linux/dreamer-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            target/package/server/dreamer-server-*-x86_64-unknown-linux-gnu.tar.gz \
            target/package/server/dreamer-server-*-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            target/package/linux/dreamer-*-x86_64-unknown-linux-gnu.deb \
            target/package/linux/dreamer-*-x86_64-unknown-linux-gnu.deb.sha256 \
            target/package/linux/dreamer-*-x86_64-unknown-linux-gnu.rpm \
            target/package/linux/dreamer-*-x86_64-unknown-linux-gnu.rpm.sha256 \
            target/package/linux/dreamer-web-*-x86_64-unknown-linux-gnu.tar.gz \
            target/package/linux/dreamer-web-*-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            target/package/linux/dreamer-web-*-x86_64-unknown-linux-gnu.tar.gz.json \
            target/package/fresh-amd64.json \
            packaging/install.sh
