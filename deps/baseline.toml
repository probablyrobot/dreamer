# Pinned native dependencies. Machine-readable; read by `cargo xtask deps`
# and by crates/ghostty-sys/build.rs. Human summary: docs/dependency-baseline.md.
# Changing a pin requires re-running the parser, renderer, ABI, and native
# smoke tests (spec section 2.2).

[ghostty]
version = "1.0.1"
tag = "vt-1.0.1"
commit = "108cacb17ed8990840cd14abfce43d8ed8503ca1"
url_base = "https://release.files.ghostty.org/libghostty-vt/1.0.1"
source = "libghostty-vt-1.0.1.tar.gz"
source_sha256 = "333dfce97641ef9b536bb9e08907ad86abaaada50e8f7417b70d9284adef37aa"
deps = "libghostty-vt-1.0.1-deps.tar.gz"
deps_sha256 = "91a4e10960a52bf5bf4b15aa2a2cddaff8a89d6cd903d3055bda4fd17de3356d"
minisign_key = "RWQlAjJC23149WL2sEpT/l0QKy7hMIFhYdQOFy0Z7z7PbneUgvlsnYcV"
optimize = "ReleaseFast"
cpu = "baseline"
# Default feature set: every optional VT feature (snapshots, render state,
# input encoding, selection, search, Kitty graphics).
vt_features = "default"

[zig]
version = "0.17.1"
url_base = "https://ziglang.org/download/0.17.1"
aarch64-macos = "75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d"
x86_64-linux = "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a"
aarch64-linux = "a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795"

# Rust target triple -> Zig target used to build libghostty-vt.
# Linux pins the Ubuntu 24.04 glibc baseline; macOS pins the 15.0 deployment target.
[targets]
aarch64-apple-darwin = "aarch64-macos.15.0"
x86_64-unknown-linux-gnu = "x86_64-linux-gnu.2.39"
aarch64-unknown-linux-gnu = "aarch64-linux-gnu.2.39"

# tmux baseline for integration tests. Built from source where the system
# package is older (Ubuntu 24.04 ships 3.4). Never installed system-wide.
[tmux]
version = "3.8"
url = "https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz"
sha256 = "e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e"

# Default terminal font: JetBrains Mono patched with Nerd Font icons, the
# Mono variant (icons one cell wide). SIL OFL 1.1; bundled into the macOS
# app and the generic Linux tarball (Arch depends on ttf-jetbrains-mono-nerd).
[nerdfonts]
version = "3.5.1"
url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/JetBrainsMono.tar.xz"
sha256 = "04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf"
family = "JetBrainsMono Nerd Font Mono"
files = "JetBrainsMonoNerdFontMono-Regular.ttf JetBrainsMonoNerdFontMono-Bold.ttf JetBrainsMonoNerdFontMono-Italic.ttf JetBrainsMonoNerdFontMono-BoldItalic.ttf OFL.txt"
# More bundled families, same Nerd Fonts release; each license file is
# shipped renamed (`license` in the archive -> `license_as`).
extra = "nerdfonts-fira-code nerdfonts-hack nerdfonts-cascadia-code nerdfonts-source-code-pro"

# Fira Code, SIL OFL 1.1 (no italic styles).
[nerdfonts-fira-code]
url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/FiraCode.tar.xz"
sha256 = "68e3bd6164864b8b514605bc34e3a87ac401c8c48682fcce6478c70263340207"
family = "FiraCode Nerd Font Mono"
files = "FiraCodeNerdFontMono-Regular.ttf FiraCodeNerdFontMono-Bold.ttf"
license = "LICENSE"
license_as = "OFL-FiraCode.txt"

# Hack, MIT plus the Bitstream Vera license.
[nerdfonts-hack]
url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/Hack.tar.xz"
sha256 = "cdd389472e10e2261520140ff1b382b4f8a226af5fd0b2735b975d31151d9c3c"
family = "Hack Nerd Font Mono"
files = "HackNerdFontMono-Regular.ttf HackNerdFontMono-Bold.ttf HackNerdFontMono-Italic.ttf HackNerdFontMono-BoldItalic.ttf"
license = "LICENSE.md"
license_as = "LICENSE-Hack.md"

# Cascadia Code (as CaskaydiaCove, the Nerd Fonts name), SIL OFL 1.1.
[nerdfonts-cascadia-code]
url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/CascadiaCode.tar.xz"
sha256 = "ae598e9401e2846aa3ee364513715de0490b844a4b54f0768991f45f23aa8369"
family = "CaskaydiaCove Nerd Font Mono"
files = "CaskaydiaCoveNerdFontMono-Regular.ttf CaskaydiaCoveNerdFontMono-Bold.ttf CaskaydiaCoveNerdFontMono-Italic.ttf CaskaydiaCoveNerdFontMono-BoldItalic.ttf"
license = "LICENSE"
license_as = "OFL-CascadiaCode.txt"

# Source Code Pro (as SauceCodePro, the Nerd Fonts name), SIL OFL 1.1.
[nerdfonts-source-code-pro]
url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/SourceCodePro.tar.xz"
sha256 = "50ead7bb7addce27cf4b55f4fffb669b5f1899fece675fad623a2a75a478c8c7"
family = "SauceCodePro Nerd Font Mono"
files = "SauceCodeProNerdFontMono-Regular.ttf SauceCodeProNerdFontMono-Bold.ttf SauceCodeProNerdFontMono-Italic.ttf SauceCodeProNerdFontMono-BoldItalic.ttf"
license = "LICENSE.txt"
license_as = "OFL-SourceCodePro.txt"

# Chromium Embedded Framework for web panes (desktop only, behind the
# `web` feature of dreamer-app; headless executables never use it). The
# `cef` crate (tauri-apps/cef-rs, pinned exactly in Cargo.toml) binds this
# release; `cargo xtask deps web` unpacks it where that crate's build
# script expects it (CEF_PATH/<version>/<os_arch>), so the crate's own
# download of a changing index is never used. On Linux the build does not
# use it (nothing links libcef.so); the Dreamer Web component is made from it. The CDN publishes SHA-1
# only; the SHA-256 is of the file whose SHA-1 matched the CDN's index.
[cef]
version = "156.0.30"
chromium = "156.0.8078.96"
crate = "156.6.0"
aarch64-apple-darwin = "https://cef-builds.spotifycdn.com/cef_binary_156.0.30%2Bg6028375%2Bchromium-156.0.8078.96_macosarm64_minimal.tar.bz2"
aarch64-apple-darwin-name = "cef_binary_156.0.30+g6028375+chromium-156.0.8078.96_macosarm64_minimal.tar.bz2"
aarch64-apple-darwin-sha256 = "731b599e78c71bf33530d65bfa18963f7d1d59902c1f381f5452188e5116b855"
aarch64-apple-darwin-sha1 = "6393d8a838d3b29f6b6939b970b5931dde2082aa"
aarch64-apple-darwin-dir = "cef_macos_aarch64"
x86_64-unknown-linux-gnu = "https://cef-builds.spotifycdn.com/cef_binary_156.0.30%2Bg6028375%2Bchromium-156.0.8078.96_linux64_minimal.tar.bz2"
x86_64-unknown-linux-gnu-name = "cef_binary_156.0.30+g6028375+chromium-156.0.8078.96_linux64_minimal.tar.bz2"
x86_64-unknown-linux-gnu-sha256 = "356db99d653698aa9ba78b22965032b4fa5b23ba079ffdbaa5d28a8530f04011"
x86_64-unknown-linux-gnu-sha1 = "0b4c2189e3b93033bbef13add1a86f66849c1e62"
x86_64-unknown-linux-gnu-dir = "cef_linux_x86_64"

# Build tools for CEF's C++ wrapper library (cmake with the Ninja
# generator, run by the cef-dll-sys build script; macOS only, as Linux
# builds no wrapper). Only `cargo xtask deps web` fetches them; they are
# put on PATH for the web build only.
[cmake]
version = "4.4.5"
aarch64-apple-darwin = "https://github.com/Kitware/CMake/releases/download/v4.4.5/cmake-4.4.5-macos-universal.tar.gz"
aarch64-apple-darwin-sha256 = "679e77a96b9ef9484cc6c1445255fc4f84206b48a65420efbedf16bdab55fbff"
aarch64-apple-darwin-bin = "CMake.app/Contents/bin"

[ninja]
version = "1.13.2"
aarch64-apple-darwin = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-mac.zip"
aarch64-apple-darwin-sha256 = "c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b"
